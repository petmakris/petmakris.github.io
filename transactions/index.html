<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build" content="bdb270a61ce3">
<meta name="theme-color" content="#1565c0">
<title>Transaction playground</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1565c0; --primary-dark: #0d47a1;
    --surface: #ffffff; --surface-soft: #eef1f5; --bg: #f4f6f8; --text: #1a1a1a; --text2: #4a4a4a; --line: #d9dde3;
    --text-strong: #131a22; --text-dim: #61707f; --border: #d7dde5;
    --ok: #1b5e20; --warn: #b26a00; --err: #b71c1c; --chip: #e8eef7;
    --t-plain:#3c4c5b; --t-edge:#3a6d99; --t-internal:#a2560a; --t-service:#0c6d63;
    --t-cheap:#7c8a97; --t-hot:#a3364f; --t-good:#2c6b4c; --t-dropped:#98a2ad;
    --t-internal-bg:#f8ecdd; --t-hot-bg:#f8e6ea; --t-good-bg:#e2f0e8;
    --t-edge-bg:#e4edf5; --t-service-bg:#dff0ed; --t-cheap-bg:#eef0f4;
    --rail-a:.16;
    --code-bg: #fbfcfd; --kw: #7c3aed; --ann: #b45309; --str: #0f766e; --cm: #6b7280; --ty: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 Roboto, system-ui, sans-serif; }
  .appbar { background: var(--primary); color: #fff; padding: 12px 28px; box-shadow: 0 2px 4px rgba(0,0,0,.2); position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 24px; }
  .appbar h1 { margin: 0; font-size: 19px; font-weight: 500; }
  .appbar .tabs { display: flex; gap: 4px; margin-left: auto; }
  .appbar .tab { padding: 6px 12px; border-radius: 4px; font-size: 13.5px; opacity: .85; }
  .appbar .tab.on { background: rgba(255,255,255,.18); opacity: 1; font-weight: 500; }
  main { max-width: 1560px; margin: 0 auto; padding: 20px 28px 64px; }
  .scenario-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .scenario-bar h2 { margin: 0; font-size: 20px; font-weight: 500; }
  .scenario-bar .sub { color: var(--text2); font-size: 14px; }
  .pill { border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 4px 12px; font-size: 13px; color: var(--text2); }
  .pill.on { border-color: var(--primary); color: var(--primary-dark); background: #e8f0fe; font-weight: 500; }
  .grid { display: grid; grid-template-columns: minmax(520px, 46%) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24); overflow: hidden; margin-bottom: 16px; }
  .card-head { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text2); }
  .card-head .file { font-family: "Roboto Mono", monospace; color: var(--text-strong); font-weight: 500; font-size: 13px; }
  .card-head .role { margin-left: auto; }
  pre.code { margin: 0; padding: 14px 18px; background: var(--code-bg); font: 13px/1.75 "Roboto Mono", ui-monospace, monospace; color: var(--text); overflow-x: auto; }
  .kw { color: var(--kw); font-weight: 500; } .ann { color: var(--ann); } .str { color: var(--str); } .cm { color: var(--cm); font-style: italic; } .ty { color: var(--ty); }
  .tg { display: inline-block; border: 1px solid #9aa3ad; border-bottom: 2px solid var(--primary); border-radius: 4px; padding: 0 22px 0 6px; background: #fff; cursor: pointer; position: relative; line-height: 1.45; }
  .tg::after { content: ""; position: absolute; right: 7px; top: 45%; border: 4px solid transparent; border-top-color: var(--primary); }
  .tg.off { color: var(--text-dim); border-bottom-color: #c5cbd3; text-decoration: line-through; }
  .tg.changed { background: #fff7e6; border-bottom-color: var(--warn); }
  .lineno { display: inline-block; width: 2.2em; color: #a0a8b3; user-select: none; }
  .dim { color: #8a93a0; }
  .gutter-note { display: inline-block; margin-left: 18px; color: var(--text-dim); font-size: 12px; font-style: italic; }
  .yaml .k { color: var(--ty); }
  .actions { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); background: #fff; }
  .btn { display: inline-block; background: var(--primary); color: #fff; border-radius: 4px; padding: 8px 16px; font-weight: 500; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .btn.outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); box-shadow: none; }
  .diffchip { margin-left: auto; font-size: 12.5px; color: var(--warn); background: #fff7e6; border-radius: 12px; padding: 3px 10px; }
  .section { padding: 14px 16px; }
  .label { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; }
  .canvas { overflow-x: auto; overscroll-behavior-x: contain; padding: 4px 0; }
  .explain p { margin: 0 0 10px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .chip { display: inline-block; border-radius: 12px; padding: 2px 10px; font-size: 12.5px; font-weight: 500; background: var(--chip); color: var(--primary-dark); }
  .chip.ok { background: #e8f5e9; color: var(--ok); } .chip.warn { background: #fff3e0; color: var(--warn); } .chip.err { background: #ffebee; color: var(--err); } .chip.muted { background: #eceff1; color: var(--text2); }
  .discover { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .disc { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 13.5px; background: #fff; }
  .disc.found { border-color: var(--ok); background: #f1f8f2; }
  .disc .t { font-weight: 500; }
  .disc .h { color: var(--text2); font-size: 12.5px; }
  .disc .badge { float: right; font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--ok); }
  .disc.locked .badge { color: #9aa3ad; }
  .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 8px; }
  @media (max-width: 900px) { .options { grid-template-columns: 1fr; } }
  .option { background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: 14px 16px; cursor: pointer; display: flex; gap: 14px; }
  .option:hover { border-color: var(--primary); }
  .option.selected { border-color: var(--primary); background: #e8f0fe; }
  .option .letter { background: #eceff1; color: var(--text2); font-weight: 700; width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .option.selected .letter { background: var(--primary); color: #fff; }
  .option h3 { margin: 0 0 4px; font-size: 16px; }
  .option p { margin: 0; color: var(--text2); font-size: 14px; }
  h2.q { font-size: 20px; font-weight: 500; margin: 28px 0 6px; }
  .lead { color: var(--text2); margin: 0 0 12px; max-width: 900px; }

  /* sequence grammar, verbatim from the page that drew the PMP-272 timelines */
  svg.seq{display:block;height:auto}
  .seq text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif}
  .seq .actor-box{fill:var(--surface);stroke:color-mix(in srgb,var(--text-dim) 55%,transparent);stroke-width:1.2}
  .seq .actor-box.t-edge{stroke:var(--t-edge)} .seq .actor-box.t-internal{stroke:var(--t-internal)}
  .seq .actor-box.t-service{stroke:var(--t-service)} .seq .actor-box.t-cheap{stroke:var(--t-cheap)}
  .seq .actor-box.t-hot{stroke:var(--t-hot)} .seq .actor-box.t-good{stroke:var(--t-good)}
  .seq .actor-label{fill:var(--text-strong);font-weight:500;font-size:10px;font-family:'IBM Plex Mono',ui-monospace,monospace}
  .seq .lane{stroke:color-mix(in srgb,var(--text-dim) 45%,transparent);stroke-dasharray:3 4;stroke-width:1;fill:none}
  .seq .arr{stroke:var(--t-plain);stroke-width:1.3;fill:none}
  .seq .arr.dashed{stroke-dasharray:5 4}
  .seq .arr-head{fill:var(--t-plain)}
  .seq .arrow-label{fill:var(--text-strong);font-size:11.5px;font-weight:500}
  .seq .arrow-sub{fill:var(--text-dim);font-size:10px;font-family:'IBM Plex Mono',ui-monospace,monospace}
  .seq .row-num,.seq .row-note{fill:var(--text-dim);font-size:10px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .seq .row-num{font-weight:500}
  .seq .arr.t-edge{stroke:var(--t-edge)} .seq .arr.t-internal{stroke:var(--t-internal)}
  .seq .arr.t-service{stroke:var(--t-service)} .seq .arr.t-cheap{stroke:var(--t-cheap)}
  .seq .arr.t-good{stroke:var(--t-good)} .seq .arr.t-dropped{stroke:var(--t-dropped)}
  .seq .arr.t-hot{stroke:var(--t-hot)}
  .seq .arr.t-hot,.seq .arr.t-good{stroke-width:1.9}
  .seq .arr-head.t-edge{fill:var(--t-edge)} .seq .arr-head.t-internal{fill:var(--t-internal)}
  .seq .arr-head.t-service{fill:var(--t-service)} .seq .arr-head.t-cheap{fill:var(--t-cheap)}
  .seq .arr-head.t-hot{fill:var(--t-hot)} .seq .arr-head.t-good{fill:var(--t-good)}
  .seq .arr-head.t-dropped{fill:var(--t-dropped)}
  .seq .arrow-label.t-edge,.seq .arrow-sub.t-edge,.seq .row-note.t-edge{fill:var(--t-edge)}
  .seq .arrow-label.t-internal,.seq .arrow-sub.t-internal,.seq .row-note.t-internal{fill:var(--t-internal)}
  .seq .arrow-label.t-service,.seq .arrow-sub.t-service,.seq .row-note.t-service{fill:var(--t-service)}
  .seq .arrow-label.t-cheap,.seq .arrow-sub.t-cheap,.seq .row-note.t-cheap{fill:var(--t-cheap)}
  .seq .arrow-label.t-hot,.seq .arrow-sub.t-hot,.seq .row-note.t-hot{fill:var(--t-hot);font-weight:600}
  .seq .arrow-label.t-good,.seq .arrow-sub.t-good,.seq .row-note.t-good{fill:var(--t-good);font-weight:600}
  .seq .arrow-label.t-dropped,.seq .arrow-sub.t-dropped{fill:var(--t-dropped);text-decoration:line-through}
  .seq .band{fill:var(--surface-soft);stroke:var(--border);stroke-width:1}
  .seq .band.t-internal{fill:var(--t-internal-bg);stroke:var(--t-internal)}
  .seq .band.t-hot{fill:var(--t-hot-bg);stroke:var(--t-hot)}
  .seq .band.t-good{fill:var(--t-good-bg);stroke:var(--t-good)}
  .seq .band-text{fill:var(--text-dim);font-size:10.5px;font-family:'IBM Plex Mono',ui-monospace,monospace}
  .seq .band-text.t-internal{fill:var(--t-internal);font-weight:500}
  .seq .band-text.t-hot{fill:var(--t-hot);font-weight:500}
  .seq .band-text.t-good{fill:var(--t-good);font-weight:500}
  .seq .phase-rule{stroke:var(--border);stroke-width:1}
  .seq .phase-label{fill:var(--text-dim);font-size:9px;letter-spacing:1.4px;font-weight:700;text-transform:uppercase;font-family:'IBM Plex Mono',ui-monospace,monospace}
  .seq .legend-swatch{stroke:var(--t-plain);stroke-width:3;stroke-linecap:round}
  .seq .legend-swatch.t-edge{stroke:var(--t-edge)} .seq .legend-swatch.t-internal{stroke:var(--t-internal)}
  .seq .legend-swatch.t-service{stroke:var(--t-service)} .seq .legend-swatch.t-hot{stroke:var(--t-hot)}
  .seq .legend-swatch.t-good{stroke:var(--t-good)} .seq .legend-swatch.t-dropped{stroke:var(--t-dropped)}
  .seq .legend-text{fill:var(--text-dim);font-size:11.5px;font-family:'IBM Plex Mono',ui-monospace,monospace}
  .seq .rail{stroke-width:1.1}
  .seq .rail.t-hot{fill:color-mix(in srgb,var(--t-hot) calc(var(--rail-a)*100%),transparent);stroke:var(--t-hot)}
  .seq .rail.t-good{fill:color-mix(in srgb,var(--t-good) calc(var(--rail-a)*100%),transparent);stroke:var(--t-good)}
  .seq .rail-cap{font-size:9px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600}
  .seq .rail-cap.t-hot{fill:var(--t-hot)} .seq .rail-cap.t-good{fill:var(--t-good)}

  .tg select, .tg input { font: inherit; border: 0; background: transparent; color: inherit; padding: 0; }
  .tg input[type=text] { width: 5em; }
  .key-form { display: flex; gap: 8px; margin-top: 10px; }
  .key-form input { flex: 1; border: 1px solid #8a8f98; border-radius: 4px; padding: 6px 10px; font: inherit; }
  .muted { color: var(--text2); font-size: 13.5px; }
  .err { color: var(--err); }
  #ask-out { padding: 0 16px 14px; font-size: 15px; }
  #ask-out p { margin: 0 0 10px; }
  .tab { cursor: pointer; }
  .pill { cursor: pointer; }
</style>
</head>
<body>
<div class="appbar"><h1>Transaction playground</h1><div class="tabs" id="tabs"></div></div>
<main>
  <div class="scenario-bar"><h2 id="title"></h2></div>
  <p class="muted" id="intro"></p>
  <div class="scenario-bar" id="presets"></div>
  <div class="grid">
    <div id="left"></div>
    <div id="right">
      <div class="card"><div class="card-head"><span class="file">Timeline</span><span id="timeline-sub"></span></div><div class="section"><div class="canvas" id="diagram"></div></div></div>
      <div class="card"><div class="card-head"><span class="file">What happened, and why</span><span class="muted">templated from the timeline</span></div><div class="section explain" id="explain"></div></div>
      <div class="card"><div class="card-head"><span class="file">Discoveries</span><span id="disc-count" class="role"></span></div><div class="section discover" id="discoveries"></div></div>
    </div>
  </div>
</main>
<script>
// ---- src/seqrender.js ----
(function (root) {
const ROW_H=34, ACTOR_W=124, ACTOR_GAP=12, PAD_L=54, ROWNUM_X=42, PAD_R=18,
      GUTTER_GAP=26, ACTOR_H=46, TOP=14, INSET=6, HEAD=7, BAND_H=22, SELF_W=24,
      LEGEND_H=30, RAIL_W=11;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const tc=t=>t&&t!=='plain'?' t-'+t:'';
function renderSequence(spec){
  const A=spec.actors, S=spec.steps;
  const cx={}; A.forEach((a,i)=>cx[a.id]=PAD_L+i*(ACTOR_W+ACTOR_GAP)+ACTOR_W/2);
  const lastX=PAD_L+(A.length-1)*(ACTOR_W+ACTOR_GAP)+ACTOR_W;
  const hasNote=S.some(s=>s.note);
  const noteX=lastX+GUTTER_GAP;
  const maxNote=Math.max(0,...S.filter(s=>s.note).map(s=>String(s.note).length*6.7));
  const W=(hasNote?noteX+maxNote:lastX)+PAD_R;
  const yOf=[]; let y=TOP+ACTOR_H+16, phases=[];
  S.forEach((s,i)=>{ if(s.phase){ phases.push({y:y+8,label:s.phase}); y+=ROW_H; } yOf[i]=y+ROW_H/2; y+=ROW_H; });
  const bodyEnd=y+6;
  const H=bodyEnd+(spec.legend?LEGEND_H:0)+10;
  let o=`<svg class="seq" role="img" aria-label="${esc(spec.alt||'sequence diagram')}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  (spec.rails||[]).forEach(r=>{
    const x=cx[r.actor]-RAIL_W/2, y0=yOf[r.from]-13, y1=yOf[r.to]+13;
    o+=`<rect class="rail${tc(r.tone)}" x="${x}" y="${y0}" width="${RAIL_W}" height="${y1-y0}" rx="2"/>`;
    if(r.label) o+=`<text class="rail-cap${tc(r.tone)}" x="${cx[r.actor]}" y="${y0-5}" text-anchor="middle">${esc(r.label)}</text>`;
  });
  A.forEach((a,i)=>{
    const x=PAD_L+i*(ACTOR_W+ACTOR_GAP), c=x+ACTOR_W/2;
    o+=`<path class="lane" d="M ${c} ${TOP+ACTOR_H} L ${c} ${bodyEnd}"/>`;
    o+=`<rect class="actor-box${tc(a.tone)}" x="${x}" y="${TOP}" width="${ACTOR_W}" height="${ACTOR_H}" rx="3"/>`;
    const lines=a.label.split('\n');
    lines.forEach((ln,k)=>{ o+=`<text class="actor-label" x="${c}" y="${TOP+(lines.length===1?27:18+k*13)}" text-anchor="middle">${esc(ln)}</text>`; });
  });
  phases.forEach(p=>{ o+=`<path class="phase-rule" d="M ${PAD_L-12} ${p.y-9} L ${lastX} ${p.y-9}"/>`+`<text class="phase-label" x="${PAD_L-12}" y="${p.y+4}">${esc(p.label)}</text>`; });
  let n=0;
  S.forEach((s,i)=>{
    const y=yOf[i], t=tc(s.tone);
    if(s.arrow==='band'){
      const xs=s.span?s.span.map(id=>cx[id]):[cx[A[0].id],cx[A[A.length-1].id]];
      const x0=Math.min(...xs)-46, x1=Math.max(...xs)+46;
      o+=`<rect class="band${t}" x="${x0}" y="${y-BAND_H/2}" width="${x1-x0}" height="${BAND_H}" rx="3"/>`+`<text class="band-text${t}" x="${x0+10}" y="${y+4}">${esc(s.label)}</text>`;
      return;
    }
    n++;
    o+=`<text class="row-num" x="${ROWNUM_X}" y="${y+4}" text-anchor="end">${n}</text>`;
    if(s.note) o+=`<text class="row-note${t}" x="${noteX}" y="${y+4}">${esc(s.note)}</text>`;
    if(s.arrow==='self'){
      const c=cx[s.from];
      o+=`<path class="arr${t}${s.dashed?' dashed':''}" d="M ${c} ${y-8} h ${SELF_W} v 16 h ${-SELF_W+INSET}"/>`+`<path class="arr-head${t}" d="M ${c+INSET} ${y+8} l ${HEAD} -3.6 v 7.2 z"/>`+`<text class="arrow-label${t}" x="${c+SELF_W+10}" y="${y-3}">${esc(s.label)}</text>`;
      if(s.sub) o+=`<text class="arrow-sub${t}" x="${c+SELF_W+10}" y="${y+11}">${esc(s.sub)}</text>`;
      return;
    }
    const a=cx[s.from], b=cx[s.to], dir=b>a?1:-1, x0=a+INSET*dir, x1=b-INSET*dir;
    o+=`<path class="arr${t}${s.arrow==='event'?' dashed':''}" d="M ${x0} ${y} L ${x1} ${y}"/>`+`<path class="arr-head${t}" d="M ${x1} ${y} l ${-HEAD*dir} -3.6 v 7.2 z"/>`+`<text class="arrow-label${t}" x="${(x0+x1)/2}" y="${y-6}" text-anchor="middle">${esc(s.label)}</text>`;
    if(s.sub) o+=`<text class="arrow-sub${t}" x="${(x0+x1)/2}" y="${y+13}" text-anchor="middle">${esc(s.sub)}</text>`;
  });
  if(spec.legend){
    let x=PAD_L-2; const ly=bodyEnd+18;
    spec.legend.forEach(l=>{ o+=`<path class="legend-swatch${tc(l.tone)}" d="M ${x} ${ly} h 22"/>`+`<text class="legend-text" x="${x+28}" y="${ly+4}">${esc(l.label)}</text>`; x+=22+8+l.label.length*6.6+24; });
  }
  return o+'</svg>';
}

  const api = { renderSequence };
  root.TxPlay = Object.assign(root.TxPlay || {}, api);
  if (typeof module !== 'undefined') module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

// ---- src/rules.js ----
(function (root) {
  const PROPAGATIONS = ['REQUIRED', 'REQUIRES_NEW', 'NOT_SUPPORTED', 'SUPPORTS', 'NEVER', 'MANDATORY'];

  function seconds(v) {
    if (v == null || v === '') return 0;
    if (typeof v === 'number') return v;
    const m = String(v).trim().match(/^([\d.]+)\s*(ms|s|m)?$/);
    if (!m) throw new Error('bad duration: ' + v);
    const n = parseFloat(m[1]);
    return m[2] === 'ms' ? n / 1000 : m[2] === 'm' ? n * 60 : n;
  }

  function normalizeTx(v) {
    if (!v) return null;
    if (typeof v === 'string') {
      const m = v.match(/(REQUIRES_NEW|NOT_SUPPORTED|REQUIRED|SUPPORTS|NEVER|MANDATORY)/);
      return { propagation: m ? m[1] : 'REQUIRED', rollbackFor: [] };
    }
    return { propagation: v.propagation || 'REQUIRED', rollbackFor: v.rollbackFor || [] };
  }

  function reachesProxy(frame) {
    return frame.invoke !== 'this' && frame.visibility !== 'private';
  }

  function effectiveTx(frame) {
    if (!reachesProxy(frame)) return null;
    return normalizeTx(frame.methodTx) || normalizeTx(frame.classTx);
  }

  function enter(propagation, active) {
    switch (propagation) {
      case 'REQUIRED': return { action: active ? 'join' : 'start' };
      case 'REQUIRES_NEW': return { action: active ? 'suspendStart' : 'start' };
      case 'NOT_SUPPORTED': return { action: active ? 'suspend' : 'none' };
      case 'SUPPORTS': return { action: active ? 'join' : 'none' };
      case 'NEVER': return active ? { action: 'throw', reason: 'NEVER but a transaction is active' } : { action: 'none' };
      case 'MANDATORY': return active ? { action: 'join' } : { action: 'throw', reason: 'MANDATORY but no transaction is active' };
      default: throw new Error('unknown propagation ' + propagation);
    }
  }

  function rollsBack(error, attr) {
    if (error.exceptionKind !== 'checked') return true;
    return (attr.rollbackFor || []).includes(error.kind);
  }

  const api = { PROPAGATIONS, seconds, normalizeTx, reachesProxy, effectiveTx, enter, rollsBack };
  root.TxPlay = Object.assign(root.TxPlay || {}, api);
  if (typeof module !== 'undefined') module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

// ---- src/engine.js ----
(function (root) {

  // ---- slot resolution ----------------------------------------------------
  function slotValue(scenario, values, name) {
    const slot = scenario.slots[name];
    if (!slot) throw new Error('unknown slot ' + name);
    return Object.prototype.hasOwnProperty.call(values, name) ? values[name] : slot.default;
  }
  function resolve(node, scenario, values) {
    if (Array.isArray(node)) return node.map(n => resolve(n, scenario, values));
    if (node && typeof node === 'object') {
      if (node.slot) {
        const v = slotValue(scenario, values, node.slot);
        return resolve(node.field ? (v == null ? null : v[node.field]) : v, scenario, values);
      }
      const out = {};
      for (const k of Object.keys(node)) out[k] = resolve(node[k], scenario, values);
      return out;
    }
    return node;
  }
  function resolveFrames(scenario, values) { return resolve(scenario.frames, scenario, values); }
  function resolveConfig(scenario, values) {

  // ---- discrete-event scheduler and resources -----------------------------
  class Scheduler {
    constructor() { this.now = 0; this.queue = []; this.seq = 0; }
    at(t, fn) { this.queue.push({ t, seq: this.seq++, fn }); }
    run() {
      while (this.queue.length) {

        const e = this.queue.shift(); this.now = e.t; e.fn();

    constructor(name, size) { this.name = name; this.size = size; this.free = size; this.waiters = []; }
  }
  // ops yielded by a user program: (sched, resume) => void
  function acquire(res, timeout) {
    return (sched, resume) => {
      if (res.free > 0) { res.free--; resume('ok'); return; }
      if (timeout <= 0) { resume('refused'); return; }
      const w = { resume, done: false };
      res.waiters.push(w);
      sched.at(sched.now + timeout, () => {
        if (w.done) return;
        w.done = true; res.waiters.splice(res.waiters.indexOf(w), 1); resume('timeout');

        else {

      throw fail('SQLTransientConnectionException', 500, 'no connection within connection-timeout');

      tx.conn = conn; ctx.held++;

    } else {
      emit(u, f.actor, 'connAcquired', { tx: null, conn, free: res.pool.free, size: res.pool.size, alsoHolding: ctx.held, autoCommit: true });

      emit(u, f.actor, 'connReleased', { conn, tx: null, autoCommit: true });

      suspendedHolding: ctx.suspended.filter(t => t && t.conn).length, takes });

      emit(u, f.actor, 'httpTimeout', { after: connect, kind: 'connect' });
      throw fail(r.onFailure || 'RemoteUnavailableException', 503, 'the remote is unreachable');

      throw fail(r.onFailure || 'RemoteUnavailableException', 503, 'no answer within read-timeout');

      exceptionKind: e ? e.exceptionKind : null });
    if (tx.conn) {

      tx.conn = null;
    }

    const u = ctx.user;

    if (got !== 'ok') { emit(u, f.actor, 'poolTimeout', { waited: cfg.connectionTimeout, alsoHolding: ctx.held, during: 'compensation' }); return; }
    const conn = 'c' + (++res.connSeq);

  }

    values = values || {};

    const cfg = resolveConfig(scenario, values);
    const res = { pool: new Resource('pool', cfg.poolSize), bulkheads: {}, connSeq: 0 };
    for (const f of frames) if (f.bulkhead) res.bulkheads[f.bulkhead.name] = res.bulkheads[f.bulkhead.name] || new Resource(f.bulkhead.name, Number(f.bulkhead.permits));
    const timeline = []; const sched = new Scheduler();
    const emit = (user, actor, event, detail) => timeline.push({ t: round(sched.now), user, actor, event, detail: detail || {} });
    let u = 0;
    for (const entry of resolve(scenario.entries, scenario, values)) {
      const rootFrame = frames.find(f => f.id === entry.root);
      for (let i = 0; i < Number(entry.users); i++) {

        sched.at(R.seconds(entry.startAt || 0), () => drive(sched, userProgram(user, rootFrame, frames, cfg, res, emit), undefined));
      }

(function (root) {

        case 'refused': push({ from: 'bulkhead', to: a, arrow: 'event', label: 'BulkheadFullException', tone: 'hot', phase: phase(),
          sub: `${d.size} of ${d.size} permits held, maxWaitDuration ${d.after ? fmt(d.after) : '0'}`, note: d.after ? `refused after ${fmt(d.after)}` : 'refused at once' }); break;
        case 'suspend': push({ from: a, to: a, arrow: 'self', label: `${d.propagation}: transaction suspended`, tone: d.keepsConnection ? 'hot' : 'internal',
          sub: d.keepsConnection ? 'suspension is not release: the connection stays with it' : 'nothing to release' }); break;
        case 'resume': push({ from: a, to: a, arrow: 'self', label: 'transaction resumed', tone: 'internal' }); break;

          break;

        case 'poolTimeout': push({ from: 'pool', to: a, arrow: 'event', tone: 'hot', label: `no free connection after ${fmt(d.waited)}`, note: 'connection-timeout' }); break;
        case 'rollbackOnly': push({ from: a, to: a, arrow: 'self', label: 'marked rollback-only', sub: d.exception, tone: 'hot' }); break;

        case 'compensation': push({ from: a, to: 'pool', arrow: 'request', label: 'compensation', sub: d.what, tone: 'internal' }); break;
        case 'detachedRead': push({ from: a, to: a, arrow: 'self', label: 'LazyInitializationException', sub: 'entity read outside a session', tone: 'hot' }); break;
        case 'response': {

            if (rf) push({ from: actorId(rf.actor), to: 'remote', arrow: 'request', label: 'never reached', tone: 'dropped', sub: `the remote is not called for user ${showUser}` });
          }

  if (typeof module !== 'undefined') module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

(function (root) {
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function displayValue(slot, v) {
    switch (slot.kind) {
      case 'annotation':
        if (!v) return '// no annotation';
        if (typeof v === 'object') return v.rollbackFor && v.rollbackFor.length
          ? `@Transactional(propagation = ${v.propagation}, rollbackFor = ${v.rollbackFor.join('.class, ')}.class)`
          : `@Transactional(propagation = ${v.propagation})`;
        return v === '@Transactional' ? v : `@Transactional(propagation = ${v})`;
      case 'invocation': return (slot.labels && slot.labels[v]) || v;
      case 'visibility': return v === 'package' ? '/* package-private */' : v;
      case 'bulkhead': return v ? `@Bulkhead(name = "${v.name}", maxConcurrentCalls = ${v.permits}, maxWaitDuration = ${v.wait})` : '// no bulkhead';
      case 'external': return v ? `takes ${v.takes}, answers ${v.answers}${v.reason ? ' (' + v.reason + ')' : ''}` : '';
      case 'exception': return v ? `throw new ${v.name}()  // ${v.kind}` : '// throws nothing';
      case 'flag': return String(v);
      default: return String(v);
    }
  }

  const KW = /\b(public|private|protected|class|return|new|final|void|int|throw|throws|static)\b/g;
  function highlight(text) {
    return esc(text)
      .replace(/(\/\/[^\n]*|#[^\n]*)/g, '<span class="cm">$1</span>')
      .replace(/(^|\n)(\s*)(@\w+(?:\([^)]*\))?)/g, '$1$2<span class="ann">$3</span>')
      .replace(KW, '<span class="kw">$1</span>')
      .replace(/\b([A-Z][A-Za-z]+)\b(?![^<]*>)/g, '<span class="ty">$1</span>');
  }

  function controlHtml(name, slot, value, changed) {
    const cls = 'tg' + (changed ? ' changed' : '') + ((slot.kind === 'annotation' || slot.kind === 'bulkhead') && !value ? ' off' : '');
    return `<span class="${cls}" data-slot="${esc(name)}" data-kind="${slot.kind}" tabindex="0" title="${esc(slot.help || 'click to change')}">${esc(displayValue(slot, value))}</span>`;
  }

  function renderCode(file, scenario, values, changed) {
    changed = changed || new Set();
    const parts = file.code.split(/(\{\{\w+\}\})/);
    return parts.map(p => {
      const m = p.match(/^\{\{(\w+)\}\}$/);
      if (!m) return highlight(p);
      const slot = scenario.slots[m[1]];
      if (!slot) throw new Error('unknown slot ' + m[1]);
      const v = Object.prototype.hasOwnProperty.call(values, m[1]) ? values[m[1]] : slot.default;
      return controlHtml(m[1], slot, v, changed.has(m[1]));
    }).join('');
  }

  root.TxPlay = Object.assign(root.TxPlay || {}, api);
  if (typeof module !== 'undefined') module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

      }
      case 'external': { const v = prompt('takes,answers (ok|late|4xx|5xx|unreachable)', `${cur.takes},${cur.answers}`); if (v == null) return;
        const [takes, answers] = v.split(',').map(x => x.trim()); next = { takes, answers, reason: answers === '4xx' ? 'no active policy' : undefined }; break; }
      case 'exception': { const v = prompt('name,runtime|checked (empty for none)', cur ? `${cur.name},${cur.kind}` : ''); if (v == null) return;
        next = v.trim() ? { name: v.split(',')[0].trim(), kind: (v.split(',')[1] || 'runtime').trim() } : null; break; }
      default: return;
    }
    state.values[name] = next; state.changed.add(name);
    save('txplay-values-' + state.scenario.id, state.values);
    renderLeft();
  }

  function run() {
    const s = state.scenario;
    let run;
    try { run = P.simulate(s, state.values); }
    catch (e) { $('explain').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    state.lastRun = run; state.changed = new Set();
    const spec = P.toDiagramSpec(s, run, state.values);
    $('diagram').innerHTML = P.renderSequence(spec);
    $('timeline-sub').textContent = `user ${P.slotValue(s, state.values, 'showUser')} of ${run.users}, computed from the code on the left`;
    const found = P.detect(run); found.forEach(id => state.found.add(id)); save('txplay-found', [...state.found]);
    const x = P.explain(s, run, state.values, [...state.found]);
    $('explain').innerHTML = x.paragraphs.map(p => `<p>${esc(p)}</p>`).join('') +
      `<div class="chips">${x.chips.map(c => `<span class="chip ${c.tone}">${esc(c.text)}</span>`).join('')}</div>` +
      (x.tryNext ? `<p style="margin-top:10px"><strong>${esc(x.tryNext)}</strong></p>` : '');
    renderDiscoveries(found);
    renderLeft();
    if ($('ask-out')) $('ask-out').innerHTML = '';
  }

  function renderDiscoveries(justNow) {
    const all = P.DISCOVERIES, ids = state.scenario.discoveries || all.map(d => d.id);
    $('disc-count').textContent = `${[...state.found].filter(id => ids.includes(id)).length} of ${ids.length}`;
    $('discoveries').innerHTML = all.filter(d => ids.includes(d.id)).map(d => {
      const f = state.found.has(d.id);
      return `<div class="disc ${f ? 'found' : 'locked'}"><span class="badge">${f ? (justNow.includes(d.id) ? 'FOUND NOW' : 'FOUND') : 'LOCKED'}</span><div class="t">${esc(d.title)}</div><div class="h">${esc(d.hint)}</div></div>`;
    }).join('');
  }

  function boot() {
    state.found = new Set(load('txplay-found', []));
    select(P.scenarios[0]);
  }
  document.addEventListener('DOMContentLoaded', boot);
  root.TxPlay = Object.assign(root.TxPlay || {}, { uiState: state });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
