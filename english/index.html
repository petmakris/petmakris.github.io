<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9ecee">
<title>The English Play Deck</title>
<style>/* The English Play Deck — inlined by tools/build_deck.py. Edit here, never the
   built HTML.

   The whole thing is a fixed 1920×1080 stage scaled to fit whatever screen it is
   on, so a scene looks identical on the television, on the tablet and on a
   laptop. No reflow, no surprises mid-session.

   Papa's lines sit left, hers right, like a chat. Twenty lines fit one screen
   with a gutter down the middle carrying a printer's rule. */

:root {
  --slide:  #fffdf9;
  --room:   #e9ecee;
  --ink:    #16262c;
  --soft:   #5f7278;
  --faint:  #aab7bb;
  --line:   #eae2d8;
  --A:      #1f6f7a;   /* Papa */
  --Abg:    #e4f1f2;
  --B:      #d2624a;   /* her */
  --Bbg:    #fbe7e1;

  --ui:   'Avenir Next', Avenir, 'Helvetica Neue', system-ui, sans-serif;
  --read: Charter, 'Iowan Old Style', Georgia, serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--room); color: var(--ink); font-family: var(--ui);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
:focus-visible { outline: 3px solid var(--B); outline-offset: 3px; }

.screen { display: none; height: 100%; }
.screen.on { display: block; }

/* ===========================================================  the stage  === */

#stage-wrap { position: fixed; inset: 0; display: grid; place-items: center; }
#stage {
  width: 1920px; height: 1080px; transform-origin: center center;
  background: var(--slide); position: relative; overflow: hidden;
  box-shadow: 0 30px 60px -40px rgba(20, 40, 50, .6);
}

.slide { width: 100%; height: 100%; padding: 34px 46px 30px; display: flex; flex-direction: column; }

.head {
  display: flex; justify-content: space-between; align-items: baseline;
  flex: none; margin-bottom: 20px;
}
.head .scene { font-family: var(--read); font-size: 36px; }
.head .meta { font-size: 22px; color: var(--faint); }
.head .meta b { font-weight: 700; }
.head .meta b.A { color: var(--A); }
.head .meta b.B { color: var(--B); }

/* the gutter is a real column, wide enough to breathe */
.two { flex: 1; display: grid; grid-template-columns: 1fr 90px 1fr; gap: 0 26px; min-height: 0; }
.col { display: flex; flex-direction: column; justify-content: space-evenly; }
.gut { display: flex; align-items: center; justify-content: center; }

.row { display: flex; }
.row.A { justify-content: flex-start; }
.row.B { justify-content: flex-end; }

.bub {
  font-size: 36px; line-height: 1.2; padding: 10px 22px; border-radius: 20px;
  max-width: 92%; cursor: pointer; border: 0; font-family: inherit; text-align: left;
  transition: transform .1s, box-shadow .15s;
  display: inline-flex; align-items: center; gap: 14px;
}
/* the drawing rides inside the bubble, so meaning and words arrive together */
.ic { width: 52px; height: 52px; flex: none; }
.row.A .bub { background: var(--Abg); color: var(--ink); border-bottom-left-radius: 6px; }
.row.B .bub { background: var(--Bbg); color: var(--ink); border-bottom-right-radius: 6px; }
.bub:active { transform: scale(.985); }
.bub.playing { box-shadow: 0 0 0 4px currentColor; }
.row.A .bub.playing { color: var(--A); }
.row.B .bub.playing { color: var(--B); }

/* --- the swap card, shown between the two passes --------------------------- */

.swap { width: 100%; height: 100%; display: grid; place-items: center; text-align: center; }
.swap h2 { font-family: var(--read); font-size: 92px; margin: 0 0 26px; font-weight: 400; }
.swap p { font-size: 40px; color: var(--soft); margin: 0 0 46px; }
.swap .pair { display: flex; gap: 60px; justify-content: center; font-size: 34px; }
.swap .pair div { display: flex; align-items: center; gap: 16px; }
.swap .dot { width: 26px; height: 26px; border-radius: 50%; display: inline-block; }
.swap .dot.A { background: var(--A); } .swap .dot.B { background: var(--B); }

/* ============================================================  the index === */

.index { height: 100%; overflow-y: auto; padding: 4vh 5vw 8vh; background: var(--room); }
.index h1 { font-family: var(--read); font-weight: 400; font-size: clamp(1.7rem, 4vw, 2.4rem); margin: 0 0 .3rem; }
.index .lede { color: var(--soft); font-size: clamp(.9rem, 1.6vw, 1.05rem); margin: 0 0 2.4rem; max-width: 42rem; }

.place { margin: 0 0 2.2rem; }
.place h2 {
  font-family: var(--read); font-weight: 400; font-size: clamp(1.15rem, 2.2vw, 1.5rem);
  margin: 0 0 .1rem;
}
.place .count { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: .8rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .7rem; }
.card {
  background: var(--slide); border: 1px solid var(--line); border-radius: 12px;
  padding: .85rem 1rem; cursor: pointer; text-align: left; font: inherit; color: inherit;
  transition: border-color .16s, transform .16s;
  display: flex; align-items: center; gap: .8rem;
}
.cardic { width: 2.6rem; height: 2.6rem; flex: none; }
.card .txt { min-width: 0; }
.card:hover { border-color: var(--B); transform: translateY(-2px); }
.card .n { font-size: .7rem; letter-spacing: .12em; color: var(--faint); }
.card .t { font-size: 1.02rem; margin: .12rem 0 .4rem; }
.card .new { font-size: .76rem; color: var(--A); }

/* ==========================================================  the chrome  === */

.credit { margin: 2.5rem 0 0; font-size: .78rem; color: var(--faint); }
.credit a { color: var(--soft); }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: .6rem;
  align-items: center; justify-content: center; padding: .55rem;
  background: rgba(233, 236, 238, .92); backdrop-filter: blur(10px);
  transition: opacity .35s; z-index: 5;
}
.bar.hidden { opacity: 0; pointer-events: none; }
.btn {
  border: 1px solid var(--line); background: var(--slide); color: var(--ink);
  border-radius: 999px; padding: .42rem 1rem; font: inherit; font-size: .84rem;
  cursor: pointer; transition: border-color .15s, color .15s;
}
.btn:hover { border-color: var(--B); color: var(--B); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.round { width: 2.4rem; height: 2.4rem; padding: 0; display: inline-flex;
  align-items: center; justify-content: center; font-size: 1rem; }
.bar .where { font-size: .8rem; color: var(--soft); margin: 0 .5rem; }
</style>
</head>

<script>/* The English Play Deck — inlined by tools/build_deck.py. Edit here, never the
   built HTML.

   The build injects:
     PLACES — [{place, title, scenes:[{id, title, new:[], lines:[{who, text, a}]}]}]
     AUDIO  — {clipKey: url or data: URI}

   A scene is played twice: once as printed, then a swap card, then again with the
   roles exchanged. The deck never asks anyone to choose anything — you press
   right, and it goes. */

const $ = s => document.querySelector(s);
const SCENES = PLACES.flatMap(p => p.scenes.map(s => ({ ...s, place: p.title })));

let idx = -1;        // index into SCENES; -1 means the contents screen
let swapped = false; // second pass, roles exchanged
let sound = null, playingEl = null;

/* -------------------------------------------------------------- the stage */

/* One fixed 1920×1080 stage, scaled to fit. Everything lays out once, at one
   size, so the television and the tablet show exactly the same thing. */
function fitStage() {
  const st = $('#stage');
  if (!st) return;
  const pad = 16;
  const s = Math.min((innerWidth - pad) / 1920, (innerHeight - pad) / 1080);
  st.style.transform = `scale(${s})`;
}
addEventListener('resize', fitStage);

/* --------------------------------------------------------------- audio */

function stopAudio() {
  if (sound) { sound.pause(); sound = null; }
  if (playingEl) { playingEl.classList.remove('playing'); playingEl = null; }
}

function say(key, el) {
  stopAudio();
  const src = AUDIO[key];
  if (!src) return;
  sound = new Audio(src);
  playingEl = el || null;
  if (playingEl) playingEl.classList.add('playing');
  sound.onended = () => { if (playingEl) playingEl.classList.remove('playing'); };
  sound.play().catch(() => {});
}

/* --------------------------------------------------------------- contents */

function renderIndex() {
  const places = PLACES.map(p => `
    <section class="place">
      <h2>${p.title}</h2>
      <div class="count">${p.scenes.length} scenes</div>
      <div class="cards">
        ${p.scenes.map(s => `
          <button class="card" data-id="${s.id}">
            ${s.icon ? `<svg class="cardic" viewBox="0 0 72 72"><use href="#i-${s.icon}"/></svg>` : ''}
            <div class="txt">
              <div class="n">${s.id.toUpperCase()}</div>
              <div class="t">${s.title}</div>
              <div class="new">${(s.new || []).join(' · ')}</div>
            </div>
          </button>`).join('')}
      </div>
    </section>`).join('');

  $('#index').innerHTML = `
    <div class="index">
      <h1>The English Play Deck</h1>
      <p class="lede">Pick a scene. You read the left part, she reads the right one —
         then it swaps and you play it again. Tap any line to hear it.</p>
      ${places}
      <p class="credit">Drawings from <a href="https://openmoji.org">OpenMoji</a>,
        by the design department of HfG Schwäbisch Gmünd — CC BY-SA 4.0.
        Voice by <a href="https://github.com/hexgrad/kokoro">Kokoro</a>.</p>
    </div>`;

  $('#index').querySelectorAll('.card').forEach(c => {
    c.onclick = () => open(SCENES.findIndex(s => s.id === c.dataset.id));
  });
}

/* ----------------------------------------------------------------- a scene */

const RULE = `<svg viewBox="0 0 60 890" width="60" height="890" fill="none">
  <line x1="30" y1="0" x2="30" y2="407" stroke="#eae2d8" stroke-width="2"/>
  <line x1="30" y1="483" x2="30" y2="890" stroke="#eae2d8" stroke-width="2"/>
  <rect x="19" y="434" width="22" height="22" transform="rotate(45 30 445)"
        fill="none" stroke="#d2624a" stroke-width="2.5"/>
  <circle cx="30" cy="445" r="4" fill="#1f6f7a"/>
  <circle cx="30" cy="387" r="3" fill="#eae2d8"/>
  <circle cx="30" cy="503" r="3" fill="#eae2d8"/>
</svg>`;

function bubbles(lines) {
  return lines.map(l => {
    // on the second pass the sides trade places, so the reader's eye follows
    // whichever part they are now playing
    const who = swapped ? (l.who === 'A' ? 'B' : 'A') : l.who;
    const art = l.i
      ? `<svg class="ic" viewBox="0 0 72 72"><use href="#i-${l.i}"/></svg>` : '';
    return `<div class="row ${who}">
        <button class="bub" data-k="${l.a}">${art}<span>${l.text}</span></button>
      </div>`;
  }).join('');
}

function renderScene() {
  const sc = SCENES[idx];
  const half = Math.ceil(sc.lines.length / 2);
  const left = sc.lines.slice(0, half), right = sc.lines.slice(half);

  $('#stage').innerHTML = `
    <div class="slide">
      <div class="head">
        <span class="scene">${sc.place} — ${sc.title}</span>
        <span class="meta">
          <b class="A">${swapped ? 'you' : 'Papa'}</b> ·
          <b class="B">${swapped ? 'Papa' : 'you'}</b>
          &nbsp;&nbsp;${idx + 1} / ${SCENES.length}
        </span>
      </div>
      <div class="two">
        <div class="col">${bubbles(left)}</div>
        <div class="gut">${RULE}</div>
        <div class="col">${bubbles(right)}</div>
      </div>
    </div>`;

  $('#stage').querySelectorAll('.bub').forEach(b => {
    b.onclick = () => say(b.dataset.k, b);
  });
  $('#where').textContent = `${sc.place} · ${sc.title}${swapped ? ' · swapped' : ''}`;
  $('#prev').disabled = idx === 0 && !swapped;
  fitStage();
}

function renderSwap() {
  $('#stage').innerHTML = `
    <div class="swap">
      <div>
        <h2>Now swap!</h2>
        <p>Play it again, the other way round.</p>
        <div class="pair">
          <div><span class="dot B"></span> Papa reads the right</div>
          <div><span class="dot A"></span> you read the left</div>
        </div>
      </div>
    </div>`;
  $('#where').textContent = 'swap over';
  fitStage();
}

/* ------------------------------------------------------------- navigation */

let showingSwap = false;

function open(i) {
  idx = i; swapped = false; showingSwap = false;
  stopAudio();
  $('#index').classList.remove('on');
  $('#deck').classList.add('on');
  renderScene();
}

function toIndex() {
  stopAudio();
  idx = -1;
  $('#deck').classList.remove('on');
  $('#index').classList.add('on');
}

/* The whole sequence is linear: scene → swap card → scene swapped → next scene. */
function next() {
  stopAudio();
  if (!swapped && !showingSwap) { showingSwap = true; renderSwap(); return; }
  if (showingSwap) { showingSwap = false; swapped = true; renderScene(); return; }
  if (idx < SCENES.length - 1) { idx++; swapped = false; renderScene(); }
}

function prev() {
  stopAudio();
  if (swapped) { swapped = false; showingSwap = true; renderSwap(); return; }
  if (showingSwap) { showingSwap = false; renderScene(); return; }
  if (idx > 0) { idx--; swapped = true; renderScene(); }
}

/* --------------------------------------------------------------- the bar */

let hideTimer = null;
function pokeBar() {
  const bar = $('#bar');
  bar.classList.remove('hidden');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (idx >= 0) bar.classList.add('hidden');
  }, 3000);
}

function init() {
  renderIndex();
  $('#next').onclick = next;
  $('#prev').onclick = prev;
  $('#home').onclick = toIndex;
  $('#full').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };

  addEventListener('keydown', e => {
    if (idx < 0) return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'Escape') toIndex();
    pokeBar();
  });
  addEventListener('mousemove', pokeBar);
  addEventListener('touchstart', pokeBar, { passive: true });

  fitStage();
  pokeBar();
}

document.addEventListener('DOMContentLoaded', init);
</script>
