 κες κε σε κε σε μπρουί", "gr": "Μα τι είναι αυτός ο θόρυβος;", "a": "1e142bac711e9428"}, {"fr": "Qu'est-ce que c'est que ce poum-poum-poum ?", "ph": "κες κε σε κε σε πουμ-πουμ-πουμ", "gr": "Τι είναι αυτό το πουμ-πουμ-πουμ;", "a": "fce3be223c05eacd"}, {"fr": "Un chat ?", "ph": "εν σα", "gr": "Καμιά γάτα;", "a": "59a93ff64dcda917"}, {"fr": "Une souris ?", "ph": "ουν σουρί", "gr": "Κανένα ποντικάκι;", "a": "9e322e2842723882"}, {"fr": "Un intrus dans la maison ?", "ph": "εν νεντρού νταν λα μεζόν", "gr": "Κάποιος ξένος μέσα στο σπίτι;", "a": "1916a4c161ff47e8"}]}, {"img": "poumpoums/02", "lines": [{"fr": "Non, c'est quelque chose de plus poilu qu'un chat, plus mignon qu'une souris, et beaucoup plus petit que vous et moi.", "ph": "νον, σε κελκ σοζ ντε πλου πουαλού κεν σα, πλου μινιόν κουν σουρί, ε μποκού πλου πετί κε βου ε μουά", "gr": "Όχι, είναι κάτι πιο μαλλιαρό από γάτα, πιο χαριτωμένο από ποντίκι, και πολύ πιο μικρό από εσένα κι από μένα.", "a": "d6738fc89d965790"}]}, {"img": "poumpoums/03", "lines": [{"fr": "Ce sont les trois poum-poums.", "ph": "σε σον λε τρουά πουμ-πουμ", "gr": "Είναι τα τρία πουμ-πουμ.", "a": "7d342d8e250d8474"}, {"fr": "Ces adorables créatures possèdent un pied unique avec lequel elles se déplacent en sautant.", "ph": "σε ζαντοράμπλ κρεατούρ ποσέντ εν πιε ουνίκ αβέκ λεκέλ ελ σε ντεπλάς αν σοτάν", "gr": "Αυτά τα αξιολάτρευτα πλασματάκια έχουν ένα μόνο ποδαράκι και προχωρούν πηδώντας.", "a": "46b014966db6a53c"}, {"fr": "Chaque saut produit un bruit sourd sur le sol.", "ph": "σακ σο προντουί εν μπρουί σουρ σουρ λε σολ", "gr": "Κάθε πήδημα κάνει έναν βαθύ χτύπο στο πάτωμα.", "a": "d1faa09995e9e3ad"}, {"fr": "Poum-poum.", "ph": "πουμ-πουμ", "gr": "Πουμ-πουμ.", "a": "5ba15c59a14811f8"}]}, {"img": "poumpoums/04", "lines": [{"fr": "AHHHH, HOUUU !", "ph": "ααααα, ουουου", "gr": "Ααααα, ουουου!", "a": "4b50506798d10038"}]}, {"img": "poumpoums/05", "lines": [{"fr": "Voici Solly Poum, le plus intelligent des trois.", "ph": "βουασί Σολί Πουμ, λε πλου ζεντελιζάν ντε τρουά", "gr": "Να ο Σολί Πουμ, ο πιο έξυπνος από τους τρεις.", "a": "01154fb4745e7835"}, {"fr": "Il réfléchit toujours longuement et à voix haute.", "ph": "ιλ ρεφλεσί τουζούρ λονγκμάν ε α βουά οτ", "gr": "Σκέφτεται πάντα πολλή ώρα, και σκέφτεται φωναχτά.", "a": "190072aa4ad743cb"}, {"fr": "Il fait des houuu, des ahhh et des poum-poums toute la nuit.", "ph": "ιλ φε ντε ουουου, ντε αααα ε ντε πουμ-πουμ τουτ λα νουί", "gr": "Κάνει ουουου, κάνει αααα και πουμ-πουμ όλη τη νύχτα.", "a": "d5aba002bb1af11b"}]}, {"img": "poumpoums/06", "lines": [{"fr": "Il lit des histoires aux deux autres poum-poums dans la journée,", "ph": "ιλ λι ντε ζιστουάρ ο ντε ζοτρ πουμ-πουμ νταν λα ζουρνέ", "gr": "Την ημέρα διαβάζει παραμύθια στα άλλα δύο πουμ-πουμ,", "a": "3df3bca753a89b7c"}, {"fr": "parce que, contrairement à vous et moi, c'est le moment où ils dorment.", "ph": "παρς κε, κοντρερμάν α βου ε μουά, σε λε μομάν ου ιλ ντορμ", "gr": "γιατί, σε αντίθεση με εμάς, τότε είναι που κοιμούνται.", "a": "59e7223a7989663c"}, {"fr": "Intello et crado, Solly Poum préfère toujours la lecture d'ouvrages au décrassage.", "ph": "εντελό ε κραντό, Σολί Πουμ πρεφέρ τουζούρ λα λεκτούρ ντουβράζ ο ντεκρασάζ", "gr": "Σοφός και βρωμούλης, ο Σολί Πουμ διαλέγει πάντα το βιβλίο αντί για το μπάνιο.", "a": "6cd12969f62aebf1"}]}, {"img": "poumpoums/07", "lines": [{"fr": "Voici Sally Poum, la plus petite et plus adorable des trois poum-poums.", "ph": "βουασί Σαλί Πουμ, λα πλου πετίτ ε πλου ζαντοράμπλ ντε τρουά πουμ-πουμ", "gr": "Να η Σαλί Πουμ, η πιο μικρή και η πιο γλυκιά από τα τρία πουμ-πουμ.", "a": "67d326541b70d3f6"}, {"fr": "Avec sa petite voix douce, elle entonne des chansons poum-poums poupou-pidou,", "ph": "αβέκ σα πετίτ βουά ντους, ελ αντόν ντε σανσόν πουμ-πουμ πουπού-πιντού", "gr": "Με τη γλυκιά μικρή φωνούλα της τραγουδάει πουμ-πουμ τραγουδάκια, πουπού-πιντού,", "a": "e13dd398998c9506"}, {"fr": "lorsque la nuit se déroule un peu trop tranquillement à son goût.", "ph": "λορσκ λα νουί σε ντερούλ εν πε τρο τρανκιλμάν α σον γκου", "gr": "όταν η νύχτα κυλάει λιγάκι πιο ήσυχα απ' ό,τι θα ήθελε.", "a": "cdb7c5c982f50ab7"}]}, {"img": "poumpoums/08", "lines": [{"fr": "Elle aime dénicher des objets brillants et faire des câlins.", "ph": "ελ εμ ντενισέ ντε ζομπζέ μπριγιάν ε φερ ντε καλέν", "gr": "Της αρέσει να βρίσκει γυαλιστερά πραγματάκια και να δίνει αγκαλιές.", "a": "b05eedbd46c6b39a"}, {"fr": "Câline et tendre, Sally Poum adore chanter.", "ph": "καλίν ε ταντρ, Σαλί Πουμ αντόρ σαντέ", "gr": "Τρυφερή και αγκαλίτσα, η Σαλί Πουμ λατρεύει το τραγούδι.", "a": "444bcb316290c5cb"}, {"fr": "Clic-clic !", "ph": "κλικ-κλικ", "gr": "Κλικ-κλικ!", "a": "eb6fdf512484aa19"}, {"fr": "Clic-clic !", "ph": "κλικ-κλικ", "gr": "Κλικ-κλικ!", "a": "eb6fdf512484aa19"}]}, {"img": "poumpoums/09", "lines": [{"fr": "N'oublions pas Zigoto Poum, le plus drôle des trois poum-poums de la maison.", "ph": "νουμπλιόν πα Ζιγκοτό Πουμ, λε πλου ντρολ ντε τρουά πουμ-πουμ ντε λα μεζόν", "gr": "Και μην ξεχνάμε τον Ζιγκοτό Πουμ, τον πιο αστείο από τα τρία πουμ-πουμ του σπιτιού.", "a": "a5095b933aff3efa"}, {"fr": "Il n'arrête pas de faire des blagues.", "ph": "ιλ ναρέτ πα ντε φερ ντε μπλαγκ", "gr": "Δεν σταματάει στιγμή να λέει αστεία.", "a": "923fdbb13f3d5218"}, {"fr": "Hahahahaha !", "ph": "ααααα", "gr": "Χαχαχαχαχα!", "a": "6e54a280f2035f8d"}]}, {"img": "poumpoums/10", "lines": [{"fr": "Zigoto Poum, qui glousse et se trémousse,", "ph": "Ζιγκοτό Πουμ, κι γκλους ε σε τρεμούς", "gr": "Ο Ζιγκοτό Πουμ, που κρυφογελάει και κουνιέται σαν ζελεδάκι,", "a": "7e0ade3ef3096e94"}, {"fr": "vous fera hurler de rire au point d'en avoir mal au ventre.", "ph": "βου φερά ουρλέ ντε ριρ ο πουέν νταν ναβουάρ μαλ ο βαντρ", "gr": "θα σε κάνει να γελάσεις τόσο δυνατά που θα σε πονέσει η κοιλιά σου.", "a": "e699da175b11fe17"}, {"fr": "C'est lui qui remonte le moral de ses amis quand ils en ont besoin.", "ph": "σε λουί κι ρεμόντ λε μοράλ ντε σε ζαμί καν τιλ αν νον μπεζουέν", "gr": "Αυτός είναι που φτιάχνει το κέφι στους φίλους του όταν το έχουν ανάγκη.", "a": "d579a17ee70c7945"}]}, {"img": "poumpoums/11", "lines": [{"fr": "Il adore danser sur son grand pied lourdaud lorsque Sally Poum chante.", "ph": "ιλ αντόρ ντανσέ σουρ σον γκραν πιε λουρντό λορσκ Σαλί Πουμ σαντ", "gr": "Λατρεύει να χορεύει πάνω στο μεγάλο αδέξιο ποδαράκι του όταν τραγουδάει η Σαλί Πουμ.", "a": "1d8338b8975bd563"}]}, {"img": "poumpoums/12", "lines": [{"fr": "Si au beau milieu de la nuit, tu entends soudain un poum-poum étrange,", "ph": "σι ο μπο μιλιέ ντε λα νουί, του αντάν σουντέν εν πουμ-πουμ ετράνζ", "gr": "Αν μέσα στη νύχτα ακούσεις ξαφνικά ένα παράξενο πουμ-πουμ,", "a": "2344aa0901b01353"}, {"fr": "souviens-toi qu'il s'agit simplement des trois poum-poums en train de lire,", "ph": "σουβιέν-τουά κιλ σαζί σεμπλεμάν ντε τρουά πουμ-πουμ αν τρεν ντε λιρ", "gr": "θυμήσου πως είναι απλώς τα τρία πουμ-πουμ που διαβάζουν,", "a": "aa94e6899d9fdf93"}, {"fr": "chanter et danser sur leur unique pied poum-poum.", "ph": "σαντέ ε ντανσέ σουρ λερ ουνίκ πιε πουμ-πουμ", "gr": "τραγουδούν και χορεύουν πάνω στο ένα τους ποδαράκι πουμ-πουμ.", "a": "7918df7fd3f6c9ce"}]}, {"img": "poumpoums/13", "lines": [{"fr": "Dors bien, petit bout.", "ph": "ντορ μπιέν, πετί μπου", "gr": "Κοιμήσου καλά, μικρούλα μου.", "a": "6af81d96434dc5fc"}, {"fr": "Fais de beaux rêves.", "ph": "φε ντε μπο ρεβ", "gr": "Όνειρα γλυκά.", "a": "f71b2ebe375966d3"}, {"fr": "Ou bien garde un œil ouvert...", "ph": "ου μπιέν γκαρντ εν νειγ ουβέρ", "gr": "Ή μήπως να κρατήσεις το ένα ματάκι ανοιχτό...", "a": "d13f7350c8e4cc81"}]}, {"img": "poumpoums/14", "lines": [{"fr": "Et tu apercevras peut-être trois adorables petites créatures sauter sur leur pied unique en faisant poum-poum-poum.", "ph": "ε του απερσεβρά πετ-έτρ τρουά ζαντοράμπλ πετίτ κρεατούρ σοτέ σουρ λερ πιε ουνίκ αν φεζάν πουμ-πουμ-πουμ", "gr": "Και ίσως δεις τρία αξιολάτρευτα πλασματάκια να πηδάνε στο ένα τους ποδαράκι κάνοντας πουμ-πουμ-πουμ.", "a": "6569b2d22cd7531c"}]}]}, {"id": "puchku", "title_fr": "Un livre pour Puchku", "title_gr": "Ένα βιβλίο για την Πούσκου", "level": 3, "summary_gr": "Η Πούσκου διαβάζει συνέχεια, μα σήμερα δεν της έχει μείνει ούτε ένα βιβλίο — και τα καινούρια είναι ψηλά ψηλά, εκεί που δεν φτάνει.", "source": {"publisher": "StoryWeaver Community / Pratham Books", "url": "https://storyweaver.org.in/en/stories/24810-a-book-for-puchku", "licence": "CC BY 4.0", "authors": ["Sak Untala"], "illustrators": ["Rajiv Eipe"]}, "cover": "puchku/cover", "pages": [{"img": "puchku/01", "lines": [{"fr": "— Puchku, va prendre ton bain!", "ph": "— Πουσκού, βα πραντρ τον μπεν!", "gr": "— Πούσκου, πήγαινε να κάνεις μπάνιο!", "a": "708df1b2c2d9efe6"}, {"fr": "— Puchku, mange ton repas!", "ph": "— Πουσκού, μανζ τον ρεπά!", "gr": "— Πούσκου, φάε το φαγητό σου!", "a": "312881d9961ec543"}]}, {"img": "puchku/02", "lines": [{"fr": "— Puchku, va à l'école!", "ph": "— Πουσκού, βα α λεκόλ!", "gr": "— Πούσκου, πήγαινε στο σχολείο!", "a": "7d43a992e2071c9c"}, {"fr": "— Puchku, monte dans le bus!", "ph": "— Πουσκού, μοντ νταν λε μπους!", "gr": "— Πούσκου, ανέβα στο λεωφορείο!", "a": "afad0fac8ad6a91d"}, {"fr": "— Puchku, fais tes devoirs!", "ph": "— Πουσκού, φε τε ντεβουάρ!", "gr": "— Πούσκου, κάνε τα μαθήματά σου!", "a": "5d9b8cd5d42e2399"}]}, {"img": "puchku/03", "lines": [{"fr": "— Où est Puchku?", "ph": "— ου ε Πουσκού?", "gr": "— Πού είναι η Πούσκου;", "a": "301ac74eecb3147a"}]}, {"img": "puchku/04", "lines": [{"fr": "Puchku est occupée.", "ph": "Πουσκού ε τοκουπέ.", "gr": "Η Πούσκου είναι απασχολημένη.", "a": "5c18bfa422285379"}, {"fr": "Elle a un livre à lire.", "ph": "ελ α εν λιβρ α λιρ.", "gr": "Έχει ένα βιβλίο να διαβάσει.", "a": "a7a13913e24b2876"}, {"fr": "Puchku passe tout son temps à lire.", "ph": "Πουσκού πας του σον ταν α λιρ.", "gr": "Η Πούσκου περνάει όλη της την ώρα διαβάζοντας.", "a": "13200b7ac939ce2b"}, {"fr": "Elle lit à la maison, à l'école, dans le parc, dans son lit.", "ph": "ελ λι α λα μεζόν, α λεκόλ, νταν λε παρκ, νταν σον λι.", "gr": "Διαβάζει στο σπίτι, στο σχολείο, στο πάρκο, στο κρεβάτι της.", "a": "2c3eea97a302bbef"}]}, {"img": "puchku/05", "lines": [{"fr": "— Pourquoi passes-tu ton temps à lire, Puchku? interroge Boltu.", "ph": "— πουρκουά πας του τον ταν α λιρ, Πουσκού? εντερόζ Μπολτού.", "gr": "— Γιατί περνάς όλη σου την ώρα διαβάζοντας, Πούσκου; ρωτάει ο Μπόλτου.", "a": "8bf368bc58c35eb7"}, {"fr": "— Viens plutôt regarder un dessin animé, propose Dodla.", "ph": "— βιεν πλουτό ρεγκαρντέ εν ντεσέν ανιμέ, προπόζ Ντοντλά.", "gr": "— Έλα καλύτερα να δούμε κινούμενα σχέδια, προτείνει ο Ντόντλα.", "a": "de9f0c05123648b4"}]}, {"img": "puchku/06", "lines": [{"fr": "— Les livres sont tellement plus drôles, répond Puchku.", "ph": "— λε λιβρ σον τελμάν πλου ντρολ, ρεπόν Πουσκού.", "gr": "— Τα βιβλία είναι πολύ πιο διασκεδαστικά, απαντάει η Πούσκου.", "a": "6fefae405b234171"}, {"fr": "Regardez, vous voyez ce cercle?", "ph": "ρεγκαρντέ, βου βουαγέ σε σερκλ?", "gr": "Κοιτάξτε, βλέπετε αυτόν τον κύκλο;", "a": "14b8729e30f3831f"}, {"fr": "Et cette ligne droite?", "ph": "ε σετ λινι ντρουάτ?", "gr": "Κι αυτή την ίσια γραμμή;", "a": "efb1acf5409ba217"}, {"fr": "Repoussez ça vers l'intérieur,", "ph": "ρεπουσέ σα βερ λεντεριέρ,", "gr": "Σπρώξτε αυτό προς τα μέσα,", "a": "be3cca8a4c1fc820"}, {"fr": "tirez ça par là,", "ph": "τιρέ σα παρ λα,", "gr": "τραβήξτε αυτό από εκεί,", "a": "af85bf5c5bf5b5a6"}, {"fr": "et ça devient une lettre.", "ph": "ε σα ντεβιέν ουν λετρ.", "gr": "και να που γίνεται ένα γράμμα.", "a": "add8fd9b43787aa5"}, {"fr": "Assemblez les lettres et vous obtenez un mot...", "ph": "ασανμπλέ λε λετρ ε βου ζομπτενέ εν μο...", "gr": "Βάλτε τα γράμματα μαζί και βγαίνει μια λέξη...", "a": "8203bc0b82170e19"}, {"fr": "Les mots peuvent être intelligents, drôles, tristes ou gais...", "ph": "λε μο πεβ ετρ εντελιζάν, ντρολ, τριστ ου γκε...", "gr": "Οι λέξεις μπορεί να είναι έξυπνες, αστείες, λυπημένες ή χαρούμενες...", "a": "15a01ed70b74f746"}, {"fr": "Lorsque vous les mettez les uns à côté des autres,", "ph": "λορσκ βου λε μετέ λε ζεν α κοτέ ντε ζοτρ,", "gr": "Κι όταν τις βάζετε τη μία δίπλα στην άλλη,", "a": "9762aa18e1735889"}, {"fr": "ils forment des phrases.", "ph": "ιλ φορμ ντε φραζ.", "gr": "φτιάχνουν προτάσεις.", "a": "1f71364e70221c30"}, {"fr": "Et les phrases à leur tour deviennent des histoires...", "ph": "ε λε φραζ α λερ τουρ ντεβιέν ντε ζιστουάρ...", "gr": "Κι οι προτάσεις με τη σειρά τους γίνονται ιστορίες...", "a": "26a718790fc6657e"}, {"fr": "Lisez les histoires et waouh,", "ph": "λιζέ λε ζιστουάρ ε ουάου,", "gr": "Διαβάστε τις ιστορίες και ουάου,", "a": "9fe9466a1dbeb8c7"}, {"fr": "vous voilà transportés dans un autre monde!", "ph": "βου βουαλά τρανσπορτέ νταν ενότρ μοντ!", "gr": "να που βρίσκεστε σε έναν άλλον κόσμο!", "a": "d4ad4b31839c23a1"}]}, {"img": "puchku/07", "lines": [{"fr": "Mais aujourd'hui, Puchku est bien embêtée.", "ph": "με οζουρντουί, Πουσκού ε μπιεν ανμπετέ.", "gr": "Μα σήμερα η Πούσκου είναι πολύ στενοχωρημένη.", "a": "5e4d5e452e134cef"}, {"fr": "Elle n'a plus aucun livre à lire!", "ph": "ελ να πλου ζοκέν λιβρ α λιρ!", "gr": "Δεν της έχει μείνει ούτε ένα βιβλίο να διαβάσει!", "a": "69494979718fe792"}, {"fr": "Elle a lu de la première à la dernière page", "ph": "ελ α λου ντε λα πρεμιέρ α λα ντερνιέρ παζ", "gr": "Έχει διαβάσει από την πρώτη ως την τελευταία σελίδα", "a": "3af165d77c177fb6"}, {"fr": "tous les livres qui se trouvaient dans sa bibliothèque.", "ph": "του λε λιβρ κι σε τρουβέ νταν σα μπιμπλιοτέκ.", "gr": "όλα τα βιβλία που υπήρχαν στη βιβλιοθήκη της.", "a": "bb5f40c9b5cffbf8"}]}, {"img": "puchku/08", "lines": [{"fr": "— Mais qu'est-ce que je vais bien pouvoir faire, se lamente Puchku.", "ph": "— με κες κε ζε βε μπιεν πουβουάρ φερ, σε λαμάντ Πουσκού.", "gr": "— Μα τι θα κάνω τώρα, παραπονιέται η Πούσκου.", "a": "3d62d97c24820778"}, {"fr": "Je n'ai plus de livres à lire!", "ph": "ζε νε πλου ντε λιβρ α λιρ!", "gr": "Δεν έχω άλλα βιβλία να διαβάσω!", "a": "08175581e7944887"}]}, {"img": "puchku/09", "lines": [{"fr": "Oh, mais qu'y a-t-il, là-haut?", "ph": "ο, με κι α τιλ, λα ο?", "gr": "Ω, μα τι είναι εκεί ψηλά;", "a": "eb9e01329c8e5092"}, {"fr": "Puchku lève les yeux et aperçoit non pas une, non pas deux,", "ph": "Πουσκού λεβ λε ζιε ε απερσουά νον πα ουν, νον πα ντε,", "gr": "Η Πούσκου σηκώνει τα μάτια της και βλέπει όχι μία, όχι δύο,", "a": "ab47d9488194f482"}, {"fr": "mais trois rangées PLEINES de livres.", "ph": "με τρουά ρανζέ πλεν ντε λιβρ.", "gr": "αλλά τρεις ολόκληρες σειρές ΓΕΜΑΤΕΣ βιβλία.", "a": "0faa9bf661cf1ead"}]}, {"img": "puchku/10", "lines": [{"fr": "Mais il y a un problème.", "ph": "με ιλ ι α εν προμπλέμ.", "gr": "Όμως υπάρχει ένα πρόβλημα.", "a": "f79c50194a85cea8"}, {"fr": "Puchku est trop petite.", "ph": "Πουσκού ε τρο πετίτ.", "gr": "Η Πούσκου είναι πολύ μικρή.", "a": "85a55406b0b1d326"}, {"fr": "Et la bibliothèque est trop grande.", "ph": "ε λα μπιμπλιοτέκ ε τρο γκραντ.", "gr": "Και η βιβλιοθήκη είναι πολύ μεγάλη.", "a": "d9fb8753d004dfa8"}, {"fr": "Comment Puchku va-t-elle pouvoir attraper les livres?", "ph": "κομάν Πουσκού βα τελ πουβουάρ ατραπέ λε λιβρ?", "gr": "Πώς θα καταφέρει η Πούσκου να φτάσει τα βιβλία;", "a": "eb3def18b5b52418"}]}, {"img": "puchku/11", "lines": [{"fr": "Pour escalader la bibliothèque,", "ph": "πουρ εσκαλαντέ λα μπιμπλιοτέκ,", "gr": "Για να σκαρφαλώσει στη βιβλιοθήκη,", "a": "098593989c6bde07"}, {"fr": "Puchku peut peut-être utiliser la corde à linge?", "ph": "Πουσκού πε πετέτρ ουτιλιζέ λα κορντ α λενζ?", "gr": "μπορεί η Πούσκου να χρησιμοποιήσει το σκοινί της μπουγάδας;", "a": "a6c5fce0c3f20caa"}, {"fr": "ou le sari de sa maman?", "ph": "ου λε σαρί ντε σα μαμάν?", "gr": "ή το σάρι της μαμάς της;", "a": "01a6dcdc11c7b801"}, {"fr": "ou bien encore empiler des tables et des chaises?", "ph": "ου μπιεν ανκόρ ανπιλέ ντε ταμπλ ε ντε σεζ?", "gr": "ή μήπως να στοιβάξει τραπέζια και καρέκλες;", "a": "bd12d51cbc3c4cde"}]}, {"img": "puchku/12", "lines": [{"fr": "Ce serait très utile d'avoir une girafe à portée de main,", "ph": "σε σερέ τρε ζουτίλ νταβουάρ ουν ζιράφ α πορτέ ντε μεν,", "gr": "Θα ήταν πολύ βολικό να είχα μια καμηλοπάρδαλη δίπλα μου,", "a": "84e5e9f7ee4d642d"}, {"fr": "ou un singe, ou les deux ! se dit Puchku.", "ph": "ου εν σενζ, ου λε ντε ! σε ντι Πουσκού.", "gr": "ή μια μαϊμού, ή και τα δύο! σκέφτεται η Πούσκου.", "a": "6035ab5fb9fd3d17"}]}, {"img": "puchku/13", "lines": [{"fr": "Puchku a un plan.", "ph": "Πουσκού α εν πλαν.", "gr": "Η Πούσκου έχει ένα σχέδιο.", "a": "435910a3c8ed79b2"}, {"fr": "Elle appelle Boltu et Dodla à la rescousse.", "ph": "ελ απέλ Μπολτού ε Ντοντλά α λα ρεσκούς.", "gr": "Φωνάζει τον Μπόλτου και τον Ντόντλα να τη βοηθήσουν.", "a": "1cccde11b1ba4421"}, {"fr": "Aussi calmement que possible,", "ph": "οσί καλμεμάν κε ποσίμπλ,", "gr": "Όσο πιο ήσυχα μπορούν,", "a": "9ebea27e78b8b3fa"}, {"fr": "ils grimpent les uns sur les autres.", "ph": "ιλ γκρενπ λε ζεν σουρ λε ζοτρ.", "gr": "σκαρφαλώνουν ο ένας πάνω στον άλλον.", "a": "5e9ba19f50ecae14"}, {"fr": "— Qu'est-ce que tu es lourd, Boltu, s'exclame Dodla.", "ph": "— κες κε του ε λουρ, Μπολτού, σεκσκλάμ Ντοντλά.", "gr": "— Πόσο βαρύς είσαι, Μπόλτου, φωνάζει ο Ντόντλα.", "a": "39bceae774b4e2be"}, {"fr": "Je t'avais bien dit de ne pas manger le dernier rasgulla!", "ph": "ζε ταβέ μπιεν ντι ντε νε πα μανζέ λε ντερνιέ ρασγκουλά!", "gr": "Σου το είχα πει, να μη φας το τελευταίο γλυκό, το ρασγκούλα!", "a": "8dfa3e462da557ed"}, {"fr": "— C'est pas moi, c'est Puchku, répond Boltu.", "ph": "— σε πα μουά, σε Πουσκού, ρεπόν Μπολτού.", "gr": "— Δεν ήμουν εγώ, η Πούσκου ήταν, απαντάει ο Μπόλτου.", "a": "2074053f98c2d4fb"}, {"fr": "— Chut!", "ph": "— σουτ!", "gr": "— Σςς!", "a": "c85820146baa10e8"}, {"fr": "J'y suis presque, dit Puchku.", "ph": "ζι σουί πρεσκ, ντι Πουσκού.", "gr": "Κοντεύω να το φτάσω, λέει η Πούσκου.", "a": "989463b69609307d"}, {"fr": "Tout à coup ...", "ph": "του τα κου ...", "gr": "Και ξαφνικά...", "a": "fb5596022eb0e398"}, {"fr": "Patatras!", "ph": "πατατρά!", "gr": "Μπαμ!", "a": "974962bf42f3df66"}]}, {"img": "puchku/14", "lines": [{"fr": "— AHHHHHHHHHH!", "ph": "— αααααααααα!", "gr": "— ΑΑΑΑΑΑΑΑΑΑ!", "a": "d7814b5e10d07cae"}]}, {"img": "puchku/15", "lines": [{"fr": "— Que se passe-t-il donc ici? interroge la très grande bibliothécaire.", "ph": "— κε σε πας τιλ ντονκ ισί? εντερόζ λα τρε γκραντ μπιμπλιοτεκέρ.", "gr": "— Μα τι γίνεται εδώ; ρωτάει η πολύ ψηλή βιβλιοθηκάριος.", "a": "e0b9e416ee5cd2b4"}, {"fr": "Elle pose Puchku par terre,", "ph": "ελ ποζ Πουσκού παρ τερ,", "gr": "Κατεβάζει την Πούσκου στο πάτωμα,", "a": "fa76cdda345882db"}, {"fr": "tandis que Boltu et Dodla se sauvent en courant.", "ph": "τανντί κε Μπολτού ε Ντοντλά σε σοβ αν κουράν.", "gr": "ενώ ο Μπόλτου και ο Ντόντλα το βάζουν στα πόδια.", "a": "eed5269997be9961"}, {"fr": "Puchku regarde d'un air triste le livre qu'elle n'a pas réussi à attraper.", "ph": "Πουσκού ρεγκάρντ ντεν νερ τριστ λε λιβρ κελ να πα ρεουσί α ατραπέ.", "gr": "Η Πούσκου κοιτάζει λυπημένη το βιβλίο που δεν κατάφερε να πιάσει.", "a": "cc0229cd522afe75"}, {"fr": "— Que puis-je faire pour toi? lui demande la très grande bibliothécaire.", "ph": "— κε πουί ζε φερ πουρ τουά? λουί ντεμάντ λα τρε γκραντ μπιμπλιοτεκέρ.", "gr": "— Τι μπορώ να κάνω για σένα; τη ρωτάει η πολύ ψηλή βιβλιοθηκάριος.", "a": "ad163a2e99fff7d6"}]}, {"img": "puchku/16", "lines": [{"fr": "— J'essayais d'escalader la bibliothèque", "ph": "— ζεσεγέ ντεσκαλαντέ λα μπιμπλιοτέκ", "gr": "— Προσπαθούσα να σκαρφαλώσω στη βιβλιοθήκη", "a": "c95f102926aff162"}, {"fr": "parce que je n'ai plus aucun livre à lire, se lamente Puchku.", "ph": "παρς κε ζε νε πλου ζοκέν λιβρ α λιρ, σε λαμάντ Πουσκού.", "gr": "γιατί δεν μου έχει μείνει ούτε ένα βιβλίο να διαβάσω, παραπονιέται η Πούσκου.", "a": "5a9f3bee957225de"}, {"fr": "— Pourquoi ne pas l'avoir dit plus tôt?", "ph": "— πουρκουά νε πα λαβουάρ ντι πλου το?", "gr": "— Γιατί δεν το είπες νωρίτερα;", "a": "11473ccb34bcbd12"}, {"fr": "Quand je suis là, inutile d'escalader la bibliothèque.", "ph": "καν ζε σουί λα, ινουτίλ ντεσκαλαντέ λα μπιμπλιοτέκ.", "gr": "Όταν είμαι εδώ, δεν χρειάζεται να σκαρφαλώνεις στη βιβλιοθήκη.", "a": "5636d360ec4d3943"}, {"fr": "Puis-je te prendre dans mes bras?", "ph": "πουί ζε τε πραντρ νταν με μπρα?", "gr": "Μπορώ να σε πάρω αγκαλιά;", "a": "17664254c801b6e2"}, {"fr": "Puchku fait signe que oui.", "ph": "Πουσκού φε σινι κε ουί.", "gr": "Η Πούσκου κάνει νόημα πως ναι.", "a": "18dab91b09e7006b"}]}, {"img": "puchku/17", "lines": [{"fr": "— Je vais prendre celui-ci, celui-ci et celui-ci aussi, dit Puchku, ravie.", "ph": "— ζε βε πραντρ σελουί σι, σελουί σι ε σελουί σι οσί, ντι Πουσκού, ραβί.", "gr": "— Θα πάρω αυτό, κι αυτό, κι αυτό ακόμα, λέει η Πούσκου καταχαρούμενη.", "a": "90a5b48721293e2d"}, {"fr": "— Prends celui-ci aussi, propose la très grande bibliothécaire.", "ph": "— πραν σελουί σι οσί, προπόζ λα τρε γκραντ μπιμπλιοτεκέρ.", "gr": "— Πάρε κι αυτό, της προτείνει η πολύ ψηλή βιβλιοθηκάριος.", "a": "6c3e8857afa312ec"}, {"fr": "Quand j'étais petite, j'adorais ce livre!", "ph": "καν ζετέ πετίτ, ζαντορέ σε λιβρ!", "gr": "Όταν ήμουν μικρή, το λάτρευα αυτό το βιβλίο!", "a": "9f69b42a29cc728d"}]}, {"img": "puchku/18", "lines": [{"fr": "— Vous avez déjà été petite? demande Puchku.", "ph": "— βου ζαβέ ντεζά ετέ πετίτ? ντεμάντ Πουσκού.", "gr": "— Ήσασταν κι εσείς κάποτε μικρή; ρωτάει η Πούσκου.", "a": "9cc445a26fdff39c"}, {"fr": "— Oh, oui.", "ph": "— ο, ουί.", "gr": "— Ω, ναι.", "a": "3c636488e432293f"}, {"fr": "Même plus petite que toi, répond la très grande bibliothécaire.", "ph": "μεμ πλου πετίτ κε τουά, ρεπόν λα τρε γκραντ μπιμπλιοτεκέρ.", "gr": "Ακόμα πιο μικρή από σένα, απαντάει η πολύ ψηλή βιβλιοθηκάριος.", "a": "6485fd98a603cd9e"}, {"fr": "Et puis, j'ai grandi, et tu vas grandir aussi.", "ph": "ε πουί, ζε γκρανντί, ε του βα γκρανντίρ οσί.", "gr": "Κι ύστερα μεγάλωσα, και θα μεγαλώσεις κι εσύ.", "a": "f226749990465df0"}, {"fr": "En attendant, appelle-moi lorsque tu voudras un livre", "ph": "αν νατανντάν, απέλ μουά λορσκ του βουντρά εν λιβρ", "gr": "Ως τότε, φώναξέ με όποτε θέλεις ένα βιβλίο", "a": "b462d96eaf20a591"}, {"fr": "et je te le donnerai.", "ph": "ε ζε τε λε ντονερέ.", "gr": "και θα σου το δίνω.", "a": "de91024d95dba116"}]}, {"img": null, "lines": [{"fr": "Mais est-ce que Puchku écoute ce que lui dit la très grande bibliothécaire?", "ph": "με ες κε Πουσκού εκούτ σε κε λουί ντι λα τρε γκραντ μπιμπλιοτεκέρ?", "gr": "Ακούει όμως η Πούσκου τι της λέει η πολύ ψηλή βιβλιοθηκάριος;", "a": "ae9875821cd62287"}, {"fr": "Non!", "ph": "νον!", "gr": "Όχι!", "a": "75281ebe5bbfd1d5"}, {"fr": "Elle est plongée dans son livre,", "ph": "ελ ε πλονζέ νταν σον λιβρ,", "gr": "Είναι βυθισμένη στο βιβλίο της,", "a": "fe87d1aebd20b6db"}, {"fr": "au beau milieu d'un cercle et d'une ligne,", "ph": "ο μπο μιλιέ ντεν σερκλ ε ντουν λινι,", "gr": "μέσα σε έναν κύκλο και σε μια γραμμή,", "a": "fa382afc8bfb0301"}, {"fr": "d'une lettre puis d'une autre,", "ph": "ντουν λετρ πουί ντουν οτρ,", "gr": "σε ένα γράμμα κι ύστερα σε άλλο,", "a": "7536a54b4ad1b8cb"}, {"fr": "d'un mot puis d'un autre,", "ph": "ντεν μο πουί ντεν νοτρ,", "gr": "σε μια λέξη κι ύστερα σε άλλη,", "a": "71f91d285fb695cc"}, {"fr": "d'une phrase puis d'une autre,", "ph": "ντουν φραζ πουί ντουν οτρ,", "gr": "σε μια πρόταση κι ύστερα σε άλλη,", "a": "4c5fa77f0a13f697"}, {"fr": "et enfin, d'une histoire.", "ph": "ε ανφέν, ντουν ιστουάρ.", "gr": "και στο τέλος, σε μια ολόκληρη ιστορία.", "a": "bc9e5660cb31b14e"}]}, {"img": "puchku/20", "lines": [{"fr": "Parce que Puchku a un nouveau livre.", "ph": "παρς κε Πουσκού α εν νουβό λιβρ.", "gr": "Γιατί η Πούσκου έχει ένα καινούριο βιβλίο.", "a": "5bcd8866d933725a"}]}]}, {"id": "tinku", "title_fr": "Bonne nuit, Tinku !", "title_gr": "Καληνύχτα, Τίνκου!", "level": 2, "summary_gr": "Ο Τίνκου, το σκυλάκι της φάρμας, δεν νυστάζει και βγαίνει μόνος του στη νύχτα, όπου γνωρίζει τα ζώα που ξυπνούν όταν όλοι οι άλλοι κοιμούνται.", "source": {"publisher": "StoryWeaver Community / Pratham Books", "url": "https://storyweaver.org.in/en/stories/4200-goodnight-tinku", "licence": "CC BY 4.0", "authors": ["Sak Untala"], "illustrators": ["Sonal Goyal", "Sumit Sakhuja"]}, "cover": "tinku/cover", "pages": [{"img": "tinku/01", "lines": [{"fr": "Par une belle nuit de pleine lune, tous les animaux de la ferme de Mangu dormaient.", "ph": "παρ ουν μπελ νουί ντε πλεν λουν, του λεζανιμό ντε λα φερμ ντε Μανγκού ντορμέ", "gr": "Μια όμορφη νύχτα με πανσέληνο, όλα τα ζώα της φάρμας του Μανγκού κοιμόντουσαν.", "a": "60f1edfca5b8de3e"}]}, {"img": "tinku/02", "lines": [{"fr": "« Je n'ai pas sommeil, Maman », murmura Tinku.", "ph": "ζε νε πα σομέιγ, μαμάν, μουρμουρά Τινκού", "gr": "«Δεν νυστάζω, μαμά», ψιθύρισε ο Τίνκου.", "a": "827f02a30b6713c9"}, {"fr": "Mais la maman de Tinku ne l'entendit pas, elle dormait profondément.", "ph": "με λα μαμάν ντε Τινκού νε λανταντί πα, ελ ντορμέ προφονντεμάν", "gr": "Όμως η μαμά του Τίνκου δεν τον άκουσε, κοιμόταν βαθιά.", "a": "842f95390e2d9f09"}]}, {"img": "tinku/03", "lines": [{"fr": "Alors, Tinku s'élança dans la nuit, bien décidé à faire plein de découvertes.", "ph": "αλόρ, Τινκού σελανσά νταν λα νουί, μπιεν ντεσιντέ α φερ πλεν ντε ντεκουβέρτ", "gr": "Έτσι ο Τίνκου όρμησε μέσα στη νύχτα, αποφασισμένος να ανακαλύψει πολλά.", "a": "63923e8357f02671"}, {"fr": "Il vit la lune dans le ciel, ronde et blanche, qui le regardait en souriant.", "ph": "ιλ βι λα λουν νταν λε σιέλ, ροντ ε μπλανς, κι λε ρεγκαρντέ αν σουριάν", "gr": "Είδε το φεγγάρι στον ουρανό, στρογγυλό και άσπρο, που τον κοίταζε χαμογελώντας.", "a": "32c07983c69de893"}, {"fr": "Il était très heureux.", "ph": "ιλ ετέ τρε ερέ", "gr": "Ήταν πολύ χαρούμενος.", "a": "0fef3cc0b4a4ef05"}, {"fr": "« La nuit est magnifique », pensa-t-il.", "ph": "λα νουί ε μανιφίκ, πανσά τιλ", "gr": "«Η νύχτα είναι υπέροχη», σκέφτηκε.", "a": "2520934a874c8cd4"}]}, {"img": "tinku/04", "lines": [{"fr": "Au-dessus de la cime d'un arbre, des petites lumières scintillaient.", "ph": "ο ντεσού ντε λα σιμ ντεναρμπρ, ντε πετίτ λουμιέρ σεντιγέ", "gr": "Πάνω από την κορυφή ενός δέντρου, μικρά φωτάκια τρεμόπαιζαν.", "a": "63373d63eeed3edc"}, {"fr": "— Je suis une luciole, dit l'une d'elles, je brille dans l'obscurité.", "ph": "— ζε σουί ουν λουσιόλ, ντι λουν ντελ, ζε μπριγ νταν λομπσκουριτέ", "gr": "— Είμαι μια πυγολαμπίδα, είπε ένα από αυτά, λάμπω μέσα στο σκοτάδι.", "a": "8af650acc692667f"}, {"fr": "— Voudrais-tu être mon amie ? interrogea Tinku.", "ph": "— βουντρέ του ετρ μοναμί ? εντεροζά Τινκού", "gr": "— Θα ήθελες να γίνεις φίλη μου; ρώτησε ο Τίνκου.", "a": "1bdeb3e05fe5d1cf"}, {"fr": "— Oh, oui ! répondit la luciole.", "ph": "— ο, ουί ! ρεπονντί λα λουσιόλ", "gr": "— Ω, ναι! απάντησε η πυγολαμπίδα.", "a": "18fa483878f2f378"}]}, {"img": "tinku/05", "lines": [{"fr": "Quelque chose voleta non loin de Tinku et s'accrocha tête en bas à un arbre.", "ph": "κελκ σοζ βολτά νον λουέν ντε Τινκού ε σακροσά τετ αν μπα α εναρμπρ", "gr": "Κάτι πέταξε κοντά στον Τίνκου και κρεμάστηκε ανάποδα σε ένα δέντρο.", "a": "7aeca6d0b949b85d"}, {"fr": "— Quel est ton nom, l'oiseau ? interrogea Tinku.", "ph": "— κελ ε τον νον, λουαζό ? εντεροζά Τινκού", "gr": "— Πώς σε λένε, πουλάκι; ρώτησε ο Τίνκου.", "a": "7da85d9236f60e72"}, {"fr": "— Je ne suis pas un oiseau, je suis une chauve-souris.", "ph": "— ζε νε σουί πα ενουαζό, ζε σουί ουν σοβ σουρί", "gr": "— Δεν είμαι πουλί, είμαι μια νυχτερίδα.", "a": "574c7e575b5ceb3b"}, {"fr": "Je vois dans l'obscurité.", "ph": "ζε βουά νταν λομπσκουριτέ", "gr": "Βλέπω μέσα στο σκοτάδι.", "a": "6ee85001d9520f7c"}, {"fr": "— Voudrais-tu être mon amie ? demanda Tinku.", "ph": "— βουντρέ του ετρ μοναμί ? ντεμανντά Τινκού", "gr": "— Θα ήθελες να γίνεις φίλη μου; ρώτησε ο Τίνκου.", "a": "d2023114c546c3ba"}, {"fr": "— Oh, oui ! répondit la chauve-souris.", "ph": "— ο, ουί ! ρεπονντί λα σοβ σουρί", "gr": "— Ω, ναι! απάντησε η νυχτερίδα.", "a": "2a8e1376c19efa72"}]}, {"img": "tinku/06", "lines": [{"fr": "Des feuilles remuèrent.", "ph": "ντε φέιγ ρεμουέρ", "gr": "Κάτι φύλλα σάλεψαν.", "a": "3b75a2123eb5539b"}, {"fr": "Quelqu'un se cachait dans les buissons !", "ph": "κελκέν σε κασέ νταν λε μπουισόν !", "gr": "Κάποιος κρυβόταν μέσα στους θάμνους!", "a": "255c000c84045d5e"}, {"fr": "— Qui es-tu ? interrogea Tinku.", "ph": "— κι ε του ? εντεροζά Τινκού", "gr": "— Ποιος είσαι; ρώτησε ο Τίνκου.", "a": "e9280d034a0abf46"}, {"fr": "— Je suis un renard.", "ph": "— ζε σουί εν ρενάρ", "gr": "— Είμαι μια αλεπού.", "a": "c8e87bebab62593b"}, {"fr": "Je me promène la nuit.", "ph": "ζε με προμέν λα νουί", "gr": "Κάνω βόλτα τη νύχτα.", "a": "ed86935b00499f47"}, {"fr": "— Voudrais-tu être mon ami ? demanda Tinku.", "ph": "— βουντρέ του ετρ μοναμί ? ντεμανντά Τινκού", "gr": "— Θα ήθελες να γίνεις φίλος μου; ρώτησε ο Τίνκου.", "a": "326fa7d45c036865"}, {"fr": "— Oh, oui ! répondit le renard.", "ph": "— ο, ουί ! ρεπονντί λε ρενάρ", "gr": "— Ω, ναι! απάντησε η αλεπού.", "a": "3f964af9551dea0f"}]}, {"img": "tinku/07", "lines": [{"fr": "Une paire d'yeux brillants observaient Tinku depuis un arbre.", "ph": "ουν περ ντιε μπριγιάν ομπσερβέ Τινκού ντεπουί εναρμπρ", "gr": "Δυο λαμπερά μάτια παρατηρούσαν τον Τίνκου από ένα δέντρο.", "a": "61f5b8927893ab12"}, {"fr": "— Qui es-tu ? interrogea Tinku.", "ph": "— κι ε του ? εντεροζά Τινκού", "gr": "— Ποιος είσαι; ρώτησε ο Τίνκου.", "a": "e9280d034a0abf46"}, {"fr": "— Je suis un hibou.", "ph": "— ζε σουί εν ιμπού", "gr": "— Είμαι μια κουκουβάγια.", "a": "ddf0cc579a83a9fe"}, {"fr": "Je chasse la nuit.", "ph": "ζε σας λα νουί", "gr": "Κυνηγάω τη νύχτα.", "a": "693ef264e0769732"}, {"fr": "— Voudrais-tu être mon ami ? demanda Tinku.", "ph": "— βουντρέ του ετρ μοναμί ? ντεμανντά Τινκού", "gr": "— Θα ήθελες να γίνεις φίλος μου; ρώτησε ο Τίνκου.", "a": "326fa7d45c036865"}, {"fr": "— Oh, oui ! répondit le hibou.", "ph": "— ο, ουί ! ρεπονντί λε ιμπού", "gr": "— Ω, ναι! απάντησε η κουκουβάγια.", "a": "de2e6838304e2ecf"}]}, {"img": "tinku/08", "lines": [{"fr": "Cri-cri ! Cri-cri ! Cri-cri !", "ph": "κρι-κρι ! κρι-κρι ! κρι-κρι !", "gr": "Κρι-κρι! Κρι-κρι! Κρι-κρι!", "a": "faeeeec80bcdaa4d"}, {"fr": "— Qui es-tu ? interrogea Tinku.", "ph": "— κι ε του ? εντεροζά Τινκού", "gr": "— Ποιος είσαι; ρώτησε ο Τίνκου.", "a": "e9280d034a0abf46"}, {"fr": "— Je suis un criquet.", "ph": "— ζε σουί εν κρικέ", "gr": "— Είμαι ένας γρύλος.", "a": "63eb596c15716183"}, {"fr": "Je chante la nuit.", "ph": "ζε σαντ λα νουί", "gr": "Τραγουδάω τη νύχτα.", "a": "46e09d13320f53ef"}, {"fr": "— Voudrais-tu être mon ami ? demanda Tinku.", "ph": "— βουντρέ του ετρ μοναμί ? ντεμανντά Τινκού", "gr": "— Θα ήθελες να γίνεις φίλος μου; ρώτησε ο Τίνκου.", "a": "326fa7d45c036865"}, {"fr": "— Oh, oui ! répondit le criquet.", "ph": "— ο, ουί ! ρεπονντί λε κρικέ", "gr": "— Ω, ναι! απάντησε ο γρύλος.", "a": "0bdb09c258dc34a3"}]}, {"img": "tinku/09", "lines": [{"fr": "Tinku et ses amis bondirent, gesticulèrent et roulèrent dans tous les sens jusqu'à ce que Tinku se mette à bâiller.", "ph": "Τινκού ε σεζαμί μπονντίρ, ζεστικουλέρ ε ρουλέρ νταν του λε σανς ζουσκά σε κε Τινκού σε μετ α μπαγιέ", "gr": "Ο Τίνκου και οι φίλοι του πηδούσαν, χοροπηδούσαν και κυλιόντουσαν παντού, ώσπου ο Τίνκου άρχισε να χασμουριέται.", "a": "519b7b94a07aa14a"}, {"fr": "— J'ai sommeil, je dois rentrer maintenant, dit-il, ravi de s'être fait plein de nouveaux amis.", "ph": "— ζε σομέιγ, ζε ντουά ραντρέ μεντενάν, ντιτίλ, ραβί ντε σετρ φε πλεν ντε νουβοζαμί", "gr": "— Νυστάζω, πρέπει να γυρίσω σπίτι τώρα, είπε, χαρούμενος που έκανε τόσους καινούριους φίλους.", "a": "ae34b933e40dcf97"}, {"fr": "Plus tard, blotti contre sa maman, il lui dit :", "ph": "πλου ταρ, μπλοτί κοντρ σα μαμάν, ιλ λουί ντι :", "gr": "Αργότερα, κουλουριασμένος δίπλα στη μαμά του, της είπε:", "a": "e877916c2cfd3642"}, {"fr": "— La nuit, on n'est pas seul, Maman.", "ph": "— λα νουί, ον νε πα σελ, μαμάν", "gr": "— Τη νύχτα δεν είμαστε μόνοι, μαμά.", "a": "376ebd4ed32094ff"}, {"fr": "La nuit est peuplée d'êtres merveilleux.", "ph": "λα νουί ε πεπλέ ντετρ μερβεγέ", "gr": "Η νύχτα είναι γεμάτη υπέροχα πλάσματα.", "a": "a420824bfa7fa163"}, {"fr": "— Oui.", "ph": "— ουί", "gr": "— Ναι.", "a": "5130a179608c2490"}, {"fr": "Tes nouveaux amis sont nocturnes, comme les chiens sauvages.", "ph": "τε νουβοζαμί σον νοκτούρν, κομ λε σιέν σοβάζ", "gr": "Οι καινούριοι σου φίλοι είναι νυχτόβιοι, όπως τα άγρια σκυλιά.", "a": "558406a99319f73e"}]}, {"img": "tinku/10", "lines": [{"fr": "Les animaux nocturnes mangent, jouent et travaillent la nuit.", "ph": "λεζανιμό νοκτούρν μανζ, ζου ε τραβάιγ λα νουί", "gr": "Τα νυχτόβια ζώα τρώνε, παίζουν και δουλεύουν τη νύχτα.", "a": "265e858476ba28ae"}, {"fr": "Ils se reposent pendant la journée.", "ph": "ιλ σε ρεπόζ πανντάν λα ζουρνέ", "gr": "Ξεκουράζονται μέσα στη μέρα.", "a": "59a4128793091738"}, {"fr": "Dors, maintenant.", "ph": "ντορ, μεντενάν", "gr": "Κοιμήσου τώρα.", "a": "ba1258da756e9d12"}, {"fr": "Comme ça, tu auras assez d'énergie demain pour jouer avec tes amis diurnes.", "ph": "κομ σα, του ορά ασέ ντενερζί ντεμέν πουρ ζουέ αβέκ τεζαμί ντιούρν", "gr": "Έτσι θα έχεις αρκετή ενέργεια αύριο για να παίξεις με τους φίλους σου της ημέρας.", "a": "a3c088f33fb11f64"}, {"fr": "Bonne nuit, mon petit, dit la maman de Tinku en le serrant très fort dans ses bras.", "ph": "μπον νουί, μον πετί, ντι λα μαμάν ντε Τινκού αν λε σεράν τρε φορ νταν σε μπρα", "gr": "Καληνύχτα, μικρέ μου, είπε η μαμά του Τίνκου σφίγγοντάς τον δυνατά στην αγκαλιά της.", "a": "d935f5aba9b7a427"}]}, {"img": "tinku/11", "lines": [{"fr": "La lune, ronde et blanche, brilla toute la nuit, diffusant ainsi sa lumière douce partout.", "ph": "λα λουν, ροντ ε μπλανς, μπριγιά τουτ λα νουί, ντιφουζάν ενσί σα λουμιέρ ντους παρτού", "gr": "Το φεγγάρι, στρογγυλό και άσπρο, έλαμψε όλη τη νύχτα, σκορπίζοντας παντού το γλυκό του φως.", "a": "86c139ab1ee0e5ee"}, {"fr": "Et Tinku dormit toute la nuit sans se réveiller !", "ph": "ε Τινκού ντορμί τουτ λα νουί σαν σε ρεβεγέ !", "gr": "Και ο Τίνκου κοιμήθηκε όλη τη νύχτα χωρίς να ξυπνήσει!", "a": "54521218eb09e48e"}]}]}, {"id": "tortue", "title_fr": "Tortue trouve sa maison", "title_gr": "Η Χελώνα βρίσκει το σπίτι της", "level": 3, "summary_gr": "Η Χελώνα ψάχνει το σπίτι της μέσα στον κάμπο, και ένα ένα τα ζώα ανεβαίνουν στην πλάτη της για να τη βοηθήσουν.", "source": {"publisher": "Book Dash / African Storybook", "url": "https://storyweaver.org.in/en/stories/135603-tortue-trouve-sa-maison", "licence": "CC BY 4.0", "authors": ["Maya Fowler"], "illustrators": ["Katrin Coetzer"], "translators": ["African Storybook Project Team"]}, "cover": "tortue/cover", "pages": [{"img": "tortue/01", "lines": [{"fr": "Un jour, Tortue marchait dans le veld.", "ph": "εν ζουρ, Τορτού μαρσέ νταν λε βελντ", "gr": "Μια μέρα, η Χελώνα περπατούσε στον κάμπο.", "a": "8d9cc2f08ec60207"}, {"fr": "Elle regardait partout.", "ph": "ελ ρεγκαρντέ παρτού", "gr": "Κοίταζε παντού.", "a": "086019e2136f1c40"}, {"fr": "Elle regardait au loin et dans l’herbe.", "ph": "ελ ρεγκαρντέ ο λουέν ε νταν λερμπ", "gr": "Κοίταζε μακριά και μέσα στα χόρτα.", "a": "6759ca8191656a1f"}, {"fr": "Et puis, elle croisa Escargot.", "ph": "ε πουί, ελ κρουαζά Εσκαργκό", "gr": "Και τότε συνάντησε τον Σαλίγκαρο.", "a": "2de08ec46c1f697d"}, {"fr": "« Oui, Escargot, je cherche ma maison. Est-ce que tu l’aurais vue, par hasard ? »", "ph": "ουί, Εσκαργκό, ζε σερς μα μεζόν. ες κε του λορέ βου, παρ αζάρ ?", "gr": "«Ναι, Σαλίγκαρε, ψάχνω το σπίτι μου. Μήπως το είδες πουθενά;»", "a": "0c0840e9ed28f2aa"}, {"fr": "« Tu cherches quelque chose ? », demanda Escargot.", "ph": "του σερς κελκ σοζ ? ντεμανντά Εσκαργκό", "gr": "«Ψάχνεις κάτι;» ρώτησε ο Σαλίγκαρος.", "a": "90f31efae9bd17c1"}]}, {"img": "tortue/02", "lines": [{"fr": "Escargot dit : « Non, je ne l’ai pas vue, mais je vais t’aider à chercher. »", "ph": "Εσκαργκό ντι : νον, ζε νε λε πα βου, με ζε βε τεντέ α σερσέ", "gr": "Ο Σαλίγκαρος είπε: «Όχι, δεν το είδα, αλλά θα σε βοηθήσω να ψάξεις.»", "a": "f7ce2726beb4f9da"}, {"fr": "Il grimpa sur la carapace de Tortue.", "ph": "ιλ γκρεμπά σουρ λα καραπάς ντε Τορτού", "gr": "Σκαρφάλωσε στο καβούκι της Χελώνας.", "a": "b48dd9dab5f04e90"}, {"fr": "Tortue reprit sa route avec Escargot sur le dos.", "ph": "Τορτού ρεπρί σα ρουτ αβέκ Εσκαργκό σουρ λε ντο", "gr": "Η Χελώνα συνέχισε τον δρόμο της με τον Σαλίγκαρο στην πλάτη.", "a": "89cbf76a8e11c59c"}, {"fr": "Ils cherchèrent et cherchèrent, mais aucun signe d’une maison.", "ph": "ιλ σερσέρ ε σερσέρ, με οκέν σινι ντουν μεζόν", "gr": "Έψαξαν κι έψαξαν, μα σπίτι πουθενά.", "a": "d6f1028d21536a34"}, {"fr": "Le soleil était haut dans le ciel.", "ph": "λε σολέιγ ετέ ο νταν λε σιέλ", "gr": "Ο ήλιος ήταν ψηλά στον ουρανό.", "a": "d46014a018beccbb"}]}, {"img": "tortue/03", "lines": [{"fr": "Un peu plus tard, ils croisèrent Moineau.", "ph": "εν πε πλου ταρ, ιλ κρουαζέρ Μουανό", "gr": "Λίγο αργότερα συνάντησαν τον Σπουργίτη.", "a": "1986a99d65cf8d57"}, {"fr": "« Vous cherchez quelque chose ? », demanda Moineau.", "ph": "βου σερσέ κελκ σοζ ? ντεμανντά Μουανό", "gr": "«Ψάχνετε κάτι;» ρώτησε ο Σπουργίτης.", "a": "67f7bb93cf21bc68"}, {"fr": "« Oui, Moineau, je cherche ma maison. Est-ce que tu l’aurais vue, par hasard ? »", "ph": "ουί, Μουανό, ζε σερς μα μεζόν. ες κε του λορέ βου, παρ αζάρ ?", "gr": "«Ναι, Σπουργίτη, ψάχνω το σπίτι μου. Μήπως το είδες πουθενά;»", "a": "ae6b28d1bd54f900"}, {"fr": "Moineau dit : « Non, je ne l’ai pas vue, mais je vais t’aider à chercher. »", "ph": "Μουανό ντι : νον, ζε νε λε πα βου, με ζε βε τεντέ α σερσέ", "gr": "Ο Σπουργίτης είπε: «Όχι, δεν το είδα, αλλά θα σε βοηθήσω να ψάξεις.»", "a": "baa8c59587c85672"}]}, {"img": "tortue/04", "lines": [{"fr": "Il battit des ailes et fila au loin.", "ph": "ιλ μπατί ντεζέλ ε φιλά ο λουέν", "gr": "Χτύπησε τα φτερά του και πέταξε μακριά.", "a": "b34793fe31ca946c"}, {"fr": "« Mais tu vas trop vite pour moi », se plaignit Tortue.", "ph": "με του βα τρο βιτ πουρ μουά, σε πλενί Τορτού", "gr": "«Μα πας πολύ γρήγορα για μένα», παραπονέθηκε η Χελώνα.", "a": "c932a2a72976e40a"}, {"fr": "Moineau revint : « Alors, je vais monter sur ton dos, moi aussi. »", "ph": "Μουανό ρεβέν : αλόρ, ζε βε μοντέ σουρ τον ντο, μουά οσί", "gr": "Ο Σπουργίτης γύρισε πίσω: «Τότε θα ανέβω κι εγώ στην πλάτη σου.»", "a": "070547b5f0c28e3b"}, {"fr": "Tortue continua, avec Escargot et Moineau perchés sur sa carapace.", "ph": "Τορτού κοντινουά, αβέκ Εσκαργκό ε Μουανό περσέ σουρ σα καραπάς", "gr": "Η Χελώνα συνέχισε, με τον Σαλίγκαρο και τον Σπουργίτη σκαρφαλωμένους στο καβούκι της.", "a": "53e328b84a103b35"}, {"fr": "Ils cherchèrent et cherchèrent, mais aucun signe de maison.", "ph": "ιλ σερσέρ ε σερσέρ, με οκέν σινι ντε μεζόν", "gr": "Έψαξαν κι έψαξαν, μα σπίτι πουθενά.", "a": "47876d694f6747bc"}, {"fr": "Le soleil avait un peu baissé dans le ciel.", "ph": "λε σολέιγ αβέ εν πε μπεσέ νταν λε σιέλ", "gr": "Ο ήλιος είχε κατέβει λίγο στον ουρανό.", "a": "889022325fcafcde"}]}, {"img": "tortue/05", "lines": [{"fr": "Un peu plus tard, ils croisèrent Coccinelle.", "ph": "εν πε πλου ταρ, ιλ κρουαζέρ Κοξινέλ", "gr": "Λίγο αργότερα συνάντησαν την Πασχαλίτσα.", "a": "b08a947728928d00"}, {"fr": "« Vous cherchez quelque chose ? », demanda Coccinelle.", "ph": "βου σερσέ κελκ σοζ ? ντεμανντά Κοξινέλ", "gr": "«Ψάχνετε κάτι;» ρώτησε η Πασχαλίτσα.", "a": "1d32d192ba49ef07"}, {"fr": "« Oui, Coccinelle, je cherche ma maison. Est-ce que tu l’aurais vue, par hasard ? »", "ph": "ουί, Κοξινέλ, ζε σερς μα μεζόν. ες κε του λορέ βου, παρ αζάρ ?", "gr": "«Ναι, Πασχαλίτσα, ψάχνω το σπίτι μου. Μήπως το είδες πουθενά;»", "a": "9d1667e7027f0420"}]}, {"img": "tortue/06", "lines": [{"fr": "Coccinelle dit : « Non, je ne l’ai pas vue, mais je vais t’aider à chercher. »", "ph": "Κοξινέλ ντι : νον, ζε νε λε πα βου, με ζε βε τεντέ α σερσέ", "gr": "Η Πασχαλίτσα είπε: «Όχι, δεν το είδα, αλλά θα σε βοηθήσω να ψάξεις.»", "a": "1fba76ab07177e66"}, {"fr": "Elle sauta sur le dos de Tortue qui reprit son chemin,", "ph": "ελ σοτά σουρ λε ντο ντε Τορτού κι ρεπρί σον σεμέν,", "gr": "Πήδηξε στην πλάτη της Χελώνας, που ξανάρχισε τον δρόμο της,", "a": "365c4e505bbf7975"}, {"fr": "avec Escargot, Moineau et Coccinelle perchés sur le dos.", "ph": "αβέκ Εσκαργκό, Μουανό ε Κοξινέλ περσέ σουρ λε ντο", "gr": "με τον Σαλίγκαρο, τον Σπουργίτη και την Πασχαλίτσα σκαρφαλωμένους στην πλάτη της.", "a": "942a035cd4a8cd8e"}, {"fr": "Ils cherchèrent et cherchèrent, mais aucun signe de maison.", "ph": "ιλ σερσέρ ε σερσέρ, με οκέν σινι ντε μεζόν", "gr": "Έψαξαν κι έψαξαν, μα σπίτι πουθενά.", "a": "47876d694f6747bc"}, {"fr": "Une petite brise commençait à souffler.", "ph": "ουν πετίτ μπριζ κομανσέ α σουφλέ", "gr": "Ένα αεράκι άρχισε να φυσάει.", "a": "3ed43b5b71ac15c1"}]}, {"img": "tortue/07", "lines": [{"fr": "Un peu plus tard ils croisèrent Souris, qui tressait une couronne de marguerites.", "ph": "εν πε πλου ταρ ιλ κρουαζέρ Σουρί, κι τρεσέ ουν κουρόν ντε μαργκερίτ", "gr": "Λίγο αργότερα συνάντησαν την Ποντικίνα, που έπλεκε ένα στεφάνι από μαργαρίτες.", "a": "98419c7b7a68f8b4"}, {"fr": "« Vous cherchez quelque chose ? », demanda Souris.", "ph": "βου σερσέ κελκ σοζ ? ντεμανντά Σουρί", "gr": "«Ψάχνετε κάτι;» ρώτησε η Ποντικίνα.", "a": "bc65d58a4c8c643c"}, {"fr": "« Oui, Souris, je cherche ma maison. Est-ce que tu l’aurais vue, par hasard ? »", "ph": "ουί, Σουρί, ζε σερς μα μεζόν. ες κε του λορέ βου, παρ αζάρ ?", "gr": "«Ναι, Ποντικίνα, ψάχνω το σπίτι μου. Μήπως το είδες πουθενά;»", "a": "33fdd4c9a412e880"}, {"fr": "Souris dit : « Non, je ne l’ai pas vue, mais je vais t’aider à chercher. »", "ph": "Σουρί ντι : νον, ζε νε λε πα βου, με ζε βε τεντέ α σερσέ", "gr": "Η Ποντικίνα είπε: «Όχι, δεν το είδα, αλλά θα σε βοηθήσω να ψάξεις.»", "a": "3c350ebfe6bba500"}, {"fr": "Et elle sauta sur le dos de Tortue.", "ph": "ε ελ σοτά σουρ λε ντο ντε Τορτού", "gr": "Και πήδηξε στην πλάτη της Χελώνας.", "a": "7430d60c76568f89"}, {"fr": "« Attendez, je ne peux pas laisser mes fleurs derrière. »", "ph": "ατανντέ, ζε νε πε πα λεσέ με φλέρ ντεριέρ", "gr": "«Σταθείτε, δεν μπορώ να αφήσω πίσω τα λουλούδια μου.»", "a": "69c3cf70696ad1c5"}]}, {"img": "tortue/08", "lines": [{"fr": "Tortue attendit.", "ph": "Τορτού ατανντί", "gr": "Η Χελώνα περίμενε.", "a": "95e94a74881f03f1"}, {"fr": "Souris tendit la patte et ramassa ses marguerites.", "ph": "Σουρί τανντί λα πατ ε ραμασά σε μαργκερίτ", "gr": "Η Ποντικίνα άπλωσε το ποδαράκι της και μάζεψε τις μαργαρίτες της.", "a": "72fee929f7dc60f5"}, {"fr": "Tortue repartit, avec Escargot et Moineau et Coccinelle et Souris sur son dos.", "ph": "Τορτού ρεπαρτί, αβέκ Εσκαργκό ε Μουανό ε Κοξινέλ ε Σουρί σουρ σον ντο", "gr": "Η Χελώνα ξεκίνησε πάλι, με τον Σαλίγκαρο και τον Σπουργίτη και την Πασχαλίτσα και την Ποντικίνα στην πλάτη της.", "a": "ef616aa17958e0b4"}, {"fr": "Ils cherchèrent et cherchèrent, mais aucun signe d’une maison.", "ph": "ιλ σερσέρ ε σερσέρ, με οκέν σινι ντουν μεζόν", "gr": "Έψαξαν κι έψαξαν, μα σπίτι πουθενά.", "a": "d6f1028d21536a34"}, {"fr": "Le vent soulevait les feuilles et les faisait tourner autour des pieds de Tortue.", "ph": "λε βαν σουλβέ λε φέιγ ε λε φεζέ τουρνέ οτούρ ντε πιέ ντε Τορτού", "gr": "Ο αέρας σήκωνε τα φύλλα και τα στριφογύριζε γύρω από τα πόδια της Χελώνας.", "a": "e46641d6d8bebf86"}, {"fr": "Tortue était fatiguée.", "ph": "Τορτού ετέ φατιγκέ", "gr": "Η Χελώνα ήταν κουρασμένη.", "a": "daebefe0d4118b48"}, {"fr": "« Vous êtes lourds », soupira-t-elle.", "ph": "βουζέτ λουρ, σουπιρά τελ", "gr": "«Είστε βαριοί», αναστέναξε.", "a": "859fc8d6f4b475c6"}]}, {"img": "tortue/09", "lines": [{"fr": "Le vent devint plus fort.", "ph": "λε βαν ντεβέν πλου φορ", "gr": "Ο αέρας δυνάμωσε.", "a": "9889833d1e360c5d"}, {"fr": "Le ciel s’assombrit.", "ph": "λε σιέλ σασομπρί", "gr": "Ο ουρανός σκοτείνιασε.", "a": "05314f663455cba2"}, {"fr": "« Oh, où est ma maison ? », demanda Tortue.", "ph": "ο, ου ε μα μεζόν ? ντεμανντά Τορτού", "gr": "«Ω, πού είναι το σπίτι μου;» ρώτησε η Χελώνα.", "a": "3411b0b78b2ce7f5"}, {"fr": "Le tonnerre grondait sur les collines.", "ph": "λε τονέρ γκρονντέ σουρ λε κολίν", "gr": "Η βροντή μούγκριζε πάνω από τους λόφους.", "a": "d1a402046d788704"}, {"fr": "Les éclairs tombaient au loin.", "ph": "λεζεκλέρ τονμπέ ο λουέν", "gr": "Οι αστραπές έπεφταν μακριά.", "a": "ebb443274bbd28e9"}, {"fr": "Plic, plic, faisait la pluie.", "ph": "πλικ, πλικ, φεζέ λα πλουί", "gr": "Πλικ, πλικ, έκανε η βροχή.", "a": "bdc8b0deeffe6771"}, {"fr": "« Oh, où est la maison de Tortue ? », demandèrent Escargot et Moineau et Coccinelle et Souris.", "ph": "ο, ου ε λα μεζόν ντε Τορτού ? ντεμανντέρ Εσκαργκό ε Μουανό ε Κοξινέλ ε Σουρί", "gr": "«Ω, πού είναι το σπίτι της Χελώνας;» ρώτησαν ο Σαλίγκαρος και ο Σπουργίτης και η Πασχαλίτσα και η Ποντικίνα.", "a": "e2491723907684c0"}]}, {"img": "tortue/10", "lines": [{"fr": "Le vent tourbillonnait et fouettait.", "ph": "λε βαν τουρμπιγιονέ ε φουετέ", "gr": "Ο αέρας στροβιλιζόταν και μαστίγωνε.", "a": "1366eb96af99ce19"}, {"fr": "Il fit tomber Escargot et Moineau et Coccinelle et Souris du dos de Tortue.", "ph": "ιλ φι τονμπέ Εσκαργκό ε Μουανό ε Κοξινέλ ε Σουρί ντου ντο ντε Τορτού", "gr": "Έριξε κάτω τον Σαλίγκαρο και τον Σπουργίτη και την Πασχαλίτσα και την Ποντικίνα από την πλάτη της Χελώνας.", "a": "c4b8903c89382ab6"}]}, {"img": "tortue/11", "lines": [{"fr": "Puis vint la grêle, tac-tac-tac.", "ph": "πουί βεν λα γκρελ, τακ-τακ-τακ", "gr": "Ύστερα ήρθε το χαλάζι, τακ-τακ-τακ.", "a": "54220cdb6e7e63d3"}, {"fr": "Tortue eut si peur qu’elle se recroquevilla dans sa carapace.", "ph": "Τορτού ου σι πέρ κελ σε ρεκροκβιγιά νταν σα καραπάς", "gr": "Η Χελώνα φοβήθηκε τόσο πολύ που ζάρωσε μέσα στο καβούκι της.", "a": "79522cce191ce4b9"}, {"fr": "C’était chaud et douillet à l’intérieur.", "ph": "σετέ σο ε ντουγιέ α λεντεριέρ", "gr": "Ήταν ζεστά και βολικά εκεί μέσα.", "a": "e9086158f3ff6827"}, {"fr": "« Oh, voici ma maison ! »", "ph": "ο, βουασί μα μεζόν !", "gr": "«Ω, να το σπίτι μου!»", "a": "2e4ae385f2065d8c"}]}, {"img": "tortue/12", "lines": [{"fr": "« Oh, voici la maison de Tortue ! »", "ph": "ο, βουασί λα μεζόν ντε Τορτού !", "gr": "«Ω, να το σπίτι της Χελώνας!»", "a": "2786d35e8815c821"}]}]}];

<script>/* Bedtime French — all behaviour for every book. Inlined into the built HTML by
   tools/build.py, so edit here, never in the generated file.

   The build injects three globals:
     BOOKS  — [{id, title_fr, title_gr, level, summary_gr, source, cover,
                pages:[{img, lines:[{fr, ph, gr, a}]}]}]
     AUDIO  — {clipKey: "data:audio/mp4;base64,…"}
     IMAGES — {imgKey: "data:image/jpeg;base64,…"}

   A book is [cover] + story pages + [colophon]. Index 0 is the cover, so page
   number N in the folio is index N. Where you stopped is remembered per book. */

const LS = {
  page:  id => `bf.page.${id}`,
  slow:  'bf.slow',
  greek: 'bf.greek',
};

const $ = s => document.querySelector(s);

let book = null;        // the book being read
let idx = 0;            // 0 = cover, 1..N = story, N+1 = colophon
let slow = localStorage.getItem(LS.slow) === '1';
let showGreek = localStorage.getItem(LS.greek) !== '0';   // on unless turned off

/* ------------------------------------------------------------------- audio */

let sound = null, soundBtn = null, reading = false;

function stopAudio() {
  if (sound) { sound.pause(); sound = null; }
  if (soundBtn) { soundBtn.classList.remove('on'); soundBtn = null; }
  document.querySelectorAll('.line.playing').forEach(l => l.classList.remove('playing'));
  reading = false;
  const b = $('#readPage');
  if (b) b.textContent = '▶ διάβασε';
}

function playClip(key, btn, onEnd) {
  if (sound) sound.pause();
  if (soundBtn) soundBtn.classList.remove('on');
  sound = new Audio(AUDIO[key]);
  // "αργά" slows playback in the browser rather than shipping a second recording
  // of every line. preservesPitch keeps her voice from dropping an octave.
  sound.preservesPitch = true;
  sound.mozPreservesPitch = true;
  sound.webkitPreservesPitch = true;
  sound.playbackRate = slow ? SLOW_RATE : 1;
  soundBtn = btn || null;
  if (soundBtn) soundBtn.classList.add('on');
  sound.onended = () => { if (soundBtn) soundBtn.classList.remove('on'); if (onEnd) onEnd(); };
  sound.play();
}

/** Read every line on the page in order, with a beat between them. */
function readPage() {
  const lines = [...document.querySelectorAll('.page .line')];
  if (!lines.length) return;
  let i = 0;
  reading = true;
  $('#readPage').textContent = '■ στοπ';
  const step = () => {
    document.querySelectorAll('.line.playing').forEach(l => l.classList.remove('playing'));
    if (!reading || i >= lines.length) { stopAudio(); return; }
    const line = lines[i++];
    line.classList.add('playing');
    playClip(line.dataset.a, null, () => setTimeout(step, 650));
  };
  step();
}

/* ------------------------------------------------------------------- shelf */

function pageOf(b) {
  const n = parseInt(localStorage.getItem(LS.page(b.id)) || '0', 10);
  return Math.min(Math.max(n, 0), b.pages.length + 1);
}

function renderShelf() {
  const list = $('#shelf-list');
  list.innerHTML = '';
  BOOKS.forEach(b => {
    const at = pageOf(b), total = b.pages.length;
    const where = at === 0 ? 'δεν το αρχίσαμε'
                : at > total ? 'το τελειώσαμε'
                : `σελίδα ${at} από ${total}`;
    const card = document.createElement('button');
    card.className = 'book-card';
    card.innerHTML = `
      <img src="${IMAGES[b.cover]}" alt="">
      <div>
        <h2>${b.title_gr}</h2>
        <div class="fr">${b.title_fr}</div>
        <div class="sum">${b.summary_gr}</div>
        <div class="meta">${total} σελίδες · <b>${where}</b></div>
      </div>`;
    card.onclick = () => openBook(b.id);
    list.appendChild(card);
  });
}

/* -------------------------------------------------------------------- book */

function openBook(id) {
  book = BOOKS.find(b => b.id === id);
  idx = pageOf(book);
  stopAudio();
  $('#shelf').classList.remove('on');
  $('#reader').classList.add('on');
  render();
  window.scrollTo(0, 0);
}

function toShelf() {
  stopAudio();
  book = null;
  $('#reader').classList.remove('on');
  $('#shelf').classList.add('on');
  renderShelf();
  window.scrollTo(0, 0);
}

function go(delta) {
  const last = book.pages.length + 1;
  const next = idx + delta;
  if (next < 0 || next > last) return;
  stopAudio();
  const old = $('.page');
  const dir = delta > 0 ? 'fwd' : 'back';
  idx = next;
  localStorage.setItem(LS.page(book.id), idx);

  const done = () => { render(dir); };
  if (old && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    old.classList.add('leave-' + dir);
    old.addEventListener('animationend', done, { once: true });
    setTimeout(() => { if ($('.page') === old) done(); }, 320);   // safety net
  } else {
    done();
  }
}

function lineHTML(l) {
  return `<div class="line" data-a="${l.a}">
      <button class="speak" aria-label="άκου">▶</button>
      <div class="fr">${l.fr}</div>
      <div class="ph">${l.ph}</div>
      <div class="gr">${l.gr}</div>
    </div>`;
}

function coverHTML() {
  const s = book.source;
  return `<div class="page plain">
    <div class="plate">
      <img src="${IMAGES[book.cover]}" alt="">
      <h1 class="fr-title">${book.title_fr}</h1>
      <div class="gr-title">${book.title_gr}</div>
      <div class="rule"></div>
      <dl>
        <dt>κείμενο</dt><dd>${s.authors.join(', ')}</dd>
        <dt>εικόνες</dt><dd>${(s.illustrators || []).join(', ') || '—'}</dd>
        <dt>έκδοση</dt><dd>${s.publisher}</dd>
      </dl>
      <button class="begin">Άνοιξε το βιβλίο</button>
      <p class="licence">Άδεια <a href="https://creativecommons.org/licenses/by/4.0/">${s.licence}</a>.
        Το γαλλικό κείμενο και οι εικόνες είναι αυτούσια από τον εκδότη·
        η ελληνική μετάφραση και η προφορά είναι δικές μας.</p>
    </div></div>`;
}

function colophonHTML() {
  const s = book.source;
  return `<div class="page plain">
    <div class="colophon">
      <div class="end">Fin</div>
      <p><b>${book.title_fr}</b> — ${s.authors.join(', ')}${
        (s.illustrators || []).length ? `, εικονογράφηση ${s.illustrators.join(', ')}` : ''}.<br>
        ${s.publisher}, άδεια <a href="https://creativecommons.org/licenses/by/4.0/">${s.licence}</a>.</p>
      <p><a href="${s.url}">${s.url}</a></p>
      <button class="again">Ξανά από την αρχή</button>
    </div></div>`;
}

function storyHTML(p, n) {
  const lines = p.lines.map(lineHTML).join('');
  if (!p.img) {
    return `<div class="page plain"><div class="body">${lines}</div>
      <div class="folio">Σελίδα ${n} από ${book.pages.length}</div></div>`;
  }
  return `<div class="page illus">
      <div class="ill"><img src="${IMAGES[p.img]}" alt=""></div>
      <div class="body">${lines}</div>
      <div class="folio">Σελίδα ${n} από ${book.pages.length}</div>
    </div>`;
}

function render(enterDir) {
  const total = book.pages.length;
  $('#book-title').textContent = book.title_gr;
  $('#prev').disabled = idx <= 0;
  $('#next').disabled = idx > total;
  $('#slow').setAttribute('aria-pressed', slow);
  $('#greek').setAttribute('aria-pressed', showGreek);

  const stage = $('#stage');
  stage.innerHTML = idx === 0 ? coverHTML()
                  : idx > total ? colophonHTML()
                  : storyHTML(book.pages[idx - 1], idx);

  const page = stage.firstElementChild;
  page.classList.toggle('hide-greek', !showGreek);
  if (enterDir) page.classList.add('enter-' + enterDir);

  // reading tools only make sense on a story page
  const onStory = idx > 0 && idx <= total;
  $('#readPage').style.visibility = onStory ? '' : 'hidden';

  page.querySelectorAll('.speak').forEach(btn => {
    btn.onclick = ev => {
      ev.stopPropagation();
      const line = btn.closest('.line');
      stopAudio();
      playClip(line.dataset.a, btn);
    };
  });
  const begin = page.querySelector('.begin');
  if (begin) begin.onclick = () => go(1);
  const again = page.querySelector('.again');
  if (again) again.onclick = () => { stopAudio(); idx = 0;
    localStorage.setItem(LS.page(book.id), 0); render('back'); };
}

/* -------------------------------------------------------------------- wire */

function init() {
  $('#back').onclick = toShelf;
  $('#prev').onclick = () => go(-1);
  $('#next').onclick = () => go(1);
  $('#readPage').onclick = () => reading ? stopAudio() : readPage();
  $('#slow').onclick = () => {
    slow = !slow;
    localStorage.setItem(LS.slow, slow ? '1' : '0');
    $('#slow').setAttribute('aria-pressed', slow);
    stopAudio();
  };
  $('#greek').onclick = () => {
    showGreek = !showGreek;
    localStorage.setItem(LS.greek, showGreek ? '1' : '0');
    $('#greek').setAttribute('aria-pressed', showGreek);
    const p = $('.page');
    if (p) p.classList.toggle('hide-greek', !showGreek);
  };

  document.addEventListener('keydown', e => {
    if (!book) return;
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'Escape') toShelf();
  });

  // swipe to turn
  let x0 = null, y0 = null;
  document.addEventListener('touchstart', e => {
    x0 = e.changedTouches[0].clientX; y0 = e.changedTouches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!book || x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? 1 : -1);
    x0 = y0 = null;
  }, { passive: true });

  renderShelf();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
