<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7ecE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Παραμύθια στα γαλλικά</title>
<style>/* Bedtime French — the whole app's styling. Inlined into the built HTML by
   tools/build.py, so edit here, never in the generated file.

   The object is a picture book, not an app: one page at a time, and the page
   turns. Direction "Χαραυγή" — a washed peach-to-blue ground, deep teal ink, one
   coral accent, which is also the palette the illustrators happened to paint in.

   Type comes from each language's own tradition: French titles in Didot, French
   sentences in Charter, Greek in Palatino whose Greek Zapf drew, and numbers in
   Avenir — Frutiger's Swiss face, for where the family lives now.

   One page has three possible layouts and picks its own:
     · no illustration          → text alone
     · portrait / phone         → picture above, text below
     · landscape / tablet wide  → picture left, text right, like an open book
   Turning the tablet re-lays the same page. */

:root {
  --page:   #fffcfa;
  --edge:   #ecdcd6;
  --ink:    #1f4750;
  --soft:   #5c7f88;
  --faint:  #9db4ba;
  --accent: #e2725b;
  --accent-soft: #fbe7e1;
  --mat:    #f3ece8;   /* behind an illustration that doesn't fill its box */

  --fr-display: Didot, 'Bodoni 72', 'Times New Roman', serif;
  --read:       Charter, 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --greek:      Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --util:       'Avenir Next', Avenir, 'Helvetica Neue', system-ui, sans-serif;

  --lift: 0 24px 44px -24px rgba(31, 71, 80, .45);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }

body {
  margin: 0; min-height: 100%;
  background: linear-gradient(160deg, #fbe9e0 0%, #e4eef2 55%, #dfe7f0 100%) fixed;
  color: var(--ink);
  font-family: var(--util);
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}

.screen { display: none; }
.screen.on { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

/* ==========================================================  the shelf  === */

.shelf { max-width: 680px; margin: 0 auto; padding: 3.5rem 1.2rem 5rem; }
.shelf-head { text-align: center; margin-bottom: 2.6rem; }
.shelf-head h1 {
  font-family: var(--greek); font-weight: 400;
  font-size: clamp(1.6rem, 5vw, 2.05rem); margin: 0 0 .5rem;
}
.shelf-head p {
  font-family: var(--greek); color: var(--soft);
  font-size: .95rem; margin: 0 auto; max-width: 27rem;
}

.book-card {
  display: grid; grid-template-columns: 5.4rem 1fr; gap: 1.1rem; align-items: center;
  width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit;
  background: var(--page); border: 1px solid var(--edge); border-radius: 14px;
  padding: 1rem; margin: 0 0 1rem; box-shadow: var(--lift);
  transition: transform .18s ease, box-shadow .18s ease;
}
.book-card:hover { transform: translateY(-2px); }
.book-card:active { transform: translateY(0); }
.book-card img {
  width: 5.4rem; height: 5.4rem; object-fit: cover;
  border-radius: 9px; background: var(--mat); display: block;
}
.book-card h2 { font-family: var(--greek); font-size: 1.18rem; font-weight: 400; margin: 0; }
.book-card .fr { font-family: var(--fr-display); font-size: .92rem; color: var(--accent); margin-bottom: .35rem; }
.book-card .sum {
  font-family: var(--greek); font-size: .84rem; color: var(--soft);
  margin-bottom: .5rem; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.book-card .meta {
  font-family: var(--util); font-size: .66rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--faint);
}
.book-card .meta b { color: var(--accent); font-weight: 600; }

/* ===========================================================  the book  === */

/* The reader fills the screen: a fixed top bar, then the page takes all the rest.
   Turn arrows float over the page edges, so they cost no height whatsoever. */
.book {
  max-width: 680px; margin: 0 auto; padding: .3rem 1.2rem 1.1rem;
  height: 100dvh; display: flex; flex-direction: column; position: relative;
}

.book-top { display: flex; align-items: center; gap: .35rem; padding: .45rem 0 .75rem; flex: none; }
.book-top .title {
  flex: 1; font-family: var(--greek); font-size: .98rem; color: var(--soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.linkish {
  border: 0; background: none; padding: .35rem .45rem; cursor: pointer;
  color: var(--soft); font-family: var(--util); font-size: .76rem; letter-spacing: .03em;
  border-radius: 6px;
}
.linkish:hover { color: var(--accent); }
.linkish[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

/* --- the paper ---------------------------------------------------------- */

.stage { perspective: 1600px; flex: 1; min-height: 0; display: flex; }

.page {
  position: relative; overflow: hidden;
  background: var(--page); border: 1px solid var(--edge); border-radius: 14px;
  box-shadow: var(--lift);
  transform-origin: left center;
  display: grid;
  width: 100%;
}

@keyframes leave-fwd  { to   { transform: rotateY(-12deg) translateX(-2.5%); opacity: 0; } }
@keyframes enter-fwd  { from { transform: rotateY(8deg)   translateX(2.5%);  opacity: 0; } }
@keyframes leave-back { to   { transform: rotateY(8deg)   translateX(2.5%);  opacity: 0; } }
@keyframes enter-back { from { transform: rotateY(-12deg) translateX(-2.5%); opacity: 0; } }

.page.leave-fwd  { animation: leave-fwd  .24s ease-in forwards; }
.page.enter-fwd  { animation: enter-fwd  .32s ease-out; }
.page.leave-back { animation: leave-back .24s ease-in forwards; }
.page.enter-back { animation: enter-back .32s ease-out; }

@media (prefers-reduced-motion: reduce) {
  .page.leave-fwd, .page.leave-back { animation: none; opacity: 0; transition: opacity .12s; }
  .page.enter-fwd, .page.enter-back { animation: none; }
}

/* --- illustration ------------------------------------------------------- */

/* `contain`, not `cover`: these are paintings with their own edges, and cropping
   them lops the tops off heads. Better to letterbox onto a warm mat. */
.ill { background: var(--mat); display: flex; align-items: center; justify-content: center; }
.ill img { display: block; width: 100%; height: 100%; object-fit: contain; }

.body { padding: 1.7rem 1.6rem 3.2rem; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* layout 4 — no picture */
.page.plain { grid-template-rows: 1fr; }
.page.plain .body { padding-top: 2.6rem; }

/* layout 1 — portrait: picture over text (the default) */
.page.illus { grid-template-rows: minmax(0, 42%) minmax(0, 1fr); }
.page.illus .ill { min-height: 0; padding: .6rem; }

/* layout 3 — landscape and roomy: facing pages */
@media (orientation: landscape) and (min-width: 800px) {
  .book { max-width: 960px; }
  .page { min-height: 0; }
  .page.illus { grid-template-rows: 1fr; grid-template-columns: 1.05fr 1fr; }
  .page.illus .ill {
    height: 100%; min-height: 0; padding: 1.2rem;
    /* a soft gutter instead of a hard rule: the shadow of the spine */
    box-shadow: inset -14px 0 18px -16px rgba(31, 71, 80, .35);
  }
  .page.illus .body { align-self: stretch; padding: 2.2rem 2.1rem 3.4rem; }
  .page.illus .folio { text-align: right; right: 2.1rem; left: auto; }
}

/* --- a line ------------------------------------------------------------- */

.line { position: relative; padding: 0 0 1.15rem 2.5rem; }
.line .fr {
  font-family: var(--read); font-size: 1.24rem; line-height: 1.45;
  color: var(--ink); margin: 0 0 .26rem;
}
.line .ph { font-family: var(--greek); font-size: .97rem; color: var(--accent); margin: 0; }
.line .gr { font-family: var(--greek); font-size: .89rem; color: var(--soft); margin: .1rem 0 0; }
.line.playing .fr { color: var(--accent); }

.hide-greek .line .ph, .hide-greek .line .gr { display: none; }
.hide-greek .line { padding-bottom: .95rem; }

.speak {
  position: absolute; left: 0; top: .2rem;
  width: 1.7rem; height: 1.7rem; border-radius: 50%;
  border: 1px solid var(--edge); background: var(--page); color: var(--accent);
  cursor: pointer; font-size: .56rem; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s, border-color .15s, transform .1s;
}
.speak:hover { border-color: var(--accent); }
.speak:active { transform: scale(.9); }
.speak.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* --- cover and colophon ------------------------------------------------- */

.plate { text-align: center; padding: 2.4rem 1.6rem 3.4rem; align-self: center; }
.plate img {
  width: min(58%, 13rem); aspect-ratio: 1; object-fit: contain;
  border-radius: 12px; background: var(--mat); margin: 0 auto 1.8rem; display: block;
}
.plate .fr-title {
  font-family: var(--fr-display); font-size: clamp(1.8rem, 6.5vw, 2.5rem);
  line-height: 1.15; margin: 0 0 .55rem; font-weight: 400;
}
.plate .gr-title { font-family: var(--greek); font-size: 1.02rem; color: var(--soft); margin: 0 0 1.9rem; }
.plate .rule { width: 42px; height: 1px; background: var(--accent); margin: 0 auto 1.9rem; }
.plate dl { font-family: var(--util); font-size: .78rem; color: var(--soft); margin: 0; }
.plate dt {
  font-size: .62rem; letter-spacing: .13em; text-transform: uppercase;
  color: var(--faint); margin-bottom: .1rem;
}
.plate dd { margin: 0 0 .85rem; }
.plate .licence { margin-top: 1.6rem; font-size: .71rem; color: var(--faint); line-height: 1.65; }
.plate .licence a { color: var(--accent); }
.plate .begin {
  margin-top: 2rem; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  font-family: var(--util); font-size: .86rem; font-weight: 600; padding: .7rem 1.6rem;
  border-radius: 999px; cursor: pointer;
}

.colophon { text-align: center; padding: 3rem 1.6rem; align-self: center; }
.colophon .end { font-family: var(--fr-display); font-size: 1.7rem; margin: 0 0 1.6rem; }
.colophon p {
  font-family: var(--util); font-size: .76rem; color: var(--soft);
  line-height: 1.7; margin: 0 auto 1rem; max-width: 24rem;
}
.colophon a { color: var(--accent); }
.colophon .again {
  margin-top: 1.4rem; border: 1px solid var(--edge); background: var(--page); color: var(--ink);
  font-family: var(--util); font-size: .82rem; padding: .6rem 1.3rem;
  border-radius: 999px; cursor: pointer;
}

/* --- foot --------------------------------------------------------------- */

.folio {
  position: absolute; left: 0; right: 0; bottom: 0; padding: .9rem 0 1.1rem;
  text-align: center; font-family: var(--util); font-size: .66rem;
  letter-spacing: .14em; text-transform: uppercase; color: var(--faint);
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(255,252,250,0), var(--page) 45%);
}

.turn {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 4;
  width: 3rem; height: 3rem; border-radius: 50%;
  border: 1px solid var(--edge); background: var(--page); color: var(--ink);
  font-size: 1.05rem; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(255, 252, 250, .93); backdrop-filter: blur(6px);
  box-shadow: 0 8px 20px -12px rgba(31, 71, 80, .8);
  transition: border-color .15s, color .15s, opacity .15s, background .15s;
}
.turn.prev { left: .35rem; }
.turn.next { right: .35rem; }
.turn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.turn:active:not(:disabled) { transform: translateY(-50%) scale(.94); }
.turn:disabled { opacity: 0; pointer-events: none; }

/* on a wide screen there is room outside the paper, so sit them in the margin */
@media (min-width: 800px) {
  .turn.prev { left: -1.1rem; }
  .turn.next { right: -1.1rem; }
}

/* on a phone the page is nearly full width, so mid-height arrows would land on
   the play buttons. Bottom corners instead — also where the thumb already is. */
@media (max-width: 560px) {
  .turn { top: auto; bottom: .7rem; transform: none; }
  .turn:active:not(:disabled) { transform: scale(.94); }
  .turn.prev { left: .7rem; }
  .turn.next { right: .7rem; }
}

@media (max-width: 520px) {
  .body { padding: 1.4rem 1.2rem 3rem; }
  .line { padding-left: 2.2rem; }
  .line .fr { font-size: 1.15rem; }
  .book-card { grid-template-columns: 4.4rem 1fr; }
  .book-card img { width: 4.4rem; height: 4.4rem; }
}
</style>
</head>
<body>

<section id="shelf" class="screen on">
  <div class="shelf">
    <div class="shelf-head">
      <h1>Παραμύθια στα γαλλικά</h1>
      <p>Διάλεξε ένα βιβλίο. Κάθε βράδυ γυρίζουμε μία σελίδα — ή δύο,
         αν δεν νυστάζει ακόμα.</p>
    </div>
    <div id="shelf-list"></div>
  </div>
</section>

<section id="reader" class="screen">
  <div class="book">

  </div>
</section>

ον μερσί, λουί ρεπονντίρ τιλ του", "gr": "«Όχι, ευχαριστώ», του απάντησαν όλοι.", "a": "e031d0082361a42c"}, {"fr": "« Tes bananes sont délicieuses, mais on en a trop mangé.", "ph": "τε μπανάν σον ντελισιέζ, με ον ναν να τρο μανζέ", "gr": "«Οι μπανάνες σου είναι πεντανόστιμες, αλλά φάγαμε πάρα πολλές.", "a": "b3dfa1e92cc5bac7"}, {"fr": "On n'en peut plus ! »", "ph": "ον ναν πε πλου !", "gr": "Δεν αντέχουμε άλλο!»", "a": "0c8e2ec55ebfce66"}]}, {"img": "bananes/05", "lines": [{"fr": "Pauvre Sringeri Srinivas !", "ph": "ποβρ Σρενζερί Σρινιβάς !", "gr": "Καημένε Σρινγκέρι Σρινιβά!", "a": "54fea37a881a46a5"}, {"fr": "Qu'allait-il bien pouvoir faire de sa belle récolte de bananes ?", "ph": "καλέ τιλ μπιεν πουβουάρ φερ ντε σα μπελ ρεκόλτ ντε μπανάν ?", "gr": "Τι θα μπορούσε άραγε να κάνει με την ωραία του σοδειά από μπανάνες;", "a": "a148a24a481f5e34"}]}, {"img": "bananes/06", "lines": [{"fr": "Il décida de demander conseil auprès du Centre agricole de Doddooru,", "ph": "ιλ ντεσιντά ντε ντεμανντέ κονσέιγ οπρέ ντου σαντρ αγκρικόλ ντε Ντοντορού,", "gr": "Αποφάσισε να ζητήσει συμβουλή από το Γεωργικό Κέντρο του Ντοντορού,", "a": "78686a15ac615c23"}, {"fr": "une grande ville située non loin de son village.", "ph": "ουν γκραντ βιλ σιτουέ νον λουέν ντε σον βιλάζ", "gr": "μια μεγάλη πόλη όχι μακριά από το χωριό του.", "a": "622953c5b485523f"}]}, {"img": "bananes/07", "lines": [{"fr": "Il se mit donc en route pour Doddooru avec sa magnifique récolte de bananes.", "ph": "ιλ σε μι ντονκ αν ρουτ πουρ Ντοντορού αβέκ σα μανιφίκ ρεκόλτ ντε μπανάν", "gr": "Ξεκίνησε λοιπόν για το Ντοντορού με την υπέροχη σοδειά του από μπανάνες.", "a": "218bc2cf7de5fcbd"}, {"fr": "Là-bas, quelqu'un lui fournirait sûrement une bonne idée.", "ph": "λα μπα, κελκέν λουί φουρνιρέ σουρμάν ουν μπον ιντέ", "gr": "Εκεί, σίγουρα κάποιος θα του έδινε μια καλή ιδέα.", "a": "b6797ed37a4ec732"}]}, {"img": "bananes/08", "lines": [{"fr": "Quelques jours plus tard, Sringeri Srinivas revint chez lui la mine réjouie.", "ph": "κελκε ζουρ πλου ταρ, Σρενζερί Σρινιβάς ρεβέν σε λουί λα μιν ρεζουί", "gr": "Λίγες μέρες αργότερα, ο Σρινγκέρι Σρινιβάς γύρισε σπίτι του με χαρούμενο πρόσωπο.", "a": "5428f2dd53d6d503"}, {"fr": "Et il se remit à cultiver des bananes dans sa ferme.", "ph": "ε ιλ σε ρεμί τα κουλτιβέ ντε μπανάν νταν σα φερμ", "gr": "Και ξανάρχισε να καλλιεργεί μπανάνες στη φάρμα του.", "a": "3e53e30c067073be"}]}, {"img": "bananes/09", "lines": [{"fr": "Mais il ne proposa plus aucune banane à personne.", "ph": "με ιλ νε προποζά πλου ζοκούν μπανάν α περσόν", "gr": "Όμως δεν πρόσφερε πια καμία μπανάνα σε κανέναν.", "a": "1ae9391992e891b4"}]}, {"img": "bananes/10", "lines": [{"fr": "Ni à sa famille.", "ph": "νι α σα φαμίγ", "gr": "Ούτε στην οικογένειά του.", "a": "50c7ee6e4f7cacf3"}, {"fr": "Ni à son voisin.", "ph": "νι α σον βουαζέν", "gr": "Ούτε στον γείτονά του.", "a": "2bc3066266347963"}, {"fr": "Ni à ses amis.", "ph": "νι α σε ζαμί", "gr": "Ούτε στους φίλους του.", "a": "2806874e8ffd428c"}]}, {"img": "bananes/11", "lines": [{"fr": "Ni aux marchands qui pouvaient vendre ses bananes sur des marchés loin de chez lui.", "ph": "νι ο μαρσάν κι πουβέ βανντρ σε μπανάν σουρ ντε μαρσέ λουέν ντε σε λουί", "gr": "Ούτε στους εμπόρους που θα μπορούσαν να πουλήσουν τις μπανάνες του σε αγορές μακριά από το σπίτι του.", "a": "5ecd00518c0110a9"}]}, {"img": "bananes/12", "lines": [{"fr": "Cela attisa la curiosité de tout le monde.", "ph": "σελά ατιζά λα κουριοζιτέ ντε του λε μοντ", "gr": "Αυτό κέντρισε την περιέργεια όλων.", "a": "391ffb3e5ee1cb98"}, {"fr": "Qu'allaient donc bien pouvoir devenir toutes ces bananes ?", "ph": "καλέ ντονκ μπιεν πουβουάρ ντεβενίρ τουτ σε μπανάν ?", "gr": "Τι θα γινόντουσαν άραγε όλες αυτές οι μπανάνες;", "a": "ea26611c79bbda3e"}]}, {"img": "bananes/13", "lines": [{"fr": "Un beau jour, son voisin Shivanna organisa un grand rituel d'offrandes puja.", "ph": "εν μπο ζουρ, σον βουαζέν Σιβάνα οργκανιζά εν γκραν ριτουέλ ντοφράνντ πουζά", "gr": "Μια ωραία μέρα, ο γείτονάς του ο Σιβάνα οργάνωσε μια μεγάλη πούτζα, μια γιορτή με προσφορές στους θεούς.", "a": "dc5ea180b9eeb52f"}]}, {"img": "bananes/14", "lines": [{"fr": "Le prêtre lui ordonna d'apporter cent huit bananes bien mûres pour en faire offrande aux divinités.", "ph": "λε πρετρ λουί ορντονά νταπορτέ σαν ουίτ μπανάν μπιεν μουρ πουρ αν φερ οφράνντ ο ντιβινιτέ", "gr": "Ο ιερέας τού ζήτησε να φέρει εκατόν οκτώ καλά ώριμες μπανάνες, για να τις προσφέρουν στους θεούς.", "a": "9277940fb5456657"}]}, {"img": "bananes/15", "lines": [{"fr": "Shivanna se précipita chez Sringeri Srinivas :", "ph": "Σιβάνα σε πρεσιπιτά σε Σρενζερί Σρινιβάς :", "gr": "Ο Σιβάνα έτρεξε στο σπίτι του Σρινγκέρι Σρινιβά:", "a": "32c470b3e5f31f3b"}, {"fr": "— Je suis désolé d'avoir refusé tes bananes la dernière fois, lui dit-il,", "ph": "— ζε σουί ντεζολέ νταβουάρ ρεφουζέ τε μπανάν λα ντερνιέρ φουά, λουί ντιτίλ,", "gr": "— Συγγνώμη που αρνήθηκα τις μπανάνες σου την περασμένη φορά, του είπε,", "a": "bc870746e380f068"}, {"fr": "mais il m'en faudrait cent huit bien mûres.", "ph": "με ιλ μαν φοντρέ σαν ουίτ μπιεν μουρ", "gr": "αλλά τώρα θα χρειαζόμουν εκατόν οκτώ, καλά ώριμες.", "a": "1e0eb9585893b592"}, {"fr": "Peux-tu me les fournir, s'il te plaît ?", "ph": "πε του με λε φουρνίρ, σιλ τε πλε ?", "gr": "Μπορείς να μου τις δώσεις, σε παρακαλώ;", "a": "8f08e7d7767a9c0d"}]}, {"img": "bananes/16", "lines": [{"fr": "— Hum, ma récolte est terminée, répondit Sringeri Srinivas en se grattant le menton,", "ph": "— εμ, μα ρεκόλτ ε τερμινέ, ρεπονντί Σρενζερί Σρινιβάς αν σε γκρατάν λε μαντόν,", "gr": "— Χμ, η σοδειά μου τελείωσε, απάντησε ο Σρινγκέρι Σρινιβάς ξύνοντας το πιγούνι του,", "a": "f2fbcd02bff3d4b4"}, {"fr": "mais je peux peut-être faire quelque chose pour toi.", "ph": "με ζε πε πετέτρ φερ κελκ σοζ πουρ τουά", "gr": "αλλά ίσως μπορώ να κάνω κάτι για σένα.", "a": "d0ccf756b072d10d"}, {"fr": "Commence le rituel.", "ph": "κομάνς λε ριτουέλ", "gr": "Ξεκίνα την τελετή.", "a": "fc0f45b3eedfadf4"}, {"fr": "J'arrive.", "ph": "ζαρίβ", "gr": "Έρχομαι.", "a": "d6da30d1f33556c8"}]}, {"img": "bananes/17", "lines": [{"fr": "Le rituel puja démarra.", "ph": "λε ριτουέλ πουζά ντεμαρά", "gr": "Η πούτζα ξεκίνησε.", "a": "081a5c79196f9b87"}, {"fr": "Tout le village fit le déplacement.", "ph": "του λε βιλάζ φι λε ντεπλασμάν", "gr": "Όλο το χωριό ήρθε.", "a": "7ab629fd33a2f847"}, {"fr": "Le prêtre commença ses incantations.", "ph": "λε πρετρ κομανσά σε ζενκαντασιόν", "gr": "Ο ιερέας άρχισε τις προσευχές του.", "a": "b48481ebe0ab6805"}]}, {"img": "bananes/18", "lines": [{"fr": "Puis vint le moment de faire l'offrande des bananes aux divinités.", "ph": "πουί βεν λε μομάν ντε φερ λοφράνντ ντε μπανάν ο ντιβινιτέ", "gr": "Ύστερα ήρθε η ώρα να προσφέρουν τις μπανάνες στους θεούς.", "a": "121884ac57226051"}]}, {"img": "bananes/19", "lines": [{"fr": "C'est alors que surgit Sringeri Srinivas, muni d'un gros sac.", "ph": "σε ταλόρ κε σουρζί Σρενζερί Σρινιβάς, μουνί ντεν γκρο σακ", "gr": "Τότε ακριβώς εμφανίστηκε ο Σρινγκέρι Σρινιβάς, κρατώντας έναν μεγάλο σάκο.", "a": "eabbbb288588e3ea"}]}, {"img": "bananes/20", "lines": [{"fr": "Il en sortit soigneusement vingt-sept paquets qu'il déposa près du feu sacré.", "ph": "ιλ αν σορτί σουανιεζμάν βεντ σετ πακέ κιλ ντεποζά πρε ντου φε σακρέ", "gr": "Έβγαλε προσεκτικά είκοσι επτά πακέτα και τα ακούμπησε κοντά στην ιερή φωτιά.", "a": "e801decf48687fd6"}, {"fr": "Chaque paquet était enveloppé dans des feuilles de bananier.", "ph": "σακ πακέ ετέ ανβελοπέ νταν ντε φέιγ ντε μπανανιέ", "gr": "Κάθε πακέτο ήταν τυλιγμένο σε φύλλα μπανανιάς.", "a": "3169107e8553c711"}]}, {"img": "bananes/21", "lines": [{"fr": "Sur chaque feuille était inscrit :", "ph": "σουρ σακ φέιγ ετε τενσκρί :", "gr": "Σε κάθε φύλλο ήταν γραμμένο:", "a": "4f4d66d6a43293b9"}, {"fr": "« Halwa à la banane de qualité supérieure, produit par S.S. »", "ph": "αλβά α λα μπανάν ντε καλιτέ σουπεριέρ, προντουί παρ ες ες", "gr": "«Χαλβάς μπανάνας, ανώτερης ποιότητας, φτιαγμένος από τον Σ.Σ.»", "a": "990b678abaf1c5c5"}, {"fr": "Sringeri Srinivas en offrit un au prêtre.", "ph": "Σρενζερί Σρινιβάς αν νοφρί εν ο πρετρ", "gr": "Ο Σρινγκέρι Σρινιβάς πρόσφερε ένα στον ιερέα.", "a": "d26f8a50a5d561b0"}]}, {"img": "bananes/22", "lines": [{"fr": "— Chaque halwa contient quatre bananes.", "ph": "— σακ αλβά κοντιέν κατρ μπανάν", "gr": "— Κάθε χαλβάς έχει μέσα τέσσερις μπανάνες.", "a": "b1b379fbd7bd6945"}, {"fr": "Il y a vingt-sept paquets.", "ph": "ιλ ι α βεντ σετ πακέ", "gr": "Τα πακέτα είναι είκοσι επτά.", "a": "1d72811a92a65a49"}, {"fr": "Vous avez donc vos cent huit bananes !", "ph": "βου ζαβέ ντονκ βο σαν ουίτ μπανάν !", "gr": "Άρα έχετε τις εκατόν οκτώ μπανάνες σας!", "a": "a99a1b70cc45e2db"}]}, {"img": "bananes/23", "lines": [{"fr": "Le prêtre fut si étonné qu'il en oublia de se livrer à ses incantations.", "ph": "λε πρετρ φου σι ετονέ κιλ αν ουμπλιά ντε σε λιβρέ α σε ζενκαντασιόν", "gr": "Ο ιερέας έμεινε τόσο έκπληκτος που ξέχασε να πει τις προσευχές του.", "a": "744375a5e99a3ac4"}, {"fr": "Un rire d'enfant rompit alors le silence.", "ph": "εν ριρ νταφάν ρονπί αλόρ λε σιλάνς", "gr": "Τότε ένα παιδικό γέλιο έσπασε τη σιωπή.", "a": "49b580768897fe59"}]}, {"img": "bananes/24", "lines": [{"fr": "Tout le village éclata bientôt de rire à son tour et se mit à applaudir.", "ph": "του λε βιλάζ εκλατά μπιεντό ντε ριρ α σον τουρ ε σε μι τα απλοντίρ", "gr": "Σε λίγο όλο το χωριό ξέσπασε κι αυτό στα γέλια και άρχισε να χειροκροτεί.", "a": "ca8e062dcb02244a"}]}, {"img": "bananes/25", "lines": [{"fr": "Nous savons maintenant ce que Sringeri Srinivas fait des bananes qu'il cultive !", "ph": "νου σαβόν μεντενάν σε κε Σρενζερί Σρινιβάς φε ντε μπανάν κιλ κουλτίβ !", "gr": "Τώρα ξέρουμε τι κάνει ο Σρινγκέρι Σρινιβάς με τις μπανάνες που καλλιεργεί!", "a": "f6f50bc0b691011c"}]}]}, {"id": "bonjour", "title_fr": "Bonjour !", "title_gr": "Καλημέρα!", "level": 1, "summary_gr": "Η Λολά λέει καλημέρα σε όλους τους φίλους της: τον Ήλιο, το χορτάρι, τον ουρανό, τη Σελήνη, τα αστέρια, τη βροχή και το μεγάλο δέντρο.", "source": {"publisher": "StoryWeaver Community / Pratham Books", "url": "https://storyweaver.org.in/en/stories/57255-bonjour", "licence": "CC BY 4.0", "authors": ["goofy"], "illustrators": ["Imile Wepener"]}, "cover": "bonjour/cover", "pages": [{"img": "bonjour/01", "lines": [{"fr": "Bonjour, je m’appelle Lola et j’ai beaucoup d’amis.", "ph": "μπονζούρ, ζε μαπέλ Λολά ε ζε μποκού νταμί", "gr": "Καλημέρα, με λένε Λολά και έχω πολλούς φίλους.", "a": "42b5ac48fd16cf5f"}, {"fr": "Viens avec moi, nous allons leur dire bonjour…", "ph": "βιεν αβέκ μουά, νουζαλόν λερ ντιρ μπονζούρ…", "gr": "Έλα μαζί μου, πάμε να τους πούμε καλημέρα…", "a": "29e8e8b76d616054"}]}, {"img": "bonjour/02", "lines": [{"fr": "Bonjour le Soleil, grosse boule éclatante.", "ph": "μπονζούρ λε σολέιγ, γκρος μπουλ εκλατάντ", "gr": "Καλημέρα Ήλιε, μεγάλη λαμπερή μπάλα.", "a": "77b4097cd01fdd08"}, {"fr": "Tu éclaires toute ma journée de ta lumière.", "ph": "του εκλέρ τουτ μα ζουρνέ ντε τα λουμιέρ", "gr": "Φωτίζεις όλη μου τη μέρα με το φως σου.", "a": "ea246c03f04b0f75"}]}, {"img": "bonjour/03", "lines": [{"fr": "Bonjour à toi l’Herbe, verte et douce à nos pieds nus.", "ph": "μπονζούρ α τουά λερμπ, βερτ ε ντους α νο πιε νου", "gr": "Καλημέρα σε σένα Χορταράκι, πράσινο και απαλό κάτω από τα γυμνά μας πόδια.", "a": "d7b7aa0dd953ffeb"}, {"fr": "Tu es le meilleur terrain de jeu pour les enfants.", "ph": "του ε λε μεγιέρ τερέν ντε ζε πουρ λεζανφάν", "gr": "Είσαι η καλύτερη παιδική χαρά για τα παιδιά.", "a": "959740fb5be10eb4"}]}, {"img": "bonjour/04", "lines": [{"fr": "Bonjour le Ciel, immense et plein de nuages.", "ph": "μπονζούρ λε σιέλ, ιμάνς ε πλεν ντε νουάζ", "gr": "Καλημέρα Ουρανέ, απέραντε και γεμάτε σύννεφα.", "a": "ccb41dd5443afcf9"}, {"fr": "On aime se noyer dans ton bleu.", "ph": "ονέμ σε νουαγιέ νταν τον μπλε", "gr": "Μας αρέσει να χανόμαστε μέσα στο γαλάζιο σου.", "a": "1195f7b0ff43f016"}]}, {"img": "bonjour/05", "lines": [{"fr": "Bonjour madame la Lune, là-haut dans l’espace.", "ph": "μπονζούρ μαντάμ λα λουν, λα ο νταν λεσπάς", "gr": "Καλησπέρα κυρία Σελήνη, εκεί ψηλά στο διάστημα.", "a": "cdd281cab5df899b"}, {"fr": "Avec toi la nuit est moins sombre.", "ph": "αβέκ τουά λα νουί ε μουέν σονμπρ", "gr": "Μαζί σου η νύχτα δεν είναι τόσο σκοτεινή.", "a": "ce3be3760e7fec54"}]}, {"img": "bonjour/06", "lines": [{"fr": "Bonjour aussi aux étoiles, qui nous font rêver chaque nuit.", "ph": "μπονζούρ οσί οζετουάλ, κι νου φον ρεβέ σακ νουί", "gr": "Καλησπέρα και στα αστέρια, που μας κάνουν να ονειρευόμαστε κάθε νύχτα.", "a": "1604956f40cb0160"}]}, {"img": "bonjour/07", "lines": [{"fr": "Bonjour le Vent, qui file en liberté et nous souffle un air frais.", "ph": "μπονζούρ λε βαν, κι φιλ αν λιμπερτέ ε νου σουφλ ενέρ φρε", "gr": "Καλημέρα Άνεμε, που τρέχεις ελεύθερος και μας φυσάς δροσερό αεράκι.", "a": "9f8ccb43aff6c0d1"}]}, {"img": "bonjour/08", "lines": [{"fr": "Bonjour la Pluie, qui descend doucement.", "ph": "μπονζούρ λα πλουί, κι ντεσάν ντουσμάν", "gr": "Καλημέρα Βροχή, που κατεβαίνεις σιγά σιγά.", "a": "73bdf713fbfb15c9"}, {"fr": "Tu nous apportes l’eau, qui fait vivre la terre.", "ph": "του νουζαπόρτ λο, κι φε βιβρ λα τερ", "gr": "Μας φέρνεις το νερό, που δίνει ζωή στη γη.", "a": "acd49b7e02d6a6eb"}]}, {"img": "bonjour/09", "lines": [{"fr": "Bonjour à l’Éclair qui descend tout à coup.", "ph": "μπονζούρ α λεκλέρ κι ντεσάν του τα κου", "gr": "Καλημέρα Αστραπή, που κατεβαίνεις ξαφνικά.", "a": "4112d672a01264cf"}, {"fr": "Ton vif éclat me fait un peu peur.", "ph": "τον βιφ εκλά με φε εν πε πέρ", "gr": "Η δυνατή σου λάμψη με φοβίζει λιγάκι.", "a": "b265470fbb80e588"}]}, {"img": "bonjour/10", "lines": [{"fr": "Bonjour aussi aux gouttelettes de rosée.", "ph": "μπονζούρ οσί ο γκουτλέτ ντε ροζέ", "gr": "Καλημέρα και στις σταγονίτσες της δροσιάς.", "a": "ba12976e7e4828ad"}, {"fr": "Vous êtes comme de petites perles sur les brins d’herbe.", "ph": "βουζέτ κομ ντε πετίτ περλ σουρ λε μπρεν ντερμπ", "gr": "Είστε σαν μικρά μαργαριτάρια πάνω στα χορταράκια.", "a": "62584a2b22172ee3"}]}, {"img": "bonjour/11", "lines": [{"fr": "Bonjour au gros Arbre, solide et rassurant.", "ph": "μπονζούρ ο γκροζάρμπρ, σολίντ ε ρασουράν", "gr": "Καλημέρα μεγάλο Δέντρο, γερό και προστατευτικό.", "a": "95e406cc2dc01920"}, {"fr": "Tu me donnes ton ombre et de bons fruits.", "ph": "του με ντον τονόνμπρ ε ντε μπον φρουί", "gr": "Μου δίνεις τη σκιά σου και νόστιμα φρούτα.", "a": "977e65bfad667b8a"}]}, {"img": "bonjour/12", "lines": [{"fr": "Bonjour monsieur l’Oiseau qui trace dans le ciel", "ph": "μπονζούρ μεσιέ λουαζό κι τρας νταν λε σιέλ", "gr": "Καλημέρα κύριε Πουλί, που χαράζεις τον δρόμο σου στον ουρανό", "a": "727e565fd40bf9ee"}, {"fr": "et enchante nos journées de jolies mélodies.", "ph": "ε ανσάντ νο ζουρνέ ντε ζολί μελοντί", "gr": "και ομορφαίνεις τις μέρες μας με γλυκές μελωδίες.", "a": "72cb1da224497f14"}]}]}, {"id": "bus", "title_fr": "Le grand bus bleu", "title_gr": "Το μεγάλο μπλε λεωφορείο", "level": 2, "summary_gr": "Ο Εμπέι και η μαμά του περιμένουν στη στάση το μεγάλο μπλε λεωφορείο, για να πάνε στην πόλη ν' αγοράσουν τη σχολική του στολή — μα το λεωφορείο δεν έρχεται.", "source": {"publisher": "African Storybook Initiative", "url": "https://storyweaver.org.in/en/stories/67621-le-grand-bus-bleu", "licence": "CC BY 4.0", "authors": ["Mecelin Kakoro"], "illustrators": ["Mango Tree"], "translators": ["Translators without Borders", "Véronique Thomas"]}, "cover": "bus/cover", "pages": [{"img": "bus/01", "lines": [{"fr": "Il n'y avait qu'un bus dans le village d'Ebei.", "ph": "ιλ νι αβέ κεν μπους νταν λε βιλάζ ντ'Εμπέι", "gr": "Στο χωριό του Εμπέι υπήρχε μόνο ένα λεωφορείο.", "a": "aeb22f654fd02ac1"}, {"fr": "Il était grand et bleu.", "ph": "ιλ ετέ γκραν ε μπλε", "gr": "Ήταν μεγάλο και μπλε.", "a": "3efdf94441ea7ce7"}, {"fr": "Il faisait beaucoup de bruit.", "ph": "ιλ φεζέ μποκού ντε μπρουί", "gr": "Έκανε πολύ θόρυβο.", "a": "cd55a3113527da62"}]}, {"img": "bus/02", "lines": [{"fr": "Un jour, la maman d'Ebei lui dit:", "ph": "εν ζουρ, λα μαμάν ντ'Εμπέι λουί ντι:", "gr": "Μια μέρα, η μαμά του Εμπέι του είπε:", "a": "ba0943052c9292cd"}, {"fr": "“Demain nous irons en ville acheter ton uniforme pour l'école.”", "ph": "ντεμέν νουζιρόν αν βιλ ασετέ τον ουνιφόρμ πουρ λεκόλ", "gr": "«Αύριο θα πάμε στην πόλη ν' αγοράσουμε τη στολή σου για το σχολείο.»", "a": "96155e20e8312c5e"}]}, {"img": "bus/03", "lines": [{"fr": "Ebei était très excité.", "ph": "Εμπέι ετέ τρε εξιτέ", "gr": "Ο Εμπέι ήταν πολύ ενθουσιασμένος.", "a": "9343b483eb4e54f3"}, {"fr": "Ils allaient prendre le grand bus bleu.", "ph": "ιλζαλέ πρανντρ λε γκραν μπους μπλε", "gr": "Θα έπαιρναν το μεγάλο μπλε λεωφορείο.", "a": "95b28e561d7265b0"}, {"fr": "Il ne dormit pas cette nuit-là.", "ph": "ιλ νε ντορμί πα σετ νουί-λα", "gr": "Δεν κοιμήθηκε εκείνη τη νύχτα.", "a": "0a02baefea7d9c29"}]}, {"img": "bus/04", "lines": [{"fr": "Ebei était déjà habillé quand sa maman vint le réveiller.", "ph": "Εμπέι ετέ ντεζά αμπιγέ καν σα μαμάν βεν λε ρεβεγέ", "gr": "Ο Εμπέι ήταν ήδη ντυμένος όταν η μαμά του ήρθε να τον ξυπνήσει.", "a": "dfea4468346b38dc"}]}, {"img": "bus/05", "lines": [{"fr": "Ebei et sa maman marchèrent jusqu'à l'arrêt de bus.", "ph": "Εμπέι ε σα μαμάν μαρσέρ ζουσκά λαρέ ντε μπους", "gr": "Ο Εμπέι και η μαμά του περπάτησαν μέχρι τη στάση του λεωφορείου.", "a": "d277dde00ec18f95"}, {"fr": "Ils attendirent le grand bus bleu.", "ph": "ιλζαταντίρ λε γκραν μπους μπλε", "gr": "Περίμεναν το μεγάλο μπλε λεωφορείο.", "a": "17fba747611862a1"}, {"fr": "Mais le bus ne venait pas.", "ph": "με λε μπους νε βενέ πα", "gr": "Όμως το λεωφορείο δεν ερχόταν.", "a": "ce970a3491549201"}]}, {"img": "bus/06", "lines": [{"fr": "D'autres gens arrivèrent à l'arrêt de bus.", "ph": "ντοτρ ζαν αριβέρ α λαρέ ντε μπους", "gr": "Κι άλλοι άνθρωποι έφτασαν στη στάση.", "a": "f31ee24acc21ec64"}, {"fr": "Ils se plaignaient parce que le bus était en retard.", "ph": "ιλ σε πλενιέ παρς κε λε μπους ετέ αν ρετάρ", "gr": "Παραπονιόντουσαν, γιατί το λεωφορείο είχε αργήσει.", "a": "2bf7455e7e6028a0"}, {"fr": "“Le bus nous a-t-il oubliés?” demandèrent-ils.", "ph": "λε μπους νουζά τιλ ουμπλιέ? ντεμανντέρ τιλ", "gr": "«Μας ξέχασε το λεωφορείο;» ρώτησαν.", "a": "57d05356d7e1c355"}]}, {"img": "bus/07", "lines": [{"fr": "Ebei était inquiet.", "ph": "Εμπέι ετέ ενκιέ", "gr": "Ο Εμπέι ανησυχούσε.", "a": "9524d59ce57a0333"}, {"fr": "“Nous ne pourrons pas aller en ville.", "ph": "νου νε πουρόν πα αλέ αν βιλ", "gr": "«Δεν θα μπορέσουμε να πάμε στην πόλη.", "a": "d02cdf78aa96d420"}, {"fr": "Je ne pourrai pas avoir mon uniforme,” pensa-t-il.", "ph": "ζε νε πουρέ πα αβουάρ μον ουνιφόρμ, πανσά τιλ", "gr": "Δεν θα μπορέσω να πάρω τη στολή μου», σκέφτηκε.", "a": "bd8c25b9d8a93fce"}]}, {"img": "bus/08", "lines": [{"fr": "Des gens renoncèrent à attendre et rentrèrent chez eux.", "ph": "ντε ζαν ρενονσέρ α αταντρ ε ραντρέρ σεζέ", "gr": "Μερικοί σταμάτησαν να περιμένουν και γύρισαν στα σπίτια τους.", "a": "5e646e2a8f90eb12"}, {"fr": "Mais Ebei se mit à pleurer ; il ne voulait pas rentrer.", "ph": "με Εμπέι σε μι α πλερέ ; ιλ νε βουλέ πα ραντρέ", "gr": "Όμως ο Εμπέι άρχισε να κλαίει· δεν ήθελε να γυρίσει.", "a": "ad48ef2efec2304b"}, {"fr": "Sa maman le consola.", "ph": "σα μαμάν λε κονσολά", "gr": "Η μαμά του τον παρηγόρησε.", "a": "f76688229381686d"}, {"fr": "“Nous allons attendre encore un peu,” lui dit-elle.", "ph": "νουζαλόν αταντρ ανκόρ εν πε, λουί ντι τελ", "gr": "«Θα περιμένουμε λίγο ακόμα», του είπε.", "a": "44bc9f0459c89d48"}]}, {"img": "bus/09", "lines": [{"fr": "Tout à coup, ils entendirent un bruit.", "ph": "τουτακού, ιλζανταντίρ εν μπρουί", "gr": "Ξαφνικά άκουσαν έναν θόρυβο.", "a": "efc24aac6fb16fa0"}, {"fr": "Ils virent un nuage de poussière.", "ph": "ιλ βιρ εν νουάζ ντε πουσιέρ", "gr": "Είδαν ένα σύννεφο σκόνης.", "a": "28df5037d5846db1"}, {"fr": "Le bus arrivait!", "ph": "λε μπους αριβέ!", "gr": "Το λεωφορείο ερχόταν!", "a": "9f630b68d24613a9"}]}, {"img": "bus/10", "lines": [{"fr": "Mais le bus n'était pas bleu.", "ph": "με λε μπους νετέ πα μπλε", "gr": "Όμως το λεωφορείο δεν ήταν μπλε.", "a": "e2d2309847bd7da0"}, {"fr": "Il n'était pas grand non plus.", "ph": "ιλ νετέ πα γκραν νον πλου", "gr": "Ούτε μεγάλο ήταν.", "a": "f0fca297495f2281"}, {"fr": "Le bus était rouge et petit.", "ph": "λε μπους ετέ ρουζ ε πετί", "gr": "Το λεωφορείο ήταν κόκκινο και μικρό.", "a": "280a2d9a33bcbd86"}, {"fr": "Les gens qui attendaient regardèrent le bus.", "ph": "λε ζαν κι αταντέ ρεγκαρντέρ λε μπους", "gr": "Οι άνθρωποι που περίμεναν κοίταξαν το λεωφορείο.", "a": "26eec310730f5361"}, {"fr": "Ils hésitaient à monter.", "ph": "ιλζεζιτέ α μοντέ", "gr": "Δίσταζαν να ανέβουν.", "a": "6dfa02cf0cdfc320"}]}, {"img": "bus/11", "lines": [{"fr": "“Montez, Montez!” cria le chauffeur.", "ph": "μοντέ, μοντέ! κριά λε σοφέρ", "gr": "«Ανεβείτε, ανεβείτε!» φώναξε ο οδηγός.", "a": "c5c71e2afdda6e37"}, {"fr": "“Nous avons beaucoup de retard aujourd'hui,” dit-il.", "ph": "νουζαβόν μποκού ντε ρετάρ οζουρντουί, ντι τιλ", "gr": "«Έχουμε πολλή καθυστέρηση σήμερα», είπε.", "a": "dd5c8c3f7665b8d3"}]}, {"img": "bus/12", "lines": [{"fr": "Ebei et sa maman montèrent les premiers.", "ph": "Εμπέι ε σα μαμάν μοντέρ λε πρεμιέ", "gr": "Ο Εμπέι και η μαμά του ανέβηκαν πρώτοι.", "a": "f388ca75da5ac208"}, {"fr": "Bientôt tous les autres montèrent dans le petit bus rouge.", "ph": "μπιεντό του λε ζοτρ μοντέρ νταν λε πετί μπους ρουζ", "gr": "Σε λίγο ανέβηκαν κι όλοι οι άλλοι στο μικρό κόκκινο λεωφορείο.", "a": "72a07c32a849191f"}]}, {"img": "bus/13", "lines": [{"fr": "Ebei regarda par la fenêtre.", "ph": "Εμπέι ρεγκαρντά παρ λα φενέτρ", "gr": "Ο Εμπέι κοίταξε από το παράθυρο.", "a": "eaab2ff856d3dc65"}, {"fr": "Il vit d'autres gens encore à l'arrêt d'autobus.", "ph": "ιλ βι ντοτρ ζαν ανκόρ α λαρέ ντοτομπούς", "gr": "Είδε κι άλλους ανθρώπους να στέκονται ακόμα στη στάση.", "a": "55ca57eccf08ba89"}]}, {"img": "bus/14", "lines": [{"fr": "D'autres couraient pour prendre le bus.", "ph": "ντοτρ κουρέ πουρ πρανντρ λε μπους", "gr": "Άλλοι έτρεχαν για να προλάβουν το λεωφορείο.", "a": "b34f210d6be5343b"}, {"fr": "Mais il était trop tard.", "ph": "με ιλ ετέ τρο ταρ", "gr": "Όμως ήταν πολύ αργά.", "a": "3605a8e3f30b6f5c"}, {"fr": "Le bus était plein.", "ph": "λε μπους ετέ πλεν", "gr": "Το λεωφορείο ήταν γεμάτο.", "a": "046516617b723348"}, {"fr": "Le bus rouge se mit en route vers la ville.", "ph": "λε μπους ρουζ σε μι αν ρουτ βερ λα βιλ", "gr": "Το κόκκινο λεωφορείο ξεκίνησε για την πόλη.", "a": "7d7ce9789fbaabc9"}]}, {"img": "bus/15", "lines": [{"fr": "“Où est le grand bus bleu?” demanda la maman d'Ebei.", "ph": "ου ε λε γκραν μπους μπλε? ντεμανντά λα μαμάν ντ'Εμπέι", "gr": "«Πού είναι το μεγάλο μπλε λεωφορείο;» ρώτησε η μαμά του Εμπέι.", "a": "a4281b9a89dc7734"}, {"fr": "“Il est tombé en panne,” répondit le chauffeur.", "ph": "ιλ ε τονμπέ αν παν, ρεπονντί λε σοφέρ", "gr": "«Χάλασε», απάντησε ο οδηγός.", "a": "c0524f6f2382688f"}, {"fr": "“Nous sommes en train de le réparer.", "ph": "νου σομ αν τρεν ντε λε ρεπαρέ", "gr": "«Τώρα το φτιάχνουμε.", "a": "34129d6056f588f1"}, {"fr": "Il viendra demain,” ajouta-t-il.", "ph": "ιλ βιεντρά ντεμέν, αζουτά τιλ", "gr": "Θα έρθει αύριο», πρόσθεσε.", "a": "1daf4ae518577920"}]}, {"img": "bus/16", "lines": [{"fr": "Ebei se moquait bien de la couleur du bus.", "ph": "Εμπέι σε μοκέ μπιεν ντε λα κουλέρ ντου μπους", "gr": "Τον Εμπέι δεν τον ένοιαζε καθόλου το χρώμα του λεωφορείου.", "a": "4311937a54af51a6"}, {"fr": "Il se moquait bien de la taille du bus.", "ph": "ιλ σε μοκέ μπιεν ντε λα τάιγ ντου μπους", "gr": "Δεν τον ένοιαζε καθόλου το μέγεθος του λεωφορείου.", "a": "52c69bde3ed6e6cc"}, {"fr": "Il était heureux parce que le bus allait en ville.", "ph": "ιλ ετέ ερέ παρς κε λε μπους αλέ αν βιλ", "gr": "Ήταν χαρούμενος, γιατί το λεωφορείο πήγαινε στην πόλη.", "a": "3d2999a7ea7e3257"}]}]}, {"id": "cheveux", "title_fr": "Le jour de la coupe de cheveux annuelle", "title_gr": "Η μέρα του ετήσιου κουρέματος", "level": 2, "summary_gr": "Ο Σρινγκέρι Σρινιβάς έχει πολύ μακριά μαλλιά, μα τη μέρα του ετήσιου κουρέματος κανείς δεν έχει χρόνο να του τα κόψει.", "source": {"publisher": "StoryWeaver Community / Pratham Books", "url": "https://storyweaver.org.in/en/stories/4272-annual-haircut-day", "licence": "CC BY 4.0", "authors": ["Sak Untala"], "illustrators": ["Angie & Upesh"]}, "cover": "cheveux/cover", "pages": [{"img": "cheveux/01", "lines": [{"fr": "C'était le jour de la coupe de cheveux annuelle pour Sringeri Srinivas.", "ph": "σετέ λε ζουρ ντε λα κουπ ντε σεβέ ανουέλ πουρ Σρενζερί Σρινιβάς", "gr": "Ήταν η μέρα του ετήσιου κουρέματος για τον Σρινγκέρι Σρινιβάς.", "a": "a75243ea2e9d97ef"}]}, {"img": "cheveux/02", "lines": [{"fr": "Sringeri se rendit donc comme à son habitude chez le coiffeur.", "ph": "Σρενζερί σε ραντί ντονκ κομ α σοναμπιτούντ σε λε κουαφέρ", "gr": "Ο Σρινγκέρι πήγε λοιπόν, όπως πάντα, στον κουρέα.", "a": "5f796f5f639e55f8"}]}, {"img": "cheveux/03", "lines": [{"fr": "Mais le coiffeur lui dit : « Aujourd'hui, je n'ai pas le temps de couper des cheveux aussi longs ! »", "ph": "με λε κουαφέρ λουί ντι : οζουρντουί, ζε νε πα λε ταν ντε κουπέ ντε σεβέ οσί λον !", "gr": "Όμως ο κουρέας του είπε: «Σήμερα δεν έχω χρόνο να κόψω τόσο μακριά μαλλιά!»", "a": "659de291ed56935b"}]}, {"img": "cheveux/04", "lines": [{"fr": "Déçu, Sringeri Srinivas rentra chez lui et demanda à sa femme de lui couper les cheveux.", "ph": "ντεσού, Σρενζερί Σρινιβάς ραντρά σε λουί ε ντεμανντά α σα φαμ ντε λουί κουπέ λε σεβέ", "gr": "Απογοητευμένος, ο Σρινγκέρι Σρινιβάς γύρισε σπίτι του και ζήτησε από τη γυναίκα του να του κόψει τα μαλλιά.", "a": "6073db6f1abf8639"}]}, {"img": "cheveux/05", "lines": [{"fr": "Mais sa femme lui dit : « Aujourd'hui, je n'ai pas le temps de couper des cheveux aussi longs ! »", "ph": "με σα φαμ λουί ντι : οζουρντουί, ζε νε πα λε ταν ντε κουπέ ντε σεβέ οσί λον !", "gr": "Όμως η γυναίκα του τού είπε: «Σήμερα δεν έχω χρόνο να κόψω τόσο μακριά μαλλιά!»", "a": "5a1185efa2dcbcde"}]}, {"img": "cheveux/06", "lines": [{"fr": "Un peu en colère, Sringeri Srinivas se rendit chez son ami le tailleur.", "ph": "εν πε αν κολέρ, Σρενζερί Σρινιβάς σε ραντί σε σοναμί λε ταγιέρ", "gr": "Λίγο θυμωμένος, ο Σρινγκέρι Σρινιβάς πήγε στον φίλο του τον ράφτη.", "a": "e38d54b4890b2e3e"}]}, {"img": "cheveux/07", "lines": [{"fr": "Mais le tailleur lui dit : « Aujourd'hui, je n'ai pas le temps de couper des cheveux aussi longs ! »", "ph": "με λε ταγιέρ λουί ντι : οζουρντουί, ζε νε πα λε ταν ντε κουπέ ντε σεβέ οσί λον !", "gr": "Όμως ο ράφτης του είπε: «Σήμερα δεν έχω χρόνο να κόψω τόσο μακριά μαλλιά!»", "a": "b469ba3c21a73226"}]}, {"img": "cheveux/08", "lines": [{"fr": "Gagné par l'inquiétude, Sringeri Srinivas se rendit chez son autre ami, le menuisier.", "ph": "γκανιέ παρ λενκιετούντ, Σρενζερί Σρινιβάς σε ραντί σε σον οτραμί, λε μενουιζιέ", "gr": "Κυριευμένος από ανησυχία, ο Σρινγκέρι Σρινιβάς πήγε στον άλλο του φίλο, τον ξυλουργό.", "a": "27165986e995d35c"}]}, {"img": "cheveux/09", "lines": [{"fr": "Mais le menuisier lui dit : « Aujourd'hui, je n'ai pas le temps de couper des cheveux aussi longs ! »", "ph": "με λε μενουιζιέ λουί ντι : οζουρντουί, ζε νε πα λε ταν ντε κουπέ ντε σεβέ οσί λον !", "gr": "Όμως ο ξυλουργός του είπε: «Σήμερα δεν έχω χρόνο να κόψω τόσο μακριά μαλλιά!»", "a": "ab0bc29e9d5fbadb"}]}, {"img": "cheveux/10", "lines": [{"fr": "Pauvre Sringeri Srinivas !", "ph": "ποβρ Σρενζερί Σρινιβάς !", "gr": "Καημένε Σρινγκέρι Σρινιβάς!", "a": "54fea37a881a46a5"}, {"fr": "Personne ne semblait vouloir lui couper les cheveux le jour de sa coupe de cheveux annuelle.", "ph": "περσόν νε σανμπλέ βουλουάρ λουί κουπέ λε σεβέ λε ζουρ ντε σα κουπ ντε σεβέ ανουέλ", "gr": "Κανείς δεν φαινόταν να θέλει να του κόψει τα μαλλιά τη μέρα του ετήσιου κουρέματός του.", "a": "48261a8fa1eac06d"}]}, {"img": "cheveux/11", "lines": [{"fr": "En pleurs, il se rendit dans la forêt située derrière le village.", "ph": "αν πλερ, ιλ σε ραντί νταν λα φορέ σιτουέ ντεριέρ λε βιλάζ", "gr": "Κλαίγοντας, πήγε στο δάσος που ήταν πίσω από το χωριό.", "a": "748379c8ba20bf01"}]}, {"img": "cheveux/12", "lines": [{"fr": "Il s'assit près d'une grotte et fondit en larmes.", "ph": "ιλ σασί πρε ντουν γκροτ ε φονντί αν λαρμ", "gr": "Κάθισε δίπλα σε μια σπηλιά και έβαλε τα κλάματα.", "a": "ee8b7dcf3e6334b7"}]}, {"img": "cheveux/13", "lines": [{"fr": "« La journée touche à sa fin.", "ph": "λα ζουρνέ τους α σα φεν.", "gr": "«Η μέρα τελειώνει.", "a": "b188fb601d48c65b"}, {"fr": "Comment vais-je bien pouvoir me faire couper les cheveux comme promis ?", "ph": "κομάν βε ζε μπιεν πουβουάρ με φερ κουπέ λε σεβέ κομ προμί ?", "gr": "Πώς θα καταφέρω να κόψω τα μαλλιά μου όπως το υποσχέθηκα;", "a": "2963a59900b04a6b"}, {"fr": "Oh, mon dieu, aidez-moi ! »", "ph": "ο, μον ντιε, εντέ μουά !", "gr": "Αχ, Θεέ μου, βοήθησέ με!»", "a": "4adfc1ccf801a8b3"}]}, {"img": "cheveux/14", "lines": [{"fr": "Le tigre qui dormait paisiblement dans la grotte", "ph": "λε τιγκρ κι ντορμέ πεζιμπλεμάν νταν λα γκροτ", "gr": "Ο τίγρης που κοιμόταν ήσυχα μέσα στη σπηλιά", "a": "eed32fdb68e5ccbe"}, {"fr": "fut dérangé dans son sommeil par le bruit que faisait Sringeri Srinivas.", "ph": "φου ντερανζέ νταν σον σομέιγ παρ λε μπρουί κε φεζέ Σρενζερί Σρινιβάς", "gr": "ενοχλήθηκε στον ύπνο του από τον θόρυβο που έκανε ο Σρινγκέρι Σρινιβάς.", "a": "9b42ed612ef189a9"}]}, {"img": "cheveux/15", "lines": [{"fr": "Il bondit sur lui en rugissant et en le menaçant de ses énormes griffes.", "ph": "ιλ μπονντί σουρ λουί αν ρουζισάν ε αν λε μενασάν ντε σεζενόρμ γκριφ", "gr": "Πήδηξε πάνω του βρυχώμενος και τον απείλησε με τα τεράστια νύχια του.", "a": "a53b0a4f9b6f26e8"}]}, {"img": "cheveux/16", "lines": [{"fr": "Le pauvre Sringeri Srinivas eut tellement peuuur qu'il...", "ph": "λε ποβρ Σρενζερί Σρινιβάς ου τελμάν πέεερ κιλ...", "gr": "Ο καημένος ο Σρινγκέρι Σρινιβάς φοβήηηθηκε τόσο πολύ που...", "a": "d45357e8af1ea093"}]}, {"img": "cheveux/17", "lines": [{"fr": "en perdit tous ses cheveux !", "ph": "αν περντί του σε σεβέ !", "gr": "...του έπεσαν όλα τα μαλλιά!", "a": "86cd939271f2a019"}]}, {"img": "cheveux/18", "lines": [{"fr": "Il rentra au village en courant tout du long.", "ph": "ιλ ραντρά ο βιλάζ αν κουράν του ντου λον", "gr": "Γύρισε στο χωριό τρέχοντας όλον τον δρόμο.", "a": "1856bcc8fb9f1b6b"}, {"fr": "Le tigre retourna se coucher.", "ph": "λε τιγκρ ρετουρνά σε κουσέ", "gr": "Ο τίγρης ξαναπήγε για ύπνο.", "a": "74c2be9ef5dcd527"}]}, {"img": "cheveux/19", "lines": [{"fr": "Avec sa nouvelle coupe, Sringeri Srinivas n'était pas près d'aller chez le coiffeur !", "ph": "αβέκ σα νουβέλ κουπ, Σρενζερί Σρινιβάς νετέ πα πρε νταλέ σε λε κουαφέρ !", "gr": "Με το καινούριο του κούρεμα, ο Σρινγκέρι Σρινιβάς δεν είχε σκοπό να πάει στον κουρέα!", "a": "b1c0637dd4e700e2"}]}]}, {"id": "fourmi", "title_fr": "Comment la fourmi sauva la colombe", "title_gr": "Πώς το μυρμήγκι έσωσε το περιστέρι", "level": 2, "summary_gr": "Ένα διψασμένο μυρμηγκάκι κατεβαίνει στο ποτάμι να πιει νερό, το παρασύρει το ρεύμα, κι ένα περιστέρι το σώζει — ώσπου έρχεται η σειρά του μυρμηγκιού να πει ευχαριστώ.", "source": {"publisher": "African Storybook Initiative", "url": "https://storyweaver.org.in/en/stories/97920-comment-la-fourmi-sauva-la-colombe", "licence": "CC BY 4.0", "authors": ["Judith Baker", "Kholeka Mabeta"], "illustrators": ["Wiehan de Jager"], "translators": ["Isabelle Duston", "Veronique Biddau"]}, "cover": "fourmi/cover", "pages": [{"img": "fourmi/01", "lines": [{"fr": "C'était une chaude journée d'été dans la forêt sèche.", "ph": "σετέ τουν σοντ ζουρνέ ντετέ νταν λα φορέ σες", "gr": "Ήταν μια ζεστή καλοκαιρινή μέρα μέσα στο ξερό δάσος.", "a": "3ba0648f1102b518"}]}, {"img": "fourmi/02", "lines": [{"fr": "La petite fourmi n'avait pas eu d'eau depuis plusieurs jours.", "ph": "λα πετίτ φουρμί ναβέ πα ζου ντο ντεπουί πλουζιέρ ζουρ", "gr": "Το μικρό μυρμήγκι είχε μέρες να πιει νερό.", "a": "e3c58301508c0893"}]}, {"img": "fourmi/03", "lines": [{"fr": "“J'ai besoin d'une goutte d'eau, même si elle tombe d'une feuille.”", "ph": "ζε μπεζουέν ντουν γκουτ ντο, μεμ σι ελ τονμπ ντουν φέιγ", "gr": "«Χρειάζομαι μια σταγόνα νερό, ακόμα κι αν πέσει από ένα φύλλο.»", "a": "a7edb01497d35262"}]}, {"img": "fourmi/04", "lines": [{"fr": "Mais même la rosée avait séché.", "ph": "με μεμ λα ροζέ αβέ σεσέ", "gr": "Μα ακόμα και η δροσιά είχε στεγνώσει.", "a": "02ceeade414ab141"}]}, {"img": "fourmi/05", "lines": [{"fr": "“Si je ne bois pas, je vais mourir”, s'écria la petite fourmi.", "ph": "σι ζε νε μπουά πα, ζε βε μουρίρ, σεκριά λα πετίτ φουρμί", "gr": "«Αν δεν πιω, θα πεθάνω», φώναξε το μικρό μυρμήγκι.", "a": "040a19bb60a6824b"}, {"fr": "“Je dois aller à la rivière, dont j'ai entendu parler.”", "ph": "ζε ντουά αλέ α λα ριβιέρ, ντον ζε ανταντού παρλέ", "gr": "«Πρέπει να πάω στο ποτάμι, αυτό που έχω ακούσει να λένε.»", "a": "3166c18f482203af"}]}, {"img": "fourmi/06", "lines": [{"fr": "“La rivière va t'emporter,” l'avertit un sage écureuil.", "ph": "λα ριβιέρ βα τανπορτέ, λαβερτί εν σαζ εκουρέιγ", "gr": "«Το ποτάμι θα σε πάρει μαζί του», το προειδοποίησε ένας σοφός σκίουρος.", "a": "3e325e41926ba62a"}]}, {"img": "fourmi/07", "lines": [{"fr": "Mais la petite fourmi avait trop soif.", "ph": "με λα πετίτ φουρμί αβέ τρο σουάφ", "gr": "Μα το μικρό μυρμήγκι διψούσε πάρα πολύ.", "a": "ff2408dd078fd696"}, {"fr": "“Je vais mourir si je ne bois pas l'eau.”", "ph": "ζε βε μουρίρ σι ζε νε μπουά πα λο", "gr": "«Θα πεθάνω αν δεν πιω το νερό.»", "a": "440f262a3030e917"}]}, {"img": "fourmi/08", "lines": [{"fr": "La petite fourmi partit chercher la rivière.", "ph": "λα πετίτ φουρμί παρτί σερσέ λα ριβιέρ", "gr": "Το μικρό μυρμήγκι ξεκίνησε να ψάξει το ποτάμι.", "a": "b57935d00a46cdf1"}, {"fr": "Dans l'herbe sèche et au-dessus des branches sèches.", "ph": "νταν λερμπ σες ε ο ντεσού ντε μπρανς σες", "gr": "Μέσα από τα ξερά χορτάρια και πάνω από τα ξερά κλαδιά.", "a": "810c338b15a7d119"}]}, {"img": "fourmi/09", "lines": [{"fr": "Jusqu'à ce qu'elle entende l'eau de la rivière.", "ph": "ζουσκά σε κελ αντάντ λο ντε λα ριβιέρ", "gr": "Ώσπου άκουσε το νερό του ποταμιού.", "a": "5fbcdfa00979ab9c"}]}, {"img": "fourmi/10", "lines": [{"fr": "La petite fourmi prit une grande gorgée d'eau fraîche.", "ph": "λα πετίτ φουρμί πρι ουν γκραντ γκορζέ ντο φρες", "gr": "Το μικρό μυρμήγκι ήπιε μια μεγάλη γουλιά δροσερό νερό.", "a": "ada2eb709c7f1ae5"}]}, {"img": "fourmi/11", "lines": [{"fr": "Elle était si heureuse qu'elle ne vit pas la vague montante.", "ph": "ελ ετέ σι ερέζ κελ νε βι πα λα βαγκ μοντάντ", "gr": "Ήταν τόσο χαρούμενο, που δεν πρόσεξε το κύμα που ερχόταν.", "a": "0b1b450938e41c1c"}]}, {"img": "fourmi/12", "lines": [{"fr": "La fourmi tenta de saisir l'herbe sèche flottant devant elle.", "ph": "λα φουρμί ταντά ντε σεζίρ λερμπ σες φλοτάν ντεβάν ελ", "gr": "Το μυρμήγκι προσπάθησε να πιαστεί από ένα ξερό χορταράκι που έπλεε μπροστά του.", "a": "49a1e6155f48c06d"}, {"fr": "Mais elle fut emportée par l'eau.", "ph": "με ελ φου τανπορτέ παρ λο", "gr": "Μα το νερό το πήρε μακριά.", "a": "94de33efda810d1b"}]}, {"img": "fourmi/13", "lines": [{"fr": "“À l'aide.", "ph": "α λεντ", "gr": "«Βοήθεια!", "a": "46cd8d4c641545b4"}, {"fr": "Aidez-moi s'il vous plaît.”", "ph": "εντέ μουά σιλ βου πλε", "gr": "Βοηθήστε με, σας παρακαλώ!»", "a": "004f738e1e4e4e0e"}]}, {"img": "fourmi/14", "lines": [{"fr": "“Vite, montez”, déclara la colombe, en tenant une branche dans son bec.", "ph": "βιτ, μοντέ, ντεκλαρά λα κολονμπ, αν τενάν ουν μπρανς νταν σον μπεκ", "gr": "«Γρήγορα, ανέβα!» είπε το περιστέρι, κρατώντας ένα κλαδάκι στο ράμφος του.", "a": "d57a57babfb15369"}]}, {"img": "fourmi/15", "lines": [{"fr": "“Je ne peux pas partir avant de dire merci à la colombe.", "ph": "ζε νε πε πα παρτίρ αβάν ντε ντιρ μερσί α λα κολονμπ", "gr": "«Δεν μπορώ να φύγω πριν πω ευχαριστώ στο περιστέρι.", "a": "100083b3ccfb61f5"}, {"fr": "Je vais attendre jusqu'à ce qu'elle revienne boire.”", "ph": "ζε βε ζατάντρ ζουσκά σε κελ ρεβιέν μπουάρ", "gr": "Θα περιμένω μέχρι να ξανάρθει να πιει νερό.»", "a": "78a4702d04081750"}]}, {"img": "fourmi/16", "lines": [{"fr": "Un jour, alors qu'elle attendait, deux garçons arrivèrent à la rivière avec leurs lance-pierres.", "ph": "εν ζουρ, αλόρ κελ αταντέ, ντε γκαρσόν αριβέρ α λα ριβιέρ αβέκ λερ λανς πιέρ", "gr": "Μια μέρα, εκεί που περίμενε, δυο αγόρια ήρθαν στο ποτάμι με τις σφεντόνες τους.", "a": "9c5098d6997985b7"}]}, {"img": "fourmi/17", "lines": [{"fr": "“Il y a une grande colombe qui vient ici pour boire”, dit un garçon.", "ph": "ιλ ι α ουν γκραντ κολονμπ κι βιέν ισί πουρ μπουάρ, ντι εν γκαρσόν", "gr": "«Ένα μεγάλο περιστέρι έρχεται εδώ να πιει νερό», είπε ένα αγόρι.", "a": "ff7ba40a7ea8d3e6"}, {"fr": "“Nous l'aurons pour le dîner ce soir.”", "ph": "νου λορόν πουρ λε ντινέ σε σουάρ", "gr": "«Θα το έχουμε για βραδινό απόψε.»", "a": "b0f227319bdb9a74"}]}, {"img": "fourmi/18", "lines": [{"fr": "“Je ne peux pas laisser ces garçons tuer la colombe.", "ph": "ζε νε πε πα λεσέ σε γκαρσόν τουέ λα κολονμπ", "gr": "«Δεν μπορώ να αφήσω αυτά τα αγόρια να σκοτώσουν το περιστέρι.", "a": "eaeb020bc8f896ea"}, {"fr": "Mais je suis si petite, que puis-je faire?”", "ph": "με ζε σουί σι πετίτ, κε πουί ζε φερ?", "gr": "Μα είμαι τόσο μικρό, τι μπορώ να κάνω;»", "a": "668ead725f0a7f07"}]}, {"img": "fourmi/19", "lines": [{"fr": "À ce moment-là, la colombe descendit de l'arbre pour boire.", "ph": "α σε μομάν λα, λα κολονμπ ντεσανντί ντε λαρμπρ πουρ μπουάρ", "gr": "Εκείνη τη στιγμή, το περιστέρι κατέβηκε από το δέντρο για να πιει νερό.", "a": "c61ece325faa33fb"}]}, {"img": "fourmi/20", "lines": [{"fr": "La petite fourmi eut une idée.", "ph": "λα πετίτ φουρμί ου τουν ιντέ", "gr": "Το μικρό μυρμήγκι είχε μια ιδέα.", "a": "8d47cb1db5a55be9"}]}, {"img": "fourmi/21", "lines": [{"fr": "Elle sauta sur le pied d'un garçon, et le mordit aussi fort qu'elle put.", "ph": "ελ σοτά σουρ λε πιέ ντεν γκαρσόν, ε λε μορντί οσί φορ κελ που", "gr": "Πήδηξε πάνω στο πόδι ενός αγοριού και το δάγκωσε όσο πιο δυνατά μπορούσε.", "a": "5b79235072f1255d"}]}, {"img": "fourmi/22", "lines": [{"fr": "Le garçon sauta.", "ph": "λε γκαρσόν σοτά", "gr": "Το αγόρι πετάχτηκε στον αέρα.", "a": "fb083cc3d27c63c6"}, {"fr": "“Aïe!” S'écria-t-il.", "ph": "αϊ! σεκριά τιλ", "gr": "«Άουτς!» φώναξε.", "a": "f2aa014e4905e486"}]}, {"img": "fourmi/23", "lines": [{"fr": "La colombe fut surprise et s'envola dans un lieu sûr.", "ph": "λα κολονμπ φου σουρπρίζ ε σανβολά νταν ζεν λιέ σουρ", "gr": "Το περιστέρι ξαφνιάστηκε και πέταξε μακριά, σε ασφαλές μέρος.", "a": "f9e4b6ddb8dfad1e"}]}, {"img": "fourmi/24", "lines": [{"fr": "C'est ainsi que la petite fourmi remercia la colombe de lui avoir sauvé la vie.", "ph": "σε τενσί κε λα πετίτ φουρμί ρεμερσιά λα κολονμπ ντε λουί αβουάρ σοβέ λα βι", "gr": "Έτσι το μικρό μυρμήγκι ευχαρίστησε το περιστέρι που του έσωσε τη ζωή.", "a": "9531c1969664869c"}]}]}, {"id": "histoires", "title_fr": "Les Histoires avant de se coucher", "title_gr": "Οι ιστορίες πριν τον ύπνο", "level": 1, "summary_gr": "Ένα παιδί ακούει κάθε βράδυ τις ιστορίες που του λέει η μαμά του, μέχρι να το πάρει ο ύπνος.", "source": {"publisher": "StoryWeaver Community / Pratham Books", "url": "https://storyweaver.org.in/en/stories/12805-bed-time-stories", "licence": "CC BY 4.0", "authors": ["Cyrille Largillier"], "illustrators": ["Harshvardhan Gantha"]}, "cover": "histoires/cover", "pages": [{"img": "histoires/01", "lines": [{"fr": "Ma maman me raconte une histoire tous les soirs.", "ph": "μα μαμάν με ρακόντ ουν ιστουάρ του λε σουάρ", "gr": "Η μαμά μου μού λέει μια ιστορία κάθε βράδυ.", "a": "c4c3f1190aa05bf1"}]}, {"img": "histoires/02", "lines": [{"fr": "Il y a une histoire avec une grenouille qui parle.", "ph": "ιλ ι α ουν ιστουάρ αβέκ ουν γκρενούιγ κι παρλ", "gr": "Υπάρχει μια ιστορία με έναν βάτραχο που μιλάει.", "a": "8894cdde01d83787"}]}, {"img": "histoires/03", "lines": [{"fr": "Une autre histoire parle d’un roi avec une longue barbe.", "ph": "ουν οτρ ιστουάρ παρλ ντεν ρουά αβέκ ουν λονγκ μπαρμπ", "gr": "Μια άλλη ιστορία μιλάει για έναν βασιλιά με μακριά γενειάδα.", "a": "e4455b08f8c7d699"}]}, {"img": "histoires/04", "lines": [{"fr": "Une autre fois, il s’agit d’un éléphant volant.", "ph": "ουν οτρ φουά, ιλ σαζί ντεν ελεφάν βολάν", "gr": "Μια άλλη φορά, είναι για έναν ελέφαντα που πετάει.", "a": "720a0f2f5ae61120"}]}, {"img": "histoires/05", "lines": [{"fr": "Dans une histoire, un renard et un tigre sont amis.", "ph": "νταν ζουν ιστουάρ, εν ρενάρ ε εν τιγκρ σον ταμί", "gr": "Σε μια ιστορία, μια αλεπού και μια τίγρη είναι φίλοι.", "a": "5e775e9aaf8781af"}, {"fr": "Le tigre tombe dans un trou.", "ph": "λε τιγκρ τομπ νταν ζεν τρου", "gr": "Η τίγρη πέφτει μέσα σε μια τρύπα.", "a": "4ae376af9c2e1c69"}]}, {"img": "histoires/06", "lines": [{"fr": "Comment le tigre va-t-il sortir ?", "ph": "κομάν λε τιγκρ βα τιλ σορτίρ;", "gr": "Πώς θα βγει έξω η τίγρη;", "a": "5fef5fce68f78e9a"}]}, {"img": "histoires/07", "lines": [{"fr": "Alors, le renard intelligent sauve le tigre.", "ph": "αλόρ, λε ρενάρ εντελιζάν σοβ λε τιγκρ", "gr": "Τότε η έξυπνη αλεπού σώζει την τίγρη.", "a": "ee54c095f1e61af8"}, {"fr": "C’est la meilleure histoire.", "ph": "σε λα μειγέρ ιστουάρ", "gr": "Αυτή είναι η πιο ωραία ιστορία.", "a": "3f5d93ac5c9da3e2"}, {"fr": "J’écoute l’histoire et je m’endors.", "ph": "ζεκούτ λιστουάρ ε ζε μαντόρ", "gr": "Ακούω την ιστορία και με παίρνει ο ύπνος.", "a": "5aec65ebf195dffe"}]}]}, {"id": "lapin", "title_fr": "Le lapin sous un arbre", "title_gr": "Το κουνέλι κάτω από το δέντρο", "level": 3, "summary_gr": "Ένα κουνέλι κοιμάται κάτω από μια μηλιά, ένα μήλο πέφτει, και το ένα μετά το άλλο όλα τα ζώα αρχίζουν να τρέχουν χωρίς να ξέρουν γιατί.", "source": {"publisher": "African Storybook Initiative", "url": "https://storyweaver.org.in/en/stories/63682-le-lapin-sous-un-arbre", "licence": "CC BY 4.0", "authors": ["Phumy Zikode"], "illustrators": ["Wiehan de Jager"], "translators": ["Ode Laforge"]}, "cover": "lapin/cover", "pages": [{"img": "lapin/01", "lines": [{"fr": "Un lapin dormait sous un pommier.", "ph": "εν λαπέν ντορμέ σου εν πομιέ", "gr": "Ένα κουνέλι κοιμόταν κάτω από μια μηλιά.", "a": "71cea091675b8d59"}, {"fr": "Une pomme tomba d'une branche.", "ph": "ουν πομ τονμπά ντουν μπρανς", "gr": "Ένα μήλο έπεσε από ένα κλαδί.", "a": "2ecedd133bc694fb"}]}, {"img": "lapin/02", "lines": [{"fr": "Une voix dit: “Cours lapin cours!”", "ph": "ουν βουά ντι : κουρ λαπέν κουρ !", "gr": "Μια φωνή είπε: «Τρέχα κουνέλι τρέχα!»", "a": "914dd1a276b326a6"}, {"fr": "Il s'éveilla aussitôt et s'enfuit à toute vitesse.", "ph": "ιλ σεβεγιά οσιτό ε σανφουί α τουτ βιτές", "gr": "Ξύπνησε αμέσως και το έβαλε στα πόδια με όλη του την ταχύτητα.", "a": "4d9d4afe7711d704"}]}, {"img": "lapin/03", "lines": [{"fr": "Il rencontra un poulet.", "ph": "ιλ ρανκοντρά εν πουλέ", "gr": "Συνάντησε ένα κοτόπουλο.", "a": "b8f1c8e65fe41669"}, {"fr": "“Pourquoi cours-tu?” demanda le poulet.", "ph": "πουρκουά κουρ του ? ντεμανντά λε πουλέ", "gr": "«Γιατί τρέχεις;» ρώτησε το κοτόπουλο.", "a": "8ccb39c1c2aa9fe9"}, {"fr": "Le lapin répondit: “Je ne sais pas.", "ph": "λε λαπέν ρεπονντί : ζε νε σε πα", "gr": "Το κουνέλι απάντησε: «Δεν ξέρω.", "a": "4ddf30facbd825b0"}, {"fr": "J'ai juste entendu quelque chose tomber", "ph": "ζε ζουστ αντανντού κελκ σοζ τονμπέ", "gr": "Μόλις άκουσα κάτι να πέφτει", "a": "31d91b06c3142184"}, {"fr": "et une voix disait: “Cours lapin cours!”", "ph": "ε ουν βουά ντιζέ : κουρ λαπέν κουρ !", "gr": "και μια φωνή έλεγε: «Τρέχα κουνέλι τρέχα!»", "a": "5e7247094eb3188b"}]}, {"img": "lapin/04", "lines": [{"fr": "Le poulet eut peur.", "ph": "λε πουλέ ου πέρ", "gr": "Το κοτόπουλο φοβήθηκε.", "a": "f81be9b9ee9dde0f"}, {"fr": "Il se mit à courir en entendant ce que disait le lapin.", "ph": "ιλ σε μι α κουρίρ αν αντανντάν σε κε ντιζέ λε λαπέν", "gr": "Άρχισε να τρέχει ακούγοντας αυτά που έλεγε το κουνέλι.", "a": "07e08560f449905d"}]}, {"img": "lapin/05", "lines": [{"fr": "Ils rencontrèrent un chien.", "ph": "ιλ ρανκοντρέρ εν σιέν", "gr": "Συνάντησαν έναν σκύλο.", "a": "2047429f18d19258"}, {"fr": "Le chien demanda: “Pourquoi courez-vous?”", "ph": "λε σιέν ντεμανντά : πουρκουά κουρέ βου ?", "gr": "Ο σκύλος ρώτησε: «Γιατί τρέχετε;»", "a": "66ece51dae6a3d55"}, {"fr": "Le poulet dit: “Je ne sais pas,", "ph": "λε πουλέ ντι : ζε νε σε πα,", "gr": "Το κοτόπουλο είπε: «Δεν ξέρω,", "a": "e8dc31e149c32bff"}, {"fr": "j'ai juste entendu ce qu'a dit le lapin, et il ne sait pas.", "ph": "ζε ζουστ αντανντού σε κα ντι λε λαπέν, ε ιλ νε σε πα", "gr": "μόλις άκουσα τι είπε το κουνέλι, και δεν ξέρει.", "a": "545b7286661cc6b2"}, {"fr": "Il a entendu quelque chose tomber,", "ph": "ιλ α αντανντού κελκ σοζ τονμπέ,", "gr": "Άκουσε κάτι να πέφτει,", "a": "1454b247d65087b4"}, {"fr": "et une voix disait: “Cours, lapin, cours!”", "ph": "ε ουν βουά ντιζέ : κουρ, λαπέν, κουρ !", "gr": "και μια φωνή έλεγε: «Τρέχα, κουνέλι, τρέχα!»", "a": "38826d9f9ba3e025"}]}, {"img": "lapin/06", "lines": [{"fr": "Le chien fut surpris de ce qu'il entendait.", "ph": "λε σιέν φου σουρπρί ντε σε κιλ αντανντέ", "gr": "Ο σκύλος ξαφνιάστηκε με αυτά που άκουγε.", "a": "8b3bcc4b20706ff1"}, {"fr": "Il se mit à courir avec le lapin et le poulet.", "ph": "ιλ σε μι α κουρίρ αβέκ λε λαπέν ε λε πουλέ", "gr": "Άρχισε να τρέχει μαζί με το κουνέλι και το κοτόπουλο.", "a": "8ec17ab46510ae37"}]}, {"img": "lapin/07", "lines": [{"fr": "Ils rencontrèrent un cheval.", "ph": "ιλ ρανκοντρέρ εν σεβάλ", "gr": "Συνάντησαν ένα άλογο.", "a": "adf1700c1d602cef"}, {"fr": "Le cheval demanda au chien: “Pourquoi courez-vous?”", "ph": "λε σεβάλ ντεμανντά ο σιέν : πουρκουά κουρέ βου ?", "gr": "Το άλογο ρώτησε τον σκύλο: «Γιατί τρέχετε;»", "a": "c77d098909016308"}, {"fr": "Le chien dit: “Je ne sais pas,", "ph": "λε σιέν ντι : ζε νε σε πα,", "gr": "Ο σκύλος είπε: «Δεν ξέρω,", "a": "7185ec6c78d8d1a4"}, {"fr": "j'ai juste entendu ce qu'a dit le poulet, et il ne sait pas.", "ph": "ζε ζουστ αντανντού σε κα ντι λε πουλέ, ε ιλ νε σε πα", "gr": "μόλις άκουσα τι είπε το κοτόπουλο, και δεν ξέρει.", "a": "883dac892a7bb3b2"}, {"fr": "Il a entendu quelque chose tomber", "ph": "ιλ α αντανντού κελκ σοζ τονμπέ", "gr": "Άκουσε κάτι να πέφτει", "a": "1be37c9522b2d59a"}, {"fr": "et une voix disait: “Cours lapin cours!”", "ph": "ε ουν βουά ντιζέ : κουρ λαπέν κο
