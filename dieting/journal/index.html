<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151b">
<title>Diet journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTYiIGZpbGw9IiMxODIwMmEiLz48dGV4dCB4PSIzMiIgeT0iMzUiIGZvbnQtZmFtaWx5PSJIZWx2ZXRpY2EgTmV1ZSxBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjM0IiBmb250LXdlaWdodD0iNjAwIiBmaWxsPSIjZWVmM2Y3IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0iY2VudHJhbCI+ZDwvdGV4dD48L3N2Zz4=">
<style>
  /* The whole screen is the widget — no card floating on a paper margin.
     It fills the viewport edge to edge and the three parts spread out to
     use whatever height the phone gives it, growing on a tall screen
     instead of leaving space unused below.

     Palette: "Steel" — chosen 2026-09-04. The chrome (labels, tile borders,
     the weigh-in ring) is a cold blue that the deficit/surplus scale never
     uses, so nothing that stays the same competes for attention with the
     green and red that carry the meaning. */
  :root {
    --page:   #10151b;
    --card:   #18202a;
    --border: rgba(255,255,255,.12);
    --tile:   #131a22;
    --tile-border: rgba(110,168,216,.45);
    --ink:    #eef3f7;
    --dim:    #9fb0bf;
    --hair:   rgba(255,255,255,.11);
    /* chrome: labels and framing, never a data colour */
    --chrome:   #6ea8d8;
    --chrome-b: rgba(110,168,216,.55);
    /* chart */
    --line: #dfe8ef;          /* the actual weight line */
    --plan: #5fa87c;          /* the dashed plan */
    --mark: #6ea8d8;          /* a real weigh-in */
    --good: #74c48d;
    --warn: #e3b26f;
    /* the 90-day grid's own scale: green = deficit, red = surplus, grey =
       within 100 kcal of maintenance either way */
    --def-big:   #2ea043;
    --def-small: #74c48d;
    --neutral:   #6e7681;
    --sur-small: #ec9a80;
    --sur-big:   #cf4b3a;
    --none:   rgba(255,255,255,.18);
    --future: rgba(255,255,255,.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI',
      system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    line-height: 1.5; -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    height: 100svh; height: 100dvh;
    display: flex;
  }

  /* Everything must fit the viewport with no scroll: the widget is exactly
     viewport-high, the chart is the one flexible part that absorbs whatever
     height is left, and paddings/gaps/large type scale with viewport height
     so a short screen compresses instead of pushing the last card off. */
  .widget {
    flex: 1; width: 100%; max-width: 560px; margin: 0 auto; min-height: 0;
    padding: max(clamp(.8rem, 1.8vh, 1.6rem), env(safe-area-inset-top)) 1.25rem
      max(clamp(.8rem, 1.8vh, 1.6rem), env(safe-area-inset-bottom));
    display: flex; flex-direction: column; justify-content: space-between;
    gap: clamp(.7rem, 1.6vh, 1.6rem);
  }

  /* ---- header ----
     The day on the left, the calendar on the right, on one baseline, so the
     top row uses the whole width instead of stacking hard against the left
     edge. The target is a quiet line under the day: it never changes, so it
     must not be the loudest thing on the screen. */
  .head { display: flex; align-items: flex-end; justify-content: space-between;
    gap: .75rem; }
  .head .lhs { display: flex; flex-direction: column; min-width: 0; }
  .head .rhs { display: flex; flex-direction: column; align-items: flex-end;
    text-align: right; flex: 0 0 auto; }
  .day { font-size: min(clamp(2rem, 10vw, 3.2rem), 5.2vh); font-weight: 700;
    letter-spacing: -.03em; line-height: 1; }
  .day small { font-size: .45em; font-weight: 500; letter-spacing: -.01em;
    color: var(--dim); margin-left: .18em; }
  .goal { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: clamp(.62rem, 1.3vh, .74rem); letter-spacing: .07em;
    text-transform: uppercase; color: var(--chrome); margin-top: .35rem; }
  .dt { font-size: clamp(.85rem, 1.7vh, 1.05rem); font-weight: 600; }
  .left { font-size: clamp(.75rem, 1.5vh, .9rem); color: var(--dim); }

  /* ---- one part of the widget: a boxed card, not just a hairline ---- */
  .part { background: var(--card); border: 1.5px solid var(--border);
    border-radius: 18px; padding: clamp(.75rem, 1.7vh, 1.375rem) 1.25rem;
    box-shadow: 0 16px 36px rgba(0,0,0,.5), 0 3px 8px rgba(0,0,0,.3);
    display: flex; flex-direction: column; gap: clamp(.45rem, 1.1vh, .9rem);
    flex: 0 1 auto; min-height: 0; justify-content: center; }
  /* the curve card flexes and its chart soaks up the spare height;
     the grid and today cards keep their natural size */
  #curve { flex: 1 1 auto; min-height: 0; }
  /* the curve is the only part allowed to give up height on a short screen;
     the grid and today keep their natural size, so neither can be squeezed
     below its content and spill out of its own card */
  #grid, #today { flex: 0 0 auto; }
  /* the SVG is taken out of flow: a viewBox gives an SVG an intrinsic aspect
     ratio, and in flow that ratio fights the flex layout for height instead
     of obeying it */
  .chart { flex: 1; min-height: 90px; position: relative; }
  .chart svg { position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; }
  .row { display: flex; justify-content: space-between; align-items: baseline;
    gap: .6rem; font-size: clamp(.85rem, 1.5vh, .98rem); color: var(--dim); }
  .row b { color: var(--ink); font-weight: 600; }
  /* every figure that shares a row is capped by the width it has as well as
     by viewport height: a tall narrow phone gives a generous vh and a mean
     vw, and sizing on height alone pushed these numbers out of their boxes */
  .row .lg { font-size: clamp(1.25rem, min(3vh, 6.4vw), 2rem); font-weight: 700;
    letter-spacing: -.025em; color: var(--ink); white-space: nowrap; }
  .row .lg em { font-size: clamp(.72rem, 3vw, .9rem); font-weight: 400;
    font-style: normal; letter-spacing: 0; color: var(--dim); margin-left: .4rem; }
  /* the projection sits opposite today's weight and must stay on one line */
  .row .proj { text-align: right; white-space: nowrap;
    font-size: clamp(.72rem, 3vw, .98rem); }

  /* ---- the 90-day grid ---- */
  .cells { display: grid; grid-template-columns: repeat(15, 1fr);
    gap: clamp(3px, .6vh, 5px); }
  .cells i { display: block; aspect-ratio: 1; border-radius: 4px; }
  .logged { display: inline-flex; align-items: center; padding: .25rem .7rem;
    border-radius: 999px; border: 1.5px solid var(--chrome-b);
    font-size: .78rem; font-weight: 600; color: var(--ink); }

  /* ---- the legend, as the scale itself ----
     Five chips carrying the thresholds they stand for, read left to right as
     a number line: −600, −100, 0, +100, +600. The page is denominated in kcal
     everywhere else, so the legend is too, and a chip that states its own
     number needs no caption under it. */
  .key { display: flex; align-items: center; justify-content: center;
    gap: .35rem; flex-wrap: wrap;
    padding-top: .5rem; border-top: 1.5px solid var(--hair); }
  /* a ring and a full pill radius, so the legend never reads as another row
     of day squares: the cells above are bare 4px-radius blocks */
  .sz { height: 1.4rem; padding: 0 .5rem; border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,.32);
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: clamp(.62rem, 2.6vw, .72rem); font-weight: 600; }

  /* ---- today ---- */
  .cells4 { display: grid; grid-template-columns: repeat(4, 1fr);
    gap: clamp(.4rem, 1.6vw, .7rem); }
  .cells4 > div { background: var(--tile); border: 1.5px solid var(--border);
    border-radius: 12px; padding: clamp(.5rem, 1.2vh, .8rem) clamp(.35rem, 1.6vw, .6rem);
    min-width: 0; overflow: hidden; text-align: center; }
  .cells4 > div.has { border-color: var(--tile-border); }
  .cells4 .l { font-size: clamp(.58rem, 2.4vw, .68rem); font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .cells4 > div.has .l { color: var(--chrome); }
  .cells4 .v { font-size: clamp(.95rem, min(2.4vh, 4.4vw), 1.5rem); font-weight: 700;
    letter-spacing: -.02em; margin-top: .2rem; white-space: nowrap; }

  .good { color: var(--good); }
  .warn { color: var(--warn); }
  .def-big   { color: var(--def-big); }
  .def-small { color: var(--def-small); }
  .neutral   { color: var(--neutral); }
  .sur-small { color: var(--sur-small); }
  .sur-big   { color: var(--sur-big); }
  .empty { color: var(--dim); font-size: 1rem; font-style: italic; }

  @media (max-width: 340px) {
    .cells4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 560px) {
    body { padding: 2.5vh 0; }
    .widget { border-radius: 24px; min-height: 0; }
  }

  /* ---- landscape on a touch device (phone or tablet) ----
     The header runs across the top, the weight curve and the 90-day grid sit
     side by side as two equally sized cards, and today's four numbers run as
     a single strip underneath both of them.
     (hover:none)+(pointer:coarse) is phones/tablets, not desktop browser
     windows, which are usually landscape-shaped too but keep the plain
     portrait card via the >=560px rule above. */
  @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
    .widget {
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr auto;
      column-gap: 1rem;
      row-gap: .7rem;
    }
    .head  { grid-column: 1 / -1; }
    #curve { grid-column: 1; grid-row: 2; min-height: 0; }
    #grid  { grid-column: 2; grid-row: 2; min-height: 0; }
    #today { grid-column: 1 / -1; grid-row: 3; }
    /* the day heading is decorative-large for a portrait glance; on a
       short landscape screen it would eat the room the cards need */
    .day  { font-size: 1.9rem; }
    .goal { font-size: .64rem; margin-top: .25rem; }
    .part { gap: .4rem; padding: .7rem .9rem; }
    .chart { flex: 1; min-height: 0; }
    /* 10 across x 9 down fills the card, where 15 across left the squares
       stranded in the middle of a box as tall as the chart beside it. The
       rows take their height from what is left in the card rather than from
       a square aspect ratio, so the block can never push the legend out. */
    .cells { flex: 1; min-height: 0; grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(9, minmax(0, 1fr)); gap: clamp(3px, .8vh, 6px); }
    .cells i { aspect-ratio: auto; height: 100%; }
    .key { padding-top: .3rem; gap: .5rem; }
  }
</style>
</head>
<body>
  <div class="widget">
    <div class="head">
      <div class="lhs">
        <div class="day" id="day"></div>
        <div class="goal" id="goal"></div>
      </div>
      <div class="rhs">
        <div class="dt" id="dt"></div>
        <div class="left" id="left"></div>
      </div>
    </div>
    <div class="part" id="curve"></div>
    <div class="part" id="grid"></div>
    <div class="part" id="today"></div>
  </div>

<script>
(function () {
  var s = document.createElement('script');
  s.src = 'data.js?t=' + Date.now();   // never let the phone show a cached day
  s.onload = render;
  s.onerror = function () {
    document.getElementById('today').innerHTML =
      '<div class="empty">Data did not load.</div>';
  };
  document.head.appendChild(s);

  function render() {
  var plan = window.DIET.plan;
  var days = window.DIET.days.slice();
  var TARGET = plan.deficitTarget;
  var LEN    = plan.lengthDays;
  var REST   = plan.maintenanceRest;
  var DEFAULT_ACTIVE = plan.defaultActive != null ? plan.defaultActive : null;
  var KG     = 7700;                  // kcal per kg of fat

  function parseDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function iso(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
      '-' + String(d.getDate()).padStart(2,'0');
  }
  function dayOf(i) {                 // i-th day of the plan, 1-based, DST-safe
    return new Date(start.getFullYear(), start.getMonth(), start.getDate() + i - 1);
  }
  function fmtDate(d) {
    return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  }
  function daysBetween(a, b) {        // whole local days, DST-safe
    return Math.round((b - a) / 864e5);
  }
  function n(x)  {
    return (x == null || isNaN(x)) ? '—' : Math.round(x).toLocaleString('en-GB');
  }
  function signed(x) {                // a deficit shows negative, a surplus positive
    if (x == null || isNaN(x)) return '—';
    var r = Math.round(x);
    return (r > 0 ? '+' : '') + r.toLocaleString('en-GB');
  }
  function d1(x) {
    return (x == null || isNaN(x)) ? '—' :
      x.toLocaleString('en-GB', { minimumFractionDigits:1, maximumFractionDigits:1 });
  }
  function effActive(day) {           // his real Garmin figure, or the standing default
    return day.active != null ? day.active : DEFAULT_ACTIVE;
  }
  function deficit(day) {             // null when it cannot be computed yet
    var act = effActive(day);
    if (REST == null || act == null || day.eaten == null) return null;
    return REST + act - day.eaten;
  }
  var NEUTRAL = 100;                  // within this of maintenance either way = grey
  function cls(d) {                   // colour bucket: green = deficit, red = surplus
    if (d == null) return 'na';
    if (d > NEUTRAL)  return d >= TARGET ? 'def-big' : 'def-small';
    if (d < -NEUTRAL) return d <= -TARGET ? 'sur-big' : 'sur-small';
    return 'neutral';
  }

  days.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var byDate = {};
  days.forEach(function (d) { byDate[d.date] = d; });

  var start = parseDate(plan.start);
  var today = new Date(); today.setHours(0,0,0,0);
  var dayNo = daysBetween(start, today) + 1;
  var end   = new Date(start.getFullYear(), start.getMonth(), start.getDate() + LEN - 1);
  var elapsed = Math.max(0, Math.min(dayNo, LEN));
  var t = byDate[iso(today)];

  /* Weight is the axis. The plan promises this many kilos over its full
     length, so the goal weight follows from the start weight. */
  var goalKg = TARGET * LEN / KG;
  var wStart = plan.startWeight;
  var wGoal  = wStart - goalKg;

  /* Cumulative deficit, day by day. A day with no data adds nothing, which
     flattens the line for that day — that is the honest reading. */
  var run = 0, series = [wStart], cumDays = 0;
  for (var i = 1; i <= elapsed; i++) {
    var d0 = byDate[iso(dayOf(i))];
    var def = d0 ? deficit(d0) : null;
    if (def != null) { run += def; cumDays++; }
    series.push(wStart - run / KG);
  }
  var cumDef = run;
  var wNow   = wStart - cumDef / KG;
  var adher  = cumDays ? cumDef / (TARGET * cumDays) : null;
  var wProj  = elapsed ? wStart - (cumDef / elapsed) * LEN / KG : null;

  /* ---- header ---- */
  var dayEl  = document.getElementById('day'),
      goalEl = document.getElementById('goal'),
      dtEl   = document.getElementById('dt'),
      leftEl = document.getElementById('left');
  goalEl.textContent = 'target −' + TARGET + ' kcal / day';
  if (dayNo < 1) {
    var toStart = 1 - dayNo;          // counting down to day 1
    dayEl.innerHTML    = fmtDate(today);
    dtEl.textContent   = 'Starts ' + fmtDate(start);
    leftEl.textContent = toStart === 1 ? 'tomorrow' : 'in ' + toStart + ' days';
  } else if (dayNo > LEN) {
    dayEl.innerHTML    = 'Done <small>' + LEN + ' days</small>';
    dtEl.textContent   = fmtDate(today);
    leftEl.textContent = 'finished ' + fmtDate(end);
  } else {
    var rem = LEN - dayNo;            // days still to come after today
    dayEl.innerHTML    = 'Day ' + dayNo + ' <small>of ' + LEN + '</small>';
    dtEl.textContent   = fmtDate(today);
    leftEl.textContent = rem === 0 ? 'last day' : rem === 1 ? '1 day left'
      : rem + ' days left';
  }

  /* ============ 1 · the weight curve ============
     Descending, in real kilos, across the whole plan. Dashed = the plan, from
     the start weight down to the goal. Solid = where the deficits put him.
     The SVG is drawn at the box's real pixel size rather than a fixed viewBox
     stretched to fit: on a landscape tablet the box is taller than it is
     wide, and that stretch turned every stroke and every weigh-in ring into
     a smeared ellipse. */
  var curveEl = document.getElementById('curve');
  var hi = wStart + .4, lo = wGoal - .4;

  function drawChart() {
    var box = curveEl.querySelector('.chart');
    if (!box) return;
    var W = Math.max(140, Math.round(box.clientWidth));
    var H = Math.max(90,  Math.round(box.clientHeight));
    var PL = 30, PR = 8, PT = 12, PB = 12;
    function X(day) { return PL + day / LEN * (W - PL - PR); }
    function Y(w)   { return PT + (hi - w) / (hi - lo) * (H - PT - PB); }

    /* whole-kilo gridlines, so the room the plan line crosses reads as a
       scale instead of as emptiness */
    var step = (hi - lo) > 5 ? 2 : 1, ticks = '';
    for (var kg = Math.ceil(lo / step) * step; kg <= hi; kg += step) {
      ticks +=
        '<line x1="' + PL + '" y1="' + Y(kg).toFixed(1) + '" x2="' + (W - PR) +
          '" y2="' + Y(kg).toFixed(1) + '" stroke="currentColor" stroke-width="1" opacity=".16"/>' +
        '<text x="' + (PL - 7) + '" y="' + (Y(kg) + 3.5).toFixed(1) + '" text-anchor="end" ' +
          'font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace" ' +
          'fill="currentColor" opacity=".85">' + kg + '</text>';
    }

    var pts = series.map(function (w, i) { return X(i).toFixed(1) + ',' + Y(w).toFixed(1); });
    var scale = days.filter(function (d) { return d.weight != null; }).map(function (d) {
      var dn = daysBetween(start, parseDate(d.date)) + 1;
      return '<circle cx="' + X(Math.max(0, Math.min(LEN, dn))).toFixed(1) + '" cy="' +
        Y(d.weight).toFixed(1) + '" r="4" fill="none" stroke="var(--mark)" stroke-width="2"/>';
    }).join('');

    box.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" style="color:var(--dim)" ' +
        'aria-label="Weight from ' + d1(wStart) + ' towards ' + d1(wGoal) + ' kg">' +
        ticks +
        (elapsed ? '<line x1="' + X(elapsed).toFixed(1) + '" y1="' + PT + '" x2="' +
          X(elapsed).toFixed(1) + '" y2="' + (H - PB) + '" stroke="currentColor" ' +
          'stroke-width="1" stroke-dasharray="2 4" opacity=".3"/>' : '') +
        '<line x1="' + X(0).toFixed(1) + '" y1="' + Y(wStart).toFixed(1) + '" x2="' +
          X(LEN).toFixed(1) + '" y2="' + Y(wGoal).toFixed(1) + '" stroke="var(--plan)" ' +
          'stroke-width="2" stroke-dasharray="5 5"/>' +
        (elapsed ? '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--line)" ' +
          'stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' : '') +
        scale +
        '<circle cx="' + X(elapsed).toFixed(1) + '" cy="' + Y(wNow).toFixed(1) +
          '" r="4.5" fill="var(--line)"/>' +
      '</svg>';
  }

  var wToday = (t && t.weight != null) ? t.weight : null;
  if (wStart == null) {
    curveEl.innerHTML = '<div class="empty">Missing start weight (plan.startWeight).</div>';
  } else {
    curveEl.innerHTML =
      '<div class="row"><span><b>' + d1(wStart) + ' kg</b> start</span>' +
        '<span>target <b>' + d1(wGoal) + ' kg</b></span></div>' +
      '<div class="chart"></div>' +
      /* today's figure and where this pace lands share one row: a solo weight
         line left the whole right half of the card empty */
      '<div class="row"><span class="lg">' + d1(wToday != null ? wToday : wNow) + ' kg' +
        '<em>' + (wToday != null ? 'on the scale' : 'estimated today') + '</em></span>' +
        '<span class="proj"><b class="' +
        (wProj == null ? '' : wProj <= wGoal ? 'good' : 'warn') + '">' +
        d1(wProj) + (wProj == null ? '' : ' kg') + '</b> by day ' + LEN + '</span></div>';
  }

  /* ============ 2 · the 90-day grid ============ */
  var cells = '';
  for (var g = 1; g <= LEN; g++) {
    var gd = byDate[iso(dayOf(g))];
    var gdef = gd ? deficit(gd) : null;
    var color, lbl;
    if (g > elapsed)       { color = 'var(--future)'; lbl = 'Day ' + g; }
    else if (gdef == null) { color = 'var(--none)';   lbl = 'Day ' + g + ' · no data'; }
    else {
      color = 'var(--' + cls(gdef) + ')';
      lbl = 'Day ' + g + ' · ' + signed(-gdef) + ' kcal';
    }
    cells += '<i style="background:' + color + '" title="' + lbl + '"></i>';
  }
  document.getElementById('grid').innerHTML =
    '<div class="row"><span>Consistency <b class="' +
      (adher == null ? '' : adher >= .85 ? 'good' : adher >= .6 ? 'warn' : 'sur-big') + '">' +
      (adher == null ? '—' : Math.round(adher * 100) + '%') + '</b></span>' +
      '<span class="logged"><b>' + cumDays + '</b>&nbsp;of&nbsp;' + elapsed + ' logged</span></div>' +
    '<div class="cells">' + cells + '</div>' +
    '<div class="key">' +
      sz('def-big',   '−' + TARGET,  '#06210f') +
      sz('def-small', '−' + NEUTRAL, '#0d2a17') +
      sz('neutral',   '0',           '#101418') +
      sz('sur-small', '+' + NEUTRAL, '#2c1208') +
      sz('sur-big',   '+' + TARGET,  '#2a0800') +
      '</div>';
  function sz(k, label, ink) {
    return '<span class="sz" style="background:var(--' + k + ');color:' + ink + '">' +
      label + '</span>';
  }

  /* ============ 3 · today ============ */
  var tv;
  if (!t || (t.eaten == null && t.active == null)) {
    tv = '<div class="empty">Nothing logged today.</div>';
  } else {
    var tActive = effActive(t);
    var burn = (REST != null && tActive != null) ? REST + tActive : null;
    var tdef = deficit(t);
    tv = '<div class="cells4">' +
      cell('EATEN',   t.eaten  == null ? '—' : n(t.eaten), '') +
      cell('ACTIVE',  tActive  == null ? '—' : n(tActive), '') +
      cell('BURN',    burn     == null ? '—' : n(burn), '') +
      cell('DEFICIT', tdef     == null ? '—' : signed(-tdef), cls(tdef)) +
      '</div>';
  }
  document.getElementById('today').innerHTML = tv;
  function cell(l, v, c) {
    return '<div class="' + (v === '—' ? '' : 'has') + '"><div class="l">' + l +
      '</div><div class="v ' + c + '">' + v + '</div></div>';
  }

  /* The chart measures its own box, so it is drawn last and a frame later:
     until the grid and today cards are in the DOM that box is nearly the
     whole widget, and an SVG built at that height then refused to shrink
     back, squeezing the grid card until its content overflowed. */
  if (wStart != null) {
    requestAnimationFrame(drawChart);
    var redraw;
    window.addEventListener('resize', function () {
      clearTimeout(redraw); redraw = setTimeout(drawChart, 120);
    });
  }
  }
})();
</script>
</body>
</html>
