<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0ea">
<title>Ημερολόγιο διατροφής</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTYiIGZpbGw9IiMyNjJkMzMiLz48dGV4dCB4PSIzMiIgeT0iMzUiIGZvbnQtZmFtaWx5PSJIZWx2ZXRpY2EgTmV1ZSxBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjM0IiBmb250LXdlaWdodD0iNjAwIiBmaWxsPSIjZTZkY2NjIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0iY2VudHJhbCI+ZDwvdGV4dD48L3N2Zz4=">
<style>
  /* Paper palette, modern sans type (Inter). The top block is deliberately
     compact and self-sufficient: it is what a phone widget screenshot of
     this page needs to show — which day we are on, and how today stands. */
  :root {
    --paper:  #f3f0ea;
    --card:   #fffdf9;
    --ink:    #262d33;
    --soft:   #5f6a72;
    --faint:  #97a1a8;
    --line:   #e2ddd2;
    --accent: #9a5b46;
    --good:   #3d7a4f;
    --warn:   #a8762a;
    --bad:    #a4432f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI',
      system-ui, sans-serif;
    font-feature-settings: 'cv05' 1, 'ss03' 1;
    line-height: 1.5; -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 1.6rem 1.1rem 4rem; }

  a { color: var(--accent); }

  /* ---- hero / widget block ---- */
  .hero {
    background: var(--ink); color: #e9e2d6; border-radius: 16px;
    padding: 1.2rem 1.3rem 1.3rem; margin-bottom: 1rem;
  }
  .hero .kicker { font-size: .66rem;
    letter-spacing: .18em; text-transform: uppercase; color: #a9b2ba; }
  .hero .day { font-size: 2.5rem; font-weight: 650; letter-spacing: -.03em;
    line-height: 1.1; margin: .1rem 0 .1rem; }
  .hero .day small { font-size: 1.15rem; font-weight: 500; letter-spacing: -.01em;
    color: #a9b2ba; }
  .hero .date { font-size: .9rem; color: #cdc4b4; }
  /* ---- goal graphic: the bar is kilos, not days ----
     Fill = what the deficits add up to so far. The tick = where the plan says
     he should be today. The gap between them is the whole point. */
  .goal { margin-top: 1.05rem; }
  .goal .track { position: relative; height: 10px; background: #414b54;
    border-radius: 999px; margin: 0 0 .55rem; }
  .goal .track i { display: block; height: 100%; background: #e6dccc;
    border-radius: 999px; }
  .goal .track .tick { position: absolute; top: -5px; width: 2px; height: 20px;
    background: #8fd0a1; border-radius: 1px; }
  .goal .lead { display: flex; align-items: baseline; gap: .5rem; }
  .goal .big { font-size: 1.85rem; font-weight: 650; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; }
  .goal .of { font-size: .85rem; color: #a9b2ba; }
  .goal .verdict { font-size: .85rem; margin-top: .15rem; color: #cdc4b4; }
  .goal .verdict.good { color: #8fd0a1; }
  .goal .verdict.bad  { color: #ef9c86; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .55rem;
    margin-top: 1rem; }
  .stat { background: rgba(255,255,255,.06); border-radius: 10px; padding: .5rem .55rem; }
  .stat .l { font-size: .58rem; letter-spacing: .12em;
    text-transform: uppercase; color: #a9b2ba; }
  .stat .v { font-size: 1.15rem; font-weight: 600; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; margin-top: .1rem; }
  .stat .v.good { color: #8fd0a1; }
  .stat .v.warn { color: #e5b56b; }
  .stat .v.bad  { color: #ef9c86; }
  .hero .hint { margin: .8rem 0 0; font-size: .8rem; color: #a9b2ba; font-style: italic; }
  @media (max-width: 420px) {
    .hero .day { font-size: 2.1rem; }
    .goal .big { font-size: 1.6rem; }
  }

  /* ---- section titles ---- */
  .group { font-size: .68rem; letter-spacing: .16em;
    text-transform: uppercase; color: var(--faint); margin: 1.8rem 0 .7rem; }

  /* ---- week summary ---- */
  .week { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: .9rem 1.1rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
  .week .l { font-size: .58rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--faint); }
  .week .v { font-size: 1.05rem; font-weight: 600; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; margin-top: .1rem; }

  /* ---- day-by-day table ---- */
  .logCard { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: .7rem 1.1rem .8rem; }
  table.log { width: 100%; border-collapse: collapse; font-size: .87rem; }
  table.log th { font-size: .56rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint); font-weight: 500; text-align: right; padding: 0 0 .35rem; }
  table.log th:first-child, table.log td:first-child { text-align: left; }
  table.log td { padding: .36rem 0; border-top: 1px solid var(--line);
    text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.log .dn { font-weight: 600; }
  table.log .dt { color: var(--faint); font-weight: 400; font-size: .78rem; }
  table.log tr.today .dn { color: var(--accent); }
  table.log tr.miss .dn, table.log tr.miss td { color: var(--faint); font-weight: 400; }
  table.log td.def { font-weight: 600; }
  table.log td.def.good { color: var(--good); }
  table.log td.def.warn { color: var(--warn); }
  table.log td.def.bad  { color: var(--bad); }
  table.log td.def.na   { color: var(--faint); font-weight: 400; }
  table.log tfoot td { border-top: 2px solid var(--line); padding-top: .45rem;
    font-weight: 600; }
  table.log tfoot .dt { font-weight: 400; }

  /* ---- day cards ---- */
  .dayCard { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 1rem 1.15rem; margin-bottom: .8rem; }
  .dayCard header { display: flex; justify-content: space-between; align-items: baseline;
    gap: .6rem; margin-bottom: .5rem; }
  .dayCard h2 { font-size: 1.02rem; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .dayCard h2 span { color: var(--faint); font-size: .85rem; font-weight: 400; }
  .dayCard .deficit { font-size: .72rem; font-weight: 500;
    letter-spacing: .01em; border-radius: 999px; padding: .16rem .6rem; white-space: nowrap; }
  .deficit.good { background: #e4efe6; color: var(--good); }
  .deficit.warn { background: #f4ead7; color: var(--warn); }
  .deficit.bad  { background: #f6e2dc; color: var(--bad); }
  .deficit.na   { background: var(--paper); color: var(--faint); }

  table.items { width: 100%; border-collapse: collapse; font-size: .9rem; }
  table.items td { padding: .22rem 0; vertical-align: top; }
  table.items td.k { text-align: right; white-space: nowrap; color: var(--soft);
    font-variant-numeric: tabular-nums; padding-left: .8rem; }
  table.items td .n { color: var(--faint); font-size: .8rem; font-style: italic; }
  table.items tr.total td { border-top: 1px solid var(--line); padding-top: .4rem;
    font-weight: 600; }
  .empty { color: var(--faint); font-style: italic; font-size: .88rem; }

  .meta { margin-top: .55rem; font-size: .84rem; color: var(--soft); }
  .meta b { font-weight: 600; }
  .note { margin-top: .45rem; font-size: .84rem; color: var(--faint); font-style: italic; }

</style>
</head>
<body>
<div class="wrap">

  <div class="hero" id="hero"></div>

  <div class="group">Τελευταίες 7 ημέρες</div>
  <div class="week" id="week"></div>

  <div class="group">Ημέρα προς ημέρα</div>
  <div class="logCard" id="log"></div>

  <div class="group">Το ημερολόγιο — νεότερα πρώτα</div>
  <div id="days"></div>

</div>

<script src="data.js"></script>
<script>
(function () {
  var plan = window.DIET.plan;
  var days = window.DIET.days.slice();
  var TARGET = plan.deficitTarget;
  var REST = plan.maintenanceRest;   // may be null until provided

  function parseDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtDate(d) {
    return d.toLocaleDateString('el-GR', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function iso(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
      '-' + String(d.getDate()).padStart(2,'0');
  }
  function daysBetween(a, b) {      // whole local days, DST-safe
    return Math.round((b - a) / 864e5);
  }
  function consumed(day) {
    return day.items.reduce(function (s, it) { return s + (it.kcal || 0); }, 0);
  }
  function deficit(day) {           // null when it cannot be computed yet
    if (REST == null || day.active == null) return null;
    return REST + day.active - consumed(day);
  }
  function cls(d) {
    if (d == null) return 'na';
    if (d >= TARGET - 100) return 'good';
    if (d >= TARGET - 350) return 'warn';
    return 'bad';
  }
  function n(x) { return Math.round(x).toLocaleString('el-GR'); }

  days.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var byDate = {};
  days.forEach(function (d) { byDate[d.date] = d; });

  /* ---- hero ---- */
  var start = parseDate(plan.start);
  var today = new Date(); today.setHours(0,0,0,0);
  var dayNo = daysBetween(start, today) + 1;
  var inPlan = dayNo >= 1 && dayNo <= plan.lengthDays;
  var end = new Date(start.getFullYear(), start.getMonth(),
    start.getDate() + plan.lengthDays - 1);
  var elapsed = Math.max(0, Math.min(dayNo, plan.lengthDays));
  var t = byDate[iso(today)];

  /* Every elapsed plan day, plus anything logged outside the plan. A day that
     was never logged still gets a row — as a gap, not as silence. */
  var rowDates = {};
  days.forEach(function (d) { rowDates[d.date] = 1; });
  for (var i = 1; i <= elapsed; i++) {
    rowDates[iso(new Date(start.getFullYear(), start.getMonth(),
      start.getDate() + i - 1))] = 1;
  }
  var dates = Object.keys(rowDates).sort().reverse();

  var cumDef = 0, cumDays = 0;                 // only days whose deficit is known
  dates.forEach(function (ds) {
    var def = byDate[ds] ? deficit(byDate[ds]) : null;
    if (def != null) { cumDef += def; cumDays++; }
  });

  var KG = 7700;                               // kcal per kg of fat
  var goalKg     = TARGET * plan.lengthDays / KG;   // what the plan promises
  var lostKg     = cumDef / KG;                     // what the deficits add up to
  var expectedKg = TARGET * elapsed / KG;           // where the plan says he is today
  var aheadKg    = lostKg - expectedKg;
  var adherence  = cumDays ? cumDef / (TARGET * cumDays) : null;
  var perWeek    = cumDays ? (cumDef / cumDays) * 7 / KG : null;

  function kg(x, digits) {
    var dp = digits == null ? 2 : digits;
    return x.toLocaleString('el-GR',
      { minimumFractionDigits: dp, maximumFractionDigits: dp }) + ' kg';
  }

  var h = '<div class="kicker">Ημερολόγιο διατροφής · −' + TARGET + ' kcal</div>';
  if (dayNo < 1) {
    h += '<div class="day">Ξεκινά ' + fmtDate(start) + '</div>';
  } else if (dayNo > plan.lengthDays) {
    h += '<div class="day">Τέλος <small>· ' + plan.lengthDays + ' ημέρες</small></div>';
  } else {
    h += '<div class="day">Ημέρα ' + dayNo + ' <small>από ' + plan.lengthDays + '</small></div>';
  }
  h += '<div class="date">' + fmtDate(today) + ' · έως ' + fmtDate(end) + '</div>';

  var fillPct = Math.max(0, Math.min(100, (lostKg / goalKg) * 100));
  var tickPct = Math.max(0, Math.min(100, (expectedKg / goalKg) * 100));
  h += '<div class="goal">' +
    '<div class="track"><i style="width:' + fillPct.toFixed(1) + '%"></i>' +
      '<span class="tick" style="left:' + tickPct.toFixed(1) + '%"></span></div>' +
    '<div class="lead"><span class="big">' + kg(lostKg) + '</span>' +
      '<span class="of">από ' + kg(goalKg, 1) + ' στόχο</span></div>';
  if (!cumDays) {
    h += '<div class="verdict">Καμία μέρα με πλήρη στοιχεία ακόμη.</div>';
  } else {
    var missing = elapsed - cumDays;
    h += '<div class="verdict ' + (aheadKg >= -0.1 ? 'good' : 'bad') + '">' +
      (aheadKg >= 0 ? 'Μπροστά από το πρόγραμμα κατά ' : 'Πίσω από το πρόγραμμα κατά ') +
      kg(Math.abs(aheadKg)) +
      (missing > 0 ? ' · ' + missing + (missing === 1 ? ' ημέρα' : ' ημέρες') +
        ' χωρίς στοιχεία' : '') + '</div>';
  }
  h += '</div>';

  h += '<div class="stats">' +
    stat('ΣΥΝΕΠΕΙΑ', adherence == null ? '—' : Math.round(adherence * 100) + '%',
      adherence == null ? '' : (adherence >= .85 ? 'good' : adherence >= .6 ? 'warn' : 'bad')) +
    stat('ΚΑΤΑΓΡΑΦΗ', elapsed ? cumDays + '/' + elapsed : '—', '') +
    stat('ΡΥΘΜΟΣ/ΕΒΔ', perWeek == null ? '—' : kg(perWeek), '') +
    '</div>';
  if (REST == null) h += '<p class="hint">Το έλλειμμα χρειάζεται τις θερμίδες συντήρησης σε ηρεμία.</p>';
  document.getElementById('hero').innerHTML = h;

  function stat(l, v, c) {
    return '<div class="stat"><div class="l">' + l + '</div><div class="v ' + c + '">' + v + '</div></div>';
  }

  /* ---- week summary ---- */
  var logged = days.filter(function (d) { return d.items.length || d.active != null; });
  var last7 = logged.slice(-7);
  var w = '';
  if (last7.length) {
    var avgC = last7.reduce(function (s, d) { return s + consumed(d); }, 0) / last7.length;
    var defs = last7.map(deficit).filter(function (x) { return x != null; });
    var avgD = defs.length ? defs.reduce(function (s, x) { return s + x; }, 0) / defs.length : null;
    var kgWeek = avgD != null ? (avgD * 7) / KG : null;
    w = wk('ΜΕΣΗ ΠΡΟΣΛΗΨΗ', n(avgC) + ' kcal') +
        wk('ΜΕΣΟ ΕΛΛΕΙΜΜΑ', avgD == null ? '—' : n(avgD) + ' kcal') +
        wk('≈ ΑΝΑ ΕΒΔΟΜΑΔΑ', kgWeek == null ? '—' : kg(kgWeek));
  } else {
    w = '<div class="empty" style="grid-column:1/-1">Καμία καταγεγραμμένη ημέρα ακόμη.</div>';
  }
  document.getElementById('week').innerHTML = w;
  function wk(l, v) { return '<div><div class="l">' + l + '</div><div class="v">' + v + '</div></div>'; }

  /* ---- day-by-day table ---- */
  function fmtShort(d) {
    return d.toLocaleDateString('el-GR', { weekday: 'short' }) + ' ' +
      d.getDate() + '/' + (d.getMonth() + 1);
  }
  var todayIso = iso(today);

  if (!dates.length) {
    document.getElementById('log').innerHTML =
      '<div class="empty">Καμία ημέρα ακόμη.</div>';
  } else {
    var lg = '<table class="log"><thead><tr><th>Ημέρα</th><th>Έφαγα</th>' +
      '<th>Ενεργές</th><th>Έλλειμμα</th></tr></thead><tbody>';
    dates.forEach(function (ds) {
      var d = byDate[ds];
      var dt = parseDate(ds);
      var dn = daysBetween(start, dt) + 1;
      var def = d ? deficit(d) : null;
      var trc = [];
      if (ds === todayIso) trc.push('today');
      if (!d || !d.items.length) trc.push('miss');
      lg += '<tr class="' + trc.join(' ') + '">' +
        '<td><span class="dn">' + dn + '</span> <span class="dt">' + fmtShort(dt) + '</span></td>' +
        '<td>' + (d && d.items.length ? n(consumed(d)) : '—') + '</td>' +
        '<td>' + (d && d.active != null ? n(d.active) : '—') + '</td>' +
        '<td class="def ' + cls(def) + '">' + (def == null ? '—' : n(def)) + '</td>' +
        '</tr>';
    });
    lg += '</tbody><tfoot><tr>' +
      '<td>Σύνολο <span class="dt">· ' + cumDays + (cumDays === 1 ? ' ημέρα' : ' ημέρες') + '</span></td>' +
      '<td colspan="2" class="dt">≈ ' + kg(lostKg) + ' λίπους</td>' +
      '<td>' + (cumDays ? n(cumDef) : '—') + '</td>' +
      '</tr></tfoot></table>';
    document.getElementById('log').innerHTML = lg;
  }

  /* ---- day cards ---- */
  var out = '';
  days.slice().reverse().forEach(function (d) {
    var dn = daysBetween(start, parseDate(d.date)) + 1;
    var def = deficit(d);
    out += '<div class="dayCard"><header><h2>Ημέρα ' + dn + ' <span>· ' +
      fmtDate(parseDate(d.date)) + '</span></h2>' +
      '<span class="deficit ' + cls(def) + '">' +
      (def == null ? 'έλλειμμα —' : 'έλλειμμα ' + n(def)) + '</span></header>';

    if (d.items.length) {
      out += '<table class="items">';
      d.items.forEach(function (it) {
        out += '<tr><td>' + it.name +
          (it.note ? ' <span class="n">— ' + it.note + '</span>' : '') +
          '</td><td class="k">' + n(it.kcal) + '</td></tr>';
      });
      out += '<tr class="total"><td>Σύνολο</td><td class="k">' + n(consumed(d)) +
        '</td></tr></table>';
    } else {
      out += '<div class="empty">Καμία καταγραφή τροφής.</div>';
    }

    var meta = [];
    if (d.active != null) meta.push('<b>' + n(d.active) + '</b> ενεργές θερμίδες (Garmin)');
    if (d.exercise && d.exercise.length) meta.push(d.exercise.join(' · '));
    if (meta.length) out += '<div class="meta">' + meta.join(' · ') + '</div>';
    if (d.note) out += '<div class="note">' + d.note + '</div>';
    out += '</div>';
  });
  document.getElementById('days').innerHTML = out;
})();
</script>
</body>
</html>
