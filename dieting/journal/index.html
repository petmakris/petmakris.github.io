<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0ea">
<title>Diet journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTYiIGZpbGw9IiMyNjJkMzMiLz48dGV4dCB4PSIzMiIgeT0iMzUiIGZvbnQtZmFtaWx5PSJIZWx2ZXRpY2EgTmV1ZSxBcmlhbCxzYW5zLXNlcmlmIiBmb250LXNpemU9IjM0IiBmb250LXdlaWdodD0iNjAwIiBmaWxsPSIjZTZkY2NjIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0iY2VudHJhbCI+ZDwvdGV4dD48L3N2Zz4=">
<style>
  /* The whole screen is the widget — no card floating on a paper margin.
     It fills the viewport edge to edge and the three parts spread out to
     use whatever height the phone gives it, growing on a tall screen
     instead of leaving space unused below. */
  :root {
    --paper:  #f3f0ea;
    --page:   #12161a;
    --card:   #1d2329;
    --border: rgba(255,255,255,.16);
    --tile:   #171c21;
    --tile-border: rgba(255,255,255,.14);
    --ink:    #fbf7ef;
    --dim:    #c7cfd6;
    --sub:    #d9d0be;
    --hair:   rgba(255,255,255,.12);
    --cream:  #e6dccc;
    --good:   #8fd0a1;
    --warn:   #e5b56b;
    --bad:    #ef9c86;
    --none:   rgba(255,255,255,.18);
    --future: rgba(255,255,255,.06);
    /* the 90-day grid's own scale: green = deficit, red = surplus, grey =
       within 100 kcal of maintenance either way */
    --def-big:   #5fb37b;
    --def-small: #a9d9b6;
    --neutral:   #9aa3ad;
    --sur-small: #eab3a0;
    --sur-big:   #d9614a;
    --accent: #f5c56d;
    --accent-ink: #1a1408;
    --accent-glow: rgba(245,197,109,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI',
      system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    line-height: 1.5; -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    height: 100svh; height: 100dvh;
    display: flex;
  }

  /* Everything must fit the viewport with no scroll: the widget is exactly
     viewport-high, the chart is the one flexible part that absorbs whatever
     height is left, and paddings/gaps/large type scale with viewport height
     so a short screen compresses instead of pushing the last card off. */
  .widget {
    flex: 1; width: 100%; max-width: 560px; margin: 0 auto; min-height: 0;
    padding: max(clamp(.8rem, 1.8vh, 1.6rem), env(safe-area-inset-top)) 1.25rem
      max(clamp(.8rem, 1.8vh, 1.6rem), env(safe-area-inset-bottom));
    display: flex; flex-direction: column; justify-content: space-between;
    gap: clamp(.7rem, 1.6vh, 1.6rem);
  }
  /* portrait: the column wrappers are invisible, kids lay out flat in .widget */
  .col-left, .col-right { display: contents; }

  /* ---- header ---- */
  .kicker { display: inline-flex; align-self: flex-start; align-items: center;
    padding: .38rem .75rem; border-radius: 999px; background: var(--accent);
    color: var(--accent-ink); font-size: .72rem; font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase;
    box-shadow: 0 4px 12px var(--accent-glow); }
  .day { font-size: min(clamp(2.2rem, 11vw, 3.6rem), 5.5vh); font-weight: 700;
    letter-spacing: -.03em; line-height: 1.08; margin: .4rem 0 .1rem;
    text-shadow: 0 0 24px var(--accent-glow); }
  .day small { font-size: .48em; font-weight: 500; letter-spacing: -.01em;
    color: var(--dim); }
  .date { font-size: clamp(.85rem, 1.6vh, 1.05rem); color: var(--sub); }

  /* ---- one part of the widget: a boxed card, not just a hairline ---- */
  .part { background: var(--card); border: 1.5px solid var(--border);
    border-radius: 18px; padding: clamp(.75rem, 1.7vh, 1.375rem) 1.25rem;
    box-shadow: 0 16px 36px rgba(0,0,0,.55), 0 3px 8px rgba(0,0,0,.35);
    display: flex; flex-direction: column; gap: clamp(.45rem, 1.1vh, .9rem);
    flex: 0 1 auto; min-height: 0; justify-content: center; }
  /* the curve card flexes and its chart soaks up the spare height;
     the grid and today cards keep their natural size */
  #curve { flex: 1 1 auto; }
  .chart { flex: 1; min-height: 60px; }
  .row { display: flex; justify-content: space-between; align-items: baseline;
    gap: .6rem; font-size: clamp(.85rem, 1.5vh, .98rem); color: var(--dim); }
  .row b { color: var(--ink); font-weight: 600; }
  .row .lg { font-size: clamp(1.4rem, 3vh, 2rem); font-weight: 700;
    letter-spacing: -.025em; color: var(--ink); white-space: nowrap; }
  .row .lg em { font-size: .9rem; font-weight: 400; font-style: normal;
    letter-spacing: 0; color: var(--dim); margin-left: .5rem; }

  /* ---- the weight curve ---- */
  .chart svg { width: 100%; height: 100%; display: block; }

  /* ---- the 90-day grid ---- */
  .cells { display: grid; grid-template-columns: repeat(15, 1fr);
    gap: clamp(3px, .6vh, 5px); }
  .cells i { display: block; aspect-ratio: 1; border-radius: 4px; }
  .logged { display: inline-flex; align-items: center; padding: .25rem .7rem;
    border-radius: 999px; background: rgba(255,255,255,.1);
    border: 1.5px solid var(--border); font-size: .78rem; font-weight: 600;
    color: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: .5rem .6rem;
    padding-top: .25rem; border-top: 1.5px solid var(--hair); }
  .legend span { display: inline-flex; align-items: center; padding: .25rem .65rem;
    border-radius: 999px; font-size: .74rem; font-weight: 700; }
  .legend .pill-def-big   { background: var(--def-big);   color: #0d2113; }
  .legend .pill-def-small { background: var(--def-small); color: #123018; }
  .legend .pill-neutral   { background: var(--neutral);   color: #12161a; }
  .legend .pill-sur-small { background: var(--sur-small); color: #2c1208; }
  .legend .pill-sur-big   { background: var(--sur-big);   color: #2a0800; }
  .legend .pill-none { background: rgba(255,255,255,.1); border: 1px solid var(--border);
    color: var(--dim); }

  /* ---- today ---- */
  .cells4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; }
  .cells4 > div { background: var(--tile); border: 1.5px solid var(--tile-border);
    border-radius: 12px; padding: clamp(.5rem, 1.2vh, .8rem) .6rem; }
  .cells4 > div.has { border-color: var(--accent); }
  .cells4 .l { font-size: .68rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); }
  .cells4 > div.has .l { color: var(--accent); }
  .cells4 .v { font-size: clamp(1.1rem, 2.4vh, 1.5rem); font-weight: 700;
    letter-spacing: -.02em; margin-top: .2rem; }

  .good { color: var(--good); }
  .warn { color: var(--warn); }
  .bad  { color: var(--bad); }
  .def-big   { color: var(--def-big); }
  .def-small { color: var(--def-small); }
  .neutral   { color: var(--neutral); }
  .sur-small { color: var(--sur-small); }
  .sur-big   { color: var(--sur-big); }
  .empty { color: var(--dim); font-size: 1rem; font-style: italic; }

  @media (max-width: 340px) {
    .cells4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 560px) {
    body { padding: 2.5vh 0; }
    .widget { border-radius: 24px; min-height: 0; }
  }

  /* ---- landscape on a touch device (phone or tablet) ----
     Two columns so nothing scrolls: header+curve on the left, the
     90-day grid and today's numbers on the right. Each column stacks
     and shares height on its own terms — the tall 90-day grid must
     not steal room from the curve on the other side.
     (hover:none)+(pointer:coarse) is phones/tablets, not desktop
     browser windows, which are usually landscape-shaped too but keep
     the plain portrait card via the >=560px rule above. */
  @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
    .widget {
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
      column-gap: 1.8rem;
    }
    .col-left, .col-right {
      display: flex; flex-direction: column; gap: .5rem; min-height: 0;
    }
    /* the day heading is decorative-large for a portrait glance; on a
       short landscape screen it would eat the room the curve needs */
    .day  { font-size: 1.9rem; margin: .3rem 0 .1rem; }
    .kicker { font-size: .64rem; padding: .3rem .6rem; }
    .date { font-size: .88rem; }
    .part { gap: .4rem; padding: .65rem .8rem; }
    /* the grid card is exactly as tall as its 90 squares need; the today
       card takes every remaining pixel and its four tiles grow into it as
       a 2x2 block, instead of four small tiles floating in a half-empty box */
    .col-right #grid  { flex: 0 0 auto; }
    .col-right #today { flex: 1 1 auto; }
    .col-right #today .cells4 { flex: 1; grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 1fr; gap: .6rem; }
    .col-right #today .cells4 > div { display: flex; flex-direction: column;
      justify-content: center; padding: .6rem .9rem; }
    .col-right #today .cells4 .l { font-size: .78rem; }
    .col-right #today .cells4 .v { font-size: clamp(1.5rem, 4.4vh, 2.5rem);
      margin-top: .25rem; }
    #curve { min-height: 0; }
    .chart { flex: 1; min-height: 0; }
    .chart svg { height: 100%; }
    /* the four filled legend pills are the tightest fit in this column —
       keep them to one line down to the smallest landscape phone width */
    .legend { gap: .3rem .35rem; padding-top: .2rem; }
    .legend span { padding: .2rem .5rem; font-size: .68rem; }
  }
</style>
</head>
<body>
  <div class="widget">
    <div class="col-left">
      <div class="head">
        <div class="kicker" id="kicker"></div>
        <div class="day" id="day"></div>
        <div class="date" id="date"></div>
      </div>
      <div class="part" id="curve"></div>
    </div>
    <div class="col-right">
      <div class="part" id="grid"></div>
      <div class="part" id="today"></div>
    </div>
  </div>

<script>
(function () {
  var s = document.createElement('script');
  s.src = 'data.js?t=' + Date.now();   // never let the phone show a cached day
  s.onload = render;
  s.onerror = function () {
    document.getElementById('today').innerHTML =
      '<div class="empty">Data did not load.</div>';
  };
  document.head.appendChild(s);

  function render() {
  var plan = window.DIET.plan;
  var days = window.DIET.days.slice();
  var TARGET = plan.deficitTarget;
  var LEN    = plan.lengthDays;
  var REST   = plan.maintenanceRest;
  var DEFAULT_ACTIVE = plan.defaultActive != null ? plan.defaultActive : null;
  var KG     = 7700;                  // kcal per kg of fat

  function parseDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function iso(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
      '-' + String(d.getDate()).padStart(2,'0');
  }
  function dayOf(i) {                 // i-th day of the plan, 1-based, DST-safe
    return new Date(start.getFullYear(), start.getMonth(), start.getDate() + i - 1);
  }
  function fmtDate(d) {
    return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  }
  function daysBetween(a, b) {        // whole local days, DST-safe
    return Math.round((b - a) / 864e5);
  }
  function n(x)  {
    return (x == null || isNaN(x)) ? '—' : Math.round(x).toLocaleString('en-GB');
  }
  function signed(x) {                // a deficit shows negative, a surplus positive
    if (x == null || isNaN(x)) return '—';
    var r = Math.round(x);
    return (r > 0 ? '+' : '') + r.toLocaleString('en-GB');
  }
  function d1(x) {
    return (x == null || isNaN(x)) ? '—' :
      x.toLocaleString('en-GB', { minimumFractionDigits:1, maximumFractionDigits:1 });
  }
  function effActive(day) {           // his real Garmin figure, or the standing default
    return day.active != null ? day.active : DEFAULT_ACTIVE;
  }
  function deficit(day) {             // null when it cannot be computed yet
    var act = effActive(day);
    if (REST == null || act == null || day.eaten == null) return null;
    return REST + act - day.eaten;
  }
  var NEUTRAL = 100;                  // within this of maintenance either way = grey
  function cls(d) {                   // colour bucket: green = deficit, red = surplus
    if (d == null) return 'na';
    if (d > NEUTRAL)  return d >= TARGET ? 'def-big' : 'def-small';
    if (d < -NEUTRAL) return d <= -TARGET ? 'sur-big' : 'sur-small';
    return 'neutral';
  }

  days.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var byDate = {};
  days.forEach(function (d) { byDate[d.date] = d; });

  var start = parseDate(plan.start);
  var today = new Date(); today.setHours(0,0,0,0);
  var dayNo = daysBetween(start, today) + 1;
  var end   = new Date(start.getFullYear(), start.getMonth(), start.getDate() + LEN - 1);
  var elapsed = Math.max(0, Math.min(dayNo, LEN));
  var t = byDate[iso(today)];

  /* Weight is the axis. The plan promises this many kilos over its full
     length, so the goal weight follows from the start weight. */
  var goalKg = TARGET * LEN / KG;
  var wStart = plan.startWeight;
  var wGoal  = wStart - goalKg;

  /* Cumulative deficit, day by day. A day with no data adds nothing, which
     flattens the line for that day — that is the honest reading. */
  var run = 0, series = [wStart], cumDays = 0;
  for (var i = 1; i <= elapsed; i++) {
    var d0 = byDate[iso(dayOf(i))];
    var def = d0 ? deficit(d0) : null;
    if (def != null) { run += def; cumDays++; }
    series.push(wStart - run / KG);
  }
  var cumDef = run;
  var wNow   = wStart - cumDef / KG;
  var adher  = cumDays ? cumDef / (TARGET * cumDays) : null;
  var wProj  = elapsed ? wStart - (cumDef / elapsed) * LEN / KG : null;

  /* ---- header ---- */
  document.getElementById('kicker').textContent =
    'Diet journal · −' + TARGET + ' kcal';
  var dayEl = document.getElementById('day'), dateEl = document.getElementById('date');
  if (dayNo < 1) {
    var toStart = 1 - dayNo;          // counting down to day 1
    dayEl.innerHTML    = fmtDate(today);
    dateEl.textContent = toStart === 1 ? 'Starts tomorrow'
      : 'Starts in ' + toStart + ' days · ' + fmtDate(start);
  } else if (dayNo > LEN) {
    dayEl.innerHTML    = 'Done <small>· ' + LEN + ' days</small>';
    dateEl.textContent = fmtDate(today) + ' · finished ' + fmtDate(end);
  } else {
    var rem = LEN - dayNo;            // days still to come after today
    dayEl.innerHTML    = 'Day ' + dayNo + ' <small>of ' + LEN + '</small>';
    dateEl.textContent = fmtDate(today) + ' · ' +
      (rem === 0 ? 'last day' : rem === 1 ? '1 day left' : rem + ' days left');
  }

  /* ============ 1 · the weight curve ============
     Descending, in real kilos. Dashed = the plan, from the start weight down
     to the goal over the full length. Solid = where the deficits put him.
     The SVG is drawn at the box's real pixel size rather than a fixed 340x150
     viewBox stretched to fit: on a landscape tablet the box is taller than it
     is wide, and that stretch turned every stroke and every weigh-in ring into
     a smeared ellipse. */
  var curveEl = document.getElementById('curve');
  var hi = wStart + .4, lo = wGoal - .4;

  function drawChart() {
    var box = curveEl.querySelector('.chart');
    if (!box) return;
    var W = Math.max(140, Math.round(box.clientWidth));
    var H = Math.max(90,  Math.round(box.clientHeight));
    var PL = 30, PR = 8, PT = 12, PB = 12;
    function X(day) { return PL + day / LEN * (W - PL - PR); }
    function Y(w)   { return PT + (hi - w) / (hi - lo) * (H - PT - PB); }

    /* whole-kilo gridlines, so the room the plan line crosses reads as a
       scale instead of as emptiness */
    var step = (hi - lo) > 5 ? 2 : 1, ticks = '';
    for (var kg = Math.ceil(lo / step) * step; kg <= hi; kg += step) {
      ticks +=
        '<line x1="' + PL + '" y1="' + Y(kg).toFixed(1) + '" x2="' + (W - PR) +
          '" y2="' + Y(kg).toFixed(1) + '" stroke="#ffffff" stroke-width="1" opacity=".07"/>' +
        '<text x="' + (PL - 7) + '" y="' + (Y(kg) + 3.5).toFixed(1) + '" text-anchor="end" ' +
          'font-size="10" fill="#8b96a3">' + kg + '</text>';
    }

    var pts = series.map(function (w, i) { return X(i).toFixed(1) + ',' + Y(w).toFixed(1); });
    var scale = days.filter(function (d) { return d.weight != null; }).map(function (d) {
      var dn = daysBetween(start, parseDate(d.date)) + 1;
      return '<circle cx="' + X(Math.max(0, Math.min(LEN, dn))).toFixed(1) + '" cy="' +
        Y(d.weight).toFixed(1) + '" r="4" fill="none" stroke="#e5b56b" stroke-width="2"/>';
    }).join('');

    box.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
        'aria-label="Weight from ' + d1(wStart) + ' towards ' + d1(wGoal) + ' kg">' +
        ticks +
        (elapsed ? '<line x1="' + X(elapsed).toFixed(1) + '" y1="' + PT + '" x2="' +
          X(elapsed).toFixed(1) + '" y2="' + (H - PB) + '" stroke="#ffffff" ' +
          'stroke-width="1" stroke-dasharray="2 4" opacity=".16"/>' : '') +
        '<line x1="' + X(0).toFixed(1) + '" y1="' + Y(wStart).toFixed(1) + '" x2="' +
          X(LEN).toFixed(1) + '" y2="' + Y(wGoal).toFixed(1) + '" stroke="#8fd0a1" ' +
          'stroke-width="2" stroke-dasharray="5 5" opacity=".8"/>' +
        (elapsed ? '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#e6dccc" ' +
          'stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' : '') +
        scale +
        '<circle cx="' + X(elapsed).toFixed(1) + '" cy="' + Y(wNow).toFixed(1) +
          '" r="4.5" fill="#e6dccc"/>' +
      '</svg>';
  }

  var wToday = (t && t.weight != null) ? t.weight : null;
  if (wStart == null) {
    curveEl.innerHTML = '<div class="empty">Missing start weight (plan.startWeight).</div>';
  } else {
    curveEl.innerHTML =
      '<div class="row"><span><b>' + d1(wStart) + ' kg</b> start</span>' +
        '<span>target <b>' + d1(wGoal) + ' kg</b></span></div>' +
      '<div class="chart"></div>' +
      '<div class="row"><span class="lg">' + d1(wToday != null ? wToday : wNow) + ' kg' +
        '<em>' + (wToday != null ? 'on the scale' : 'estimated today') + '</em></span></div>' +
      '<div class="row"><span>at this pace</span><span><b class="' +
        (wProj == null ? '' : wProj <= wGoal ? 'good' : 'warn') + '">' + d1(wProj) +
        (wProj == null ? '' : ' kg') + '</b> by day ' + LEN + '</span></div>';
    drawChart();
    var redraw;
    window.addEventListener('resize', function () {
      clearTimeout(redraw); redraw = setTimeout(drawChart, 120);
    });
  }

  /* ============ 2 · the 90-day grid ============ */
  var cells = '';
  for (var g = 1; g <= LEN; g++) {
    var gd = byDate[iso(dayOf(g))];
    var gdef = gd ? deficit(gd) : null;
    var color, lbl;
    if (g > elapsed)       { color = 'var(--future)'; lbl = 'Day ' + g; }
    else if (gdef == null) { color = 'var(--none)';   lbl = 'Day ' + g + ' · no data'; }
    else {
      color = 'var(--' + cls(gdef) + ')';
      lbl = 'Day ' + g + ' · ' + signed(-gdef) + ' kcal';
    }
    cells += '<i style="background:' + color + '" title="' + lbl + '"></i>';
  }
  document.getElementById('grid').innerHTML =
    '<div class="row"><span>Consistency <b class="' +
      (adher == null ? '' : adher >= .85 ? 'good' : adher >= .6 ? 'warn' : 'bad') + '">' +
      (adher == null ? '—' : Math.round(adher * 100) + '%') + '</b></span>' +
      '<span class="logged"><b>' + cumDays + '</b>&nbsp;of&nbsp;' + elapsed + ' logged</span></div>' +
    '<div class="cells">' + cells + '</div>' +
    '<div class="legend">' +
      lg('def-big',   'over −' + TARGET) +
      lg('def-small', '−' + NEUTRAL + ' to −' + TARGET) +
      lg('neutral',   '±' + NEUTRAL) +
      lg('sur-small', '+' + NEUTRAL + ' to +' + TARGET) +
      lg('sur-big',   'over +' + TARGET) +
      lg('none', 'no data') +
    '</div>';
  function lg(k, txt) {
    return '<span class="pill-' + k + '">' + txt + '</span>';
  }

  /* ============ 3 · today ============ */
  var tv;
  if (!t || (t.eaten == null && t.active == null)) {
    tv = '<div class="empty">Nothing logged today.</div>';
  } else {
    var tActive = effActive(t);
    var burn = (REST != null && tActive != null) ? REST + tActive : null;
    var tdef = deficit(t);
    tv = '<div class="cells4">' +
      cell('EATEN',   t.eaten  == null ? '—' : n(t.eaten), '') +
      cell('ACTIVE',  tActive  == null ? '—' : n(tActive), '') +
      cell('BURN',    burn     == null ? '—' : n(burn), '') +
      cell('DEFICIT', tdef     == null ? '—' : signed(-tdef), cls(tdef)) +
      '</div>';
  }
  document.getElementById('today').innerHTML = tv;
  function cell(l, v, c) {
    return '<div class="' + (v === '—' ? '' : 'has') + '"><div class="l">' + l +
      '</div><div class="v ' + c + '">' + v + '</div></div>';
  }
  }
})();
</script>
</body>
</html>
